    .hn-sprout-divider {

              <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js?v=25"></script>
  <script>
    // Supabase Client Setup
    const SUPABASE_URL = 'https://wnaqfadlxrrvvjvqqbch.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduYXFmYWRseHJydnZqdnFxYmNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzg4NTYsImV4cCI6MjEwNDkxNDg1Nn0.aZcWAzKfjHkozCus4V_xD3BwDSL8KIIEhASdf2NtdtM';

    let sbClient = null;
    if (window.supabase && typeof window.supabase.createClient === 'function') {
      try {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
          }
        });
        window.supabaseClient = sbClient;
      } catch (err) {
        console.warn('Supabase init warning:', err);
      }
    }

    // Google Sign-In Direct OAuth Trigger
    window.handleGoogleSignIn = async function() {
      const googleBtn = document.getElementById('btn-google');
      const alertBox = document.getElementById('regAlert');
      const origText = googleBtn ? googleBtn.innerHTML : '';

      if (alertBox) {
        alertBox.style.display = 'none';
      }

      if (googleBtn) {
        googleBtn.disabled = true;
        googleBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Connecting to Google...';
      }

      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('192.168.');

      try {
        if (sbClient && sbClient.auth) {
          const redirectUrl = isLocal
            ? `${window.location.origin}/register.html`
            : `${window.location.origin}${window.location.pathname}${window.location.search}`;

          const { data, error } = await sbClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: redirectUrl,
              queryParams: {
                access_type: 'offline',
                prompt: 'consent'
              }
            }
          });

          if (!error && data && data.url) {
            window.location.href = data.url;
            return;
          }

          if (error) {
            console.warn('[Google Auth] Supabase OAuth notice:', error.message);
            if (!isLocal) throw error;
          }
        }

        if (isLocal) {
          const emailInput = prompt('Google Sign-In (Local Development Mode):\nEnter your Google email address to continue:');
          if (emailInput && emailInput.trim()) {
            const cleanEmail = emailInput.trim().toLowerCase();
            const cleanName = cleanEmail.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            await processRegisterSession({
              user: {
                id: 'google-local-' + Date.now(),
                email: cleanEmail,
                user_metadata: {
                  full_name: cleanName,
                  name: cleanName,
                  avatar_url: `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(cleanName)}&backgroundColor=d97706,b45309,f59e0b`
                }
              },
              access_token: 'local_gtoken_' + Date.now()
            });
            return;
          } else {
            if (googleBtn) {
              googleBtn.disabled = false;
              googleBtn.innerHTML = origText;
            }
            return;
          }
        }

        throw new Error('Google Sign-In service is currently unavailable. Please check your connection.');
      } catch (err) {
        console.error('Google auth error:', err);
        if (alertBox) {
          alertBox.className = 'hn-alert-box alert alert-danger';
          alertBox.innerText = err.message || 'Google sign-in failed. Please try again.';
          alertBox.style.display = 'block';
        }
        if (googleBtn) {
          googleBtn.disabled = false;
          googleBtn.innerHTML = origText;
        }
      }
    };

    async function processRegisterSession(session) {
      if (!session || !session.user) return;
      const sbUser = session.user;

      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: sbUser.email,
            name: sbUser.user_metadata?.full_name || sbUser.user_metadata?.name || sbUser.email.split('@')[0],
            avatar: sbUser.user_metadata?.avatar_url || sbUser.user_metadata?.picture || '',
            googleId: sbUser.id
          })
        }).then(r => r.json());

        const finalToken = (res && res.token) ? res.token : session.access_token;
        const finalUser = (res && res.user) ? res.user : {
          id: sbUser.id,
          email: sbUser.email,
          name: sbUser.user_metadata?.full_name || sbUser.user_metadata?.name || sbUser.email.split('@')[0],
          avatar: sbUser.user_metadata?.avatar_url || '',
          role: 'customer'
        };

        localStorage.setItem('hn_auth_token', finalToken);
        localStorage.setItem('token', finalToken);
        localStorage.setItem('hn_user_profile', JSON.stringify(finalUser));
        localStorage.setItem('hn_user', JSON.stringify(finalUser));
        localStorage.setItem('user', JSON.stringify(finalUser));

        const alertBox = document.getElementById('regAlert');
        if (alertBox) {
          alertBox.className = 'hn-alert-box alert alert-success';
          alertBox.innerText = `Welcome, ${finalUser.name}! 🌸 Signed in with Google. Redirecting...`;
          alertBox.style.display = 'block';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const redirectParam = urlParams.get('redirect');

        setTimeout(() => {
          if (redirectParam) {
            window.location.href = redirectParam;
          } else {
            window.location.href = '/index.html';
          }
        }, 350);

      } catch (err) {
        console.error('Google register session error:', err);
        window.location.href = '/index.html';
      }
    }


    window.handleRegisterSubmit = async function(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const name = document.getElementById('reg-name')?.value.trim();
      const email = document.getElementById('reg-email')?.value.trim();
      const phone = document.getElementById('reg-phone')?.value.trim();
      const address = document.getElementById('reg-address')?.value.trim();
      const password = document.getElementById('reg-password')?.value || 'devotee123';
      const btn = document.getElementById('btn-register');
      const alertBox = document.getElementById('regAlert');

      if (alertBox) {
        alertBox.style.display = 'none';
        alertBox.className = 'hn-alert-box alert alert-danger';
      }

      if (!name) {
        if (alertBox) {
          alertBox.innerText = 'Full Name is required.';
          alertBox.style.display = 'block';
        }
        document.getElementById('reg-name')?.focus();
        return false;
      }

      if (!phone) {
        if (alertBox) {
          alertBox.innerText = 'Mobile / WhatsApp Number is required.';
          alertBox.style.display = 'block';
        }
        document.getElementById('reg-phone')?.focus();
        return false;
      }

      if (!email) {
        if (alertBox) {
          alertBox.innerText = 'Email address is required.';
          alertBox.style.display = 'block';
        }
        document.getElementById('reg-email')?.focus();
        return false;
      }

      const origText = btn ? btn.innerHTML : '<span>Save Profile & Continue 🌸</span>';
      if (btn) {
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Saving profile...';
        btn.disabled = true;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password, address })
        });
        const data = await res.json();

        const userObj = (data && data.user) ? data.user : {
          id: 'devotee-' + Date.now(),
          name: name,
          email: email,
          phone: phone,
          address: address,
          role: 'customer'
        };
        const token = (data && data.token) ? data.token : 'token_' + Date.now();

        localStorage.setItem('hn_auth_token', token);
        localStorage.setItem('hn_user_profile', JSON.stringify(userObj));
        localStorage.setItem('hn_user', JSON.stringify(userObj));
        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(userObj));

        renderHeader('account');

        if (alertBox) {
          alertBox.className = 'hn-alert-box alert alert-success';
          alertBox.innerText = 'Profile completed successfully! Welcome 🌸';
          alertBox.style.display = 'block';
        }

        if (typeof showToast === 'function') {
          showToast(`Welcome to Harinama Store, ${name}! 🌸`);
        }

        setTimeout(() => {
          const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '/account.html';
          window.location.href = redirectUrl;
        }, 500);
        return false;

      } catch (err) {
        console.warn('Network issue on profile save, creating local profile:', err);
        const demoUser = {
          id: 'devotee-' + Date.now(),
          name: name,
          email: email,
          phone: phone,
          address: address,
          role: 'customer'
        };
        const token = 'token_' + Date.now();
        localStorage.setItem('hn_auth_token', token);
        localStorage.setItem('hn_user_profile', JSON.stringify(demoUser));
        localStorage.setItem('hn_user', JSON.stringify(demoUser));
        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(demoUser));

        renderHeader('account');

        if (typeof showToast === 'function') {
          showToast(`Welcome, ${name}! 🌸`);
        }

        setTimeout(() => {
          const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '/account.html';
          window.location.href = redirectUrl;
        }, 500);
      }

      return false;
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();

      // Check if redirected with active Supabase OAuth session
      if (sbClient && sbClient.auth) {
        sbClient.auth.onAuthStateChange(async (event, session) => {
          if (session && session.user) {
            await processRegisterSession(session);
          }
        });

        sbClient.auth.getSession().then(({ data: { session } }) => {
          if (session && session.user) {
            processRegisterSession(session);
          }
        }).catch(e => console.warn('Supabase session check:', e));
      }

      // Pre-fill email from query parameter or stored profile
      const urlParams = new URLSearchParams(window.location.search);
      const emailParam = urlParams.get('email');
      const emailInput = document.getElementById('reg-email');
      const nameInput = document.getElementById('reg-name');

      if (emailParam && emailInput) {
        emailInput.value = emailParam;
      } else if (emailInput && !emailInput.value) {
        const storedUser = JSON.parse(localStorage.getItem('hn_user_profile') || localStorage.getItem('hn_user') || '{}');
        if (storedUser.email) emailInput.value = storedUser.email;
      }

      if (nameInput) {
        nameInput.focus();
      }

      const form = document.getElementById('registerForm');
      if (form) form.addEventListener('submit', window.handleRegisterSubmit);
    });
  </script>
