<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Sample Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <!-- Header Placeholder -->
  <div id="hn-header-placeholder"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
          <div class="row g-0">
            
            <!-- Left Lavender Visual Panel -->
            <div class="col-md-5 p-5 text-center d-flex flex-column justify-content-between" style="background: var(--cres-hero-bg);">
              <div>
                <h3 class="fw-bold mb-2">Reset &amp; Get Back</h3>
                <p class="text-muted small">Don't worry, we'll help you reset your password.</p>
              </div>

              <div class="my-4">
                <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=400&q=80" alt="Earbuds" class="img-fluid rounded-4 shadow-sm" style="max-height: 200px; object-fit: contain;">
              </div>

              <div>
                <span class="badge bg-primary-subtle text-primary py-2 px-3 rounded-pill fw-semibold">Instant Secure Recovery</span>
              </div>
            </div>

            <!-- Right Form Panel -->
            <div class="col-md-7 p-5 d-flex flex-column justify-content-center">
              <h4 class="fw-bold mb-2">Forgot Password</h4>
              <p class="text-muted small mb-4">Enter your email address and we'll send you a link to reset your password.</p>

              <form onsubmit="handleForgotSubmit(event)">
                <div class="mb-4">
                  <label class="form-label small fw-bold">Email Address</label>
                  <input type="email" required class="form-control rounded-pill px-3" placeholder="user@example.com">
                </div>

                <button type="submit" class="btn cres-btn-primary w-100 py-3 fw-bold mb-3">
                  Send Reset Link
                </button>

                <div class="text-center">
                  <a href="/login.html" class="text-muted small text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                  </a>
                </div>
              </form>
            </div>

          </div>
        </div>

        <!-- Bottom Trust Strip (Matching Reference) -->
        <div class="row g-4 mt-4 text-center">
          <div class="col-md-4">
            <div class="p-3 bg-white rounded-4 border d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-shield-check text-primary fs-5"></i>
              <span class="small fw-semibold">Secure Process</span>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 bg-white rounded-4 border d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-lightning text-primary fs-5"></i>
              <span class="small fw-semibold">Quick &amp; Easy</span>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 bg-white rounded-4 border d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-headset text-primary fs-5"></i>
              <span class="small fw-semibold">24/7 Support</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('');
      renderFooter();
    });

    window.handleForgotSubmit = (e) => {
      e.preventDefault();
      showToast('Password reset link sent to your email! 📩', 'success');
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 1500);
    };
  </script>
</body>
</html>
