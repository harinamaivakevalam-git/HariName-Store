<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Harinama Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
  <!-- Brand Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/krishna-logo.jpg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/krishna-logo.jpg">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          
          <div class="card border rounded shadow-sm bg-white p-4 p-md-5">
            <h3 class="hn-section-title text-center mb-2" style="font-size: 1.6rem;">Reset Password</h3>
            <p class="text-secondary text-center small mb-4">Enter your registered email to receive a password reset link.</p>

            <form onsubmit="handleForgotSubmit(event)">
              <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Email Address</label>
                <input type="email" id="forgot-email" required class="form-control" placeholder="user@harinama.com">
              </div>

              <button type="submit" class="btn hn-btn-gold w-100 py-3 fw-bold mb-3" id="btn-forgot">
                Send Reset Link
              </button>

              <div class="text-center small text-muted">
                Remember your password? <a href="/login.html" class="text-navy fw-bold text-decoration-underline">Back to Login</a>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    function handleForgotSubmit(e) {
      e.preventDefault();
      showToast('Password reset link sent to your email with instructions.');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();
    });
  </script>
</body>
</html>
