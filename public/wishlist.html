<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist - Sample Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Reusable CRESCENDO Header -->
  <div id="cres-header-placeholder"></div>

  <!-- Main Container -->
  <main class="container py-4">
    <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
      <div>
        <h2 class="cres-page-title mb-1">My Wishlist</h2>
        <p class="text-muted mb-0">Your saved products</p>
      </div>
      <div class="d-flex gap-2" id="wishlist-header-actions">
        <button class="btn btn-outline-secondary rounded-pill px-3 py-2 small fw-semibold" onclick="clearAllWishlist()">
          <i class="bi bi-trash me-1"></i> Clear Wishlist
        </button>
        <button class="btn btn-cres-primary rounded-pill px-4 py-2 small fw-semibold" onclick="addAllWishlistToCart()">
          <i class="bi bi-bag-plus me-1"></i> Add All to Cart
        </button>
      </div>
    </div>

    <!-- Wishlist Grid -->
    <div class="row g-4" id="wishlist-grid-container">
      <!-- Generated via JS -->
    </div>
  </main>

  <!-- Reusable CRESCENDO Footer -->
  <div id="cres-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    function renderWishlistPage() {
      const container = document.getElementById('wishlist-grid-container');
      if (!container) return;

      const wishlistIds = window.crescendoWishlist || [];
      const products = window.CRESCENDO_DATA.products.filter(p => wishlistIds.includes(p.id));

      if (products.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <div class="cres-card p-5 max-w-md mx-auto" style="max-width: 500px; margin: 0 auto;">
              <i class="bi bi-heart text-danger display-3 mb-3 d-block opacity-75"></i>
              <h4 class="fw-bold mb-2">Your wishlist is empty</h4>
              <p class="text-muted mb-4">Explore our premier audio collection and save your favorite devices.</p>
              <a href="/products.html" class="btn btn-cres-primary rounded-pill px-4 py-2">Explore Products</a>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(prod => `
        <div class="col-sm-6 col-lg-4 col-xl-3" id="wishlist-item-${prod.id}">
          <div class="cres-card p-3 h-100 d-flex flex-column position-relative">
            <!-- Remove Button -->
            <button class="btn btn-sm btn-light rounded-circle position-absolute top-0 end-0 m-3 shadow-sm border" style="width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center; z-index: 5;" onclick="removeWishlistItem('${prod.id}')" title="Remove">
              <i class="bi bi-x-lg text-muted" style="font-size: 0.8rem;"></i>
            </button>

            <!-- Product Image -->
            <a href="/product-details.html?id=${prod.id}" class="cres-product-img-box mb-3 d-block">
              <img src="${prod.image}" alt="${prod.name}">
            </a>

            <!-- Content -->
            <div class="flex-grow-1">
              <h6 class="fw-bold mb-1">
                <a href="/product-details.html?id=${prod.id}" class="text-dark text-decoration-none">${prod.name}</a>
              </h6>
              
              <div class="cres-stars mb-2">
                <i class="bi bi-star-fill text-warning"></i>
                <i class="bi bi-star-fill text-warning"></i>
                <i class="bi bi-star-fill text-warning"></i>
                <i class="bi bi-star-fill text-warning"></i>
                <i class="bi bi-star-fill text-warning"></i>
                <span class="text-muted ms-1 small">(${prod.reviews_count})</span>
              </div>

              <div class="fw-bold text-dark fs-5 mb-3">$${prod.price.toFixed(2)} USD</div>
            </div>

            <!-- Add to Cart Button -->
            <button class="btn btn-cres-primary rounded-pill w-100 py-2 fw-semibold" onclick="window.cresAddToCart('${prod.id}', 1, 'Default')">
              <i class="bi bi-cart-plus me-1"></i> Add to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    function removeWishlistItem(productId) {
      window.cresToggleWishlist(productId);
      renderWishlistPage();
    }

    function clearAllWishlist() {
      if (!confirm('Are you sure you want to clear your wishlist?')) return;
      window.crescendoWishlist = [];
      localStorage.setItem('cres_wishlist', JSON.stringify([]));
      window.cresUpdateCounters();
      renderWishlistPage();
      window.cresShowToast('Wishlist cleared.');
    }

    function addAllWishlistToCart() {
      const wishlistIds = window.crescendoWishlist || [];
      if (wishlistIds.length === 0) {
        window.cresShowToast('Wishlist is empty.');
        return;
      }
      wishlistIds.forEach(id => {
        window.cresAddToCart(id, 1, 'Standard');
      });
      window.cresShowToast('All wishlist items added to shopping cart! 🛒');
    }

    document.addEventListener('DOMContentLoaded', () => {
      // If empty for first time demo, populate with 3 default items matching reference
      if (!window.crescendoWishlist || window.crescendoWishlist.length === 0) {
        window.crescendoWishlist = ['prod-002', 'prod-003', 'prod-006'];
        localStorage.setItem('cres_wishlist', JSON.stringify(window.crescendoWishlist));
        window.cresUpdateCounters();
      }
      renderWishlistPage();
    });
  </script>
</body>
</html>
