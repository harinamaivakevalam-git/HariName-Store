<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Addresses — Harinama Store</title>
  
  <!-- Google Fonts: Poppins Master Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
  <!-- Brand Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/krishna-logo.jpg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/krishna-logo.jpg">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      
      <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
        <h1 class="hn-section-title mb-0" style="font-size: 2rem;">Saved Addresses</h1>
        <button class="btn hn-btn-gold btn-sm" onclick="showToast('Add address modal')">
          <i class="bi bi-plus me-1"></i> Add New Address
        </button>
      </div>

      <div class="row g-4">
        
        <!-- Left Sidebar Navigation -->
        <div class="col-lg-3">
          <div class="bg-white border rounded p-3 shadow-sm">
            <div class="d-flex flex-column gap-1">
              <a href="/account.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-person"></i> Profile Overview
              </a>
              <a href="/orders.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-box-seam"></i> My Orders
              </a>
              <a href="/wishlist.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-heart"></i> Wishlist
              </a>
              <a href="/addresses.html" class="p-2 rounded text-navy fw-bold bg-light d-flex align-items-center gap-2">
                <i class="bi bi-geo-alt"></i> Addresses
              </a>
            </div>
          </div>
        </div>

        <!-- Right Addresses Grid -->
        <div class="col-lg-9">
          <div class="row g-4">
            
            <div class="col-md-6">
              <div class="card border rounded p-4 shadow-sm bg-white position-relative">
                <span class="badge bg-warning text-dark position-absolute top-0 end-0 m-3">Default</span>
                <h6 class="fw-bold mb-2 text-navy">Gauranga Das (Home)</h6>
                <p class="text-secondary small mb-3">
                  Flat 402, Radharani Kripa Apartments,<br>
                  Near ISKCON Temple Road, Raman Reti,<br>
                  Vrindavan, Uttar Pradesh - 281121<br>
                  Phone: +91 91234 56789
                </p>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-dark btn-sm" onclick="showToast('Edit address')">Edit</button>
                  <button class="btn btn-outline-danger btn-sm" onclick="showToast('Cannot delete default address')">Delete</button>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();
    });
  </script>
</body>
</html>
