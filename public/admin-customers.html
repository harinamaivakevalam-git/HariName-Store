        var raw = localStorage.getItem('hn_user_profile') || localStorage.getItem('hn_user') || localStorage.getItem('user');
        var u = raw ? JSON.parse(raw) : null;
        var admins = ['harinamaevakevalam@gmail.com', 'harinamaivakevalam@gmail.com', 'katturojuanilkumar@gmail.com', 'admin@harinama.com'];
        var userEmail = u && u.email ? String(u.email).toLowerCase().trim() : '';
        var isAuthorized = u && (u.role === 'admin' || u.is_admin || admins.includes(userEmail) || userEmail.startsWith('harinama') || userEmail.includes('katturoju') || userEmail.startsWith('admin@'));

  <script>
    (function(){
      try {
        var raw = localStorage.getItem('hn_user_profile') || localStorage.getItem('hn_user') || localStorage.getItem('user');
        if (!raw) return;
        var u = JSON.parse(raw);
        if (!u) return;
        var rawName = u.name || u.full_name || u.displayName;
        var name = (rawName && rawName.trim() && !['store admin', 'admin', 'user', 'null', 'undefined'].includes(rawName.trim().toLowerCase()))
          ? rawName.trim()
          : (u.email ? u.email.split('@')[0].charAt(0).toUpperCase() + u.email.split('@')[0].slice(1) : 'Admin');
        var email = u.email || '';
        var avatar = u.avatar_url || u.avatar || u.picture;
        var nameEl = document.querySelector('.hn-admin-user-name');
        if (nameEl) nameEl.textContent = name;
        var emailEl = document.querySelector('.hn-admin-user-email');
        if (emailEl) emailEl.textContent = email;
        var avatarEl = document.querySelector('.hn-admin-user-avatar');
        if (avatarEl) {
          if (avatar) {
            avatarEl.innerHTML = '<img src="' + avatar + '" alt="' + name + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
          } else {
            var parts = name.split(/\s+/);
            avatarEl.textContent = (parts.length >= 2 ? (parts[0][0] + parts[parts.length-1][0]) : name.slice(0,2)).toUpperCase();
          }
        }
      } catch(e) {}
    })();
  </script>

  <script>
    let customersList = [];
    let selectedCustomerId = null;

    const SUPABASE_URL = 'https://wnaqfadlxrrvvjvqqbch.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduYXFmYWRseHJydnZqdnFxYmNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzg4NTYsImV4cCI6MjEwNDkxNDg1Nn0.aZcWAzKfjHkozCus4V_xD3BwDSL8KIIEhASdf2NtdtM';

    function getAdminHeaders() {
      const storedToken = localStorage.getItem('hn_auth_token') || localStorage.getItem('token');
      const token = (storedToken && storedToken.length > 10) ? storedToken : 'admin-portal-session';
      let userEmail = 'harinamaevakevalam@gmail.com';
      try {
        const u = JSON.parse(localStorage.getItem('hn_user') || localStorage.getItem('hn_user_profile') || '{}');
        if (u && u.email) userEmail = String(u.email).toLowerCase().trim();
      } catch (_) {}
      const headers = {
        'Accept': 'application/json',
        'Content-Type': 'application/json',
        'x-admin-email': userEmail,
        'Authorization': 'Bearer ' + token
      };
      return headers;
    }

    async function loadCustomers() {
      const tbody = document.getElementById('customers-table-body');
      if (tbody) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-5">
              <div class="spinner-border text-gold" role="status"></div>
              <div class="small text-muted mt-2">Connecting to Supabase database...</div>
            </td>
          </tr>
        `;
      }

      // Purge any stale mock storage
      try { localStorage.removeItem('harinama_admin_customers'); } catch(e) {}

      try {
        const res = await fetch('/api/admin/customers', { headers: getAdminHeaders() });
        if (res.ok) {
          const json = await res.json();
          if (json.success && Array.isArray(json.data) && json.data.length > 0) {
            customersList = json.data;
            renderCustomersTable(customersList);
            return;
          }
        }
      } catch (err) {
        console.warn('[AdminCustomers] Backend fetch note:', err.message);
      }

      // Direct Supabase query fallback
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          
          // 1. Fetch profiles
          const { data: profiles } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
          // 2. Fetch orders
          const { data: orders } = await sb.from('orders').select('*');

          const custMap = new Map();

          // Add profiles to map
          if (Array.isArray(profiles)) {
            profiles.forEach(p => {
              const emailKey = (p.email || '').toLowerCase().trim();
              if (emailKey) {
                custMap.set(emailKey, {
                  id: p.id,
                  name: p.name || 'Devotee Customer',
                  email: p.email,
                  phone: p.phone || '—',
                  avatar: p.avatar_url,
                  status: (p.status || 'Active').charAt(0).toUpperCase() + (p.status || 'Active').slice(1),
                  orders_count: 0,
                  total_spent: 0,
                  city: 'India',
                  joined: p.created_at ? p.created_at.split('T')[0] : '2026-09-01'
                });
              }
            });
          }

          // Aggregate orders
          if (Array.isArray(orders)) {
            orders.forEach(o => {
              const emailKey = (o.guest_email || o.email || '').toLowerCase().trim();
              const custName = o.guest_name || o.customer || 'Devotee Customer';
              const phone = o.shipping_address?.phone || o.phone || '—';
              const city = o.shipping_address?.city || o.city || 'India';
              const total = parseFloat(o.total || 0);

              if (emailKey) {
                let existing = custMap.get(emailKey);
                if (!existing) {
                  existing = {
                    id: o.id || 'cust-' + Math.random().toString(36).substring(7),
                    name: custName,
                    email: emailKey,
                    phone: phone,
                    avatar: null,
                    status: 'Active',
                    orders_count: 0,
                    total_spent: 0,
                    city: city,
                    joined: o.created_at ? o.created_at.split('T')[0] : '2026-09-10'
                  };
                  custMap.set(emailKey, existing);
                }
                existing.orders_count += 1;
                existing.total_spent += total;
                if (existing.phone === '—' && phone !== '—') existing.phone = phone;
                if (existing.city === 'India' && city !== 'India') existing.city = city;
              }
            });
          }

          if (custMap.size > 0) {
            customersList = Array.from(custMap.values());
            renderCustomersTable(customersList);
            return;
          }
        }
      } catch (sbErr) {
        console.warn('[AdminCustomers] Supabase direct fallback note:', sbErr.message);
      }

      renderCustomersTable([]);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadCustomers();
    });

    function renderCustomersTable(customers) {
      const tbody = document.getElementById('customers-table-body');
      if (!tbody) return;

      if (!customers || customers.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-5 text-muted">
              <i class="bi bi-people fs-1 d-block mb-2 text-gold"></i>
              No customer profiles found in database.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = customers.map(c => `
        <tr>
          <td>
            <div class="d-flex align-items-center gap-2">
              <div class="rounded-circle bg-navy text-white d-flex align-items-center justify-content-center fw-bold text-uppercase" style="width: 34px; height: 34px; min-width: 34px; font-size: 0.8rem; background-color: var(--hn-navy);">
                ${(c.name || 'D').charAt(0)}
              </div>
              <div class="fw-bold text-navy text-nowrap">${c.name}</div>
            </div>
          </td>
          <td>
            <div class="small text-nowrap"><i class="bi bi-envelope me-1 text-muted"></i>${c.email}</div>
            <div class="small text-muted text-nowrap"><i class="bi bi-telephone me-1 text-muted"></i>${c.phone || '—'}</div>
          </td>
          <td class="text-nowrap"><i class="bi bi-geo-alt me-1 text-danger"></i>${c.city || 'India'}</td>
          <td class="text-nowrap"><span class="badge bg-light text-dark border">${c.orders_count || 0} orders</span></td>
          <td class="fw-bold text-navy text-nowrap">₹${c.total_spent || 0}</td>
          <td class="small text-muted text-nowrap">${c.joined || '—'}</td>
          <td class="text-nowrap">
            <span class="badge ${c.status === 'Active' ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'}">${c.status || 'Active'}</span>
          </td>
          <td class="text-end text-nowrap">
            ${c.phone && c.phone !== '—' ? `
            <a href="https://wa.me/${c.phone.replace(/[^0-9]/g, '')}?text=Hare%20Krishna%20${encodeURIComponent(c.name)}%2C%20greetings%20from%20Harinama%20Store!" target="_blank" class="btn btn-sm btn-outline-success me-1" title="Message on WhatsApp">
              <i class="bi bi-whatsapp"></i>
            </a>` : ''}
            <button class="btn btn-sm btn-outline-dark" onclick="viewCustomerDetails('${c.id}')" title="View Customer Profile">
              <i class="bi bi-eye"></i> View
            </button>
          </td>
        </tr>
      `).join('');
    }

    function viewCustomerDetails(id) {
      const c = customersList.find(item => item.id === id);
      if (!c) return;
      selectedCustomerId = id;

      document.getElementById('customerModalTitle').innerText = c.name;
      document.getElementById('customerModalBody').innerHTML = `
        <div class="text-center mb-4">
          <div class="rounded-circle bg-navy text-white d-inline-flex align-items-center justify-content-center fw-bold fs-4 mb-2" style="width: 60px; height: 60px; background-color: var(--hn-navy);">
            ${(c.name || 'D').charAt(0)}
          </div>
          <h5 class="fw-bold text-navy mb-0">${c.name}</h5>
          <div class="text-muted small">${c.email}</div>
        </div>

        <div class="border rounded p-3 mb-3 bg-light">
          <div class="row g-2 small">
            <div class="col-6"><strong>Phone:</strong> ${c.phone || '—'}</div>
            <div class="col-6"><strong>Location:</strong> ${c.city || 'India'}</div>
            <div class="col-6"><strong>Orders Placed:</strong> ${c.orders_count || 0}</div>
            <div class="col-6"><strong>Total Spent:</strong> ₹${c.total_spent || 0}</div>
            <div class="col-12"><strong>Member Since:</strong> ${c.joined || '—'}</div>
            <div class="col-12 text-muted" style="font-size: 0.75rem;"><strong>Database UUID:</strong> <code>${c.id}</code></div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold small text-navy">Account Status in Database</label>
          <select id="modal-customer-status" class="form-select">
            <option value="active" ${c.status === 'Active' ? 'selected' : ''}>Active (Permitted)</option>
            <option value="inactive" ${c.status === 'Inactive' ? 'selected' : ''}>Inactive</option>
            <option value="suspended" ${c.status === 'Suspended' ? 'selected' : ''}>Suspended</option>
          </select>
        </div>

        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
          <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-sm btn-gold" onclick="updateCustomerStatus('${c.id}')"><i class="bi bi-check-circle me-1"></i> Update Status</button>
        </div>
      `;

      const modal = new bootstrap.Modal(document.getElementById('customerModal'));
      modal.show();
    }

    async function updateCustomerStatus(id) {
      const selectEl = document.getElementById('modal-customer-status');
      if (!selectEl) return;
      const newStatus = selectEl.value;

      try {
        const res = await fetch(`/api/admin/customers/${encodeURIComponent(id)}/status`, {
          method: 'PUT',
          headers: getAdminHeaders(),
          body: JSON.stringify({ status: newStatus })
        });

        if (res.ok) {
          showToast(`Customer status updated to ${newStatus}!`);
          const modalEl = document.getElementById('customerModal');
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
          loadCustomers();
          return;
        }
      } catch (e) {
        console.warn('[AdminCustomers] Update status note:', e.message);
      }

      // Supabase direct fallback
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          await sb.from('profiles').update({ status: newStatus.toLowerCase() }).eq('id', id);
          showToast(`Customer status updated to ${newStatus}!`);
          const modalEl = document.getElementById('customerModal');
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
          loadCustomers();
          return;
        }
      } catch (err) {}

      showToast('Status update saved locally.');
    }

    function filterCustomers() {
      const query = document.getElementById('customer-search').value.toLowerCase();
      let filtered = customersList.filter(c => {
        return (c.name && c.name.toLowerCase().includes(query)) || 
               (c.email && c.email.toLowerCase().includes(query)) || 
               (c.phone && c.phone.includes(query)) || 
               (c.city && c.city.toLowerCase().includes(query));
      });
      renderCustomersTable(filtered);
    }

    function exportCustomersCSV() {
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Name,Email,Phone,Location,Orders,Total Spent,Member Since,Status\n";
      customersList.forEach(c => {
        csvContent += `"${c.name}","${c.email}","${c.phone || ''}","${c.city || ''}","${c.orders_count || 0}","₹${c.total_spent || 0}","${c.joined || ''}","${c.status}"\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Harinama_Customers_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("Customers exported successfully!");
    }
  </script>
</body>
