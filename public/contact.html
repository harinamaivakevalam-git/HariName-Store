<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Harinama Store</title>
  <meta name="description" content="Get in touch with Harinama Store for custom orders, wholesale, or support.">
  
  <!-- Google Fonts: Poppins Master Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      
      <div class="text-center mb-5">
        <h1 class="hn-section-title">Contact Us</h1>
        <div class="hn-section-subtitle">We'd love to hear from you!</div>
      </div>

      <div class="row g-4 g-lg-5 justify-content-center">
        
        <!-- Left: Contact Details Cards (Exact match to reference) -->
        <div class="col-lg-5">
          <div class="d-flex flex-column gap-3">
            
            <!-- Email -->
            <div class="bg-white border rounded p-3 d-flex align-items-center gap-3 shadow-sm">
              <div class="hn-why-circle mb-0" style="width: 50px; height: 50px; font-size: 1.3rem;">
                <i class="bi bi-envelope"></i>
              </div>
              <div>
                <div class="small text-muted">Email</div>
                <a href="mailto:support@harinama.store" class="fw-semibold text-navy">support@harinama.store</a>
              </div>
            </div>

            <!-- WhatsApp -->
            <div class="bg-white border rounded p-3 d-flex align-items-center gap-3 shadow-sm">
              <div class="hn-why-circle mb-0" style="width: 50px; height: 50px; font-size: 1.3rem;">
                <i class="bi bi-whatsapp"></i>
              </div>
              <div>
                <div class="small text-muted">WhatsApp</div>
                <a href="https://wa.me/919876543210" target="_blank" class="fw-semibold text-navy">+91 98765 43210</a>
              </div>
            </div>

            <!-- Location -->
            <div class="bg-white border rounded p-3 d-flex align-items-center gap-3 shadow-sm">
              <div class="hn-why-circle mb-0" style="width: 50px; height: 50px; font-size: 1.3rem;">
                <i class="bi bi-geo-alt"></i>
              </div>
              <div>
                <div class="small text-muted">Location</div>
                <div class="fw-semibold text-navy">Vrindavan, Uttar Pradesh, India</div>
              </div>
            </div>

            <!-- Social Links -->
            <div class="bg-white border rounded p-3 text-center shadow-sm">
              <div class="small text-muted mb-2">Follow our journey</div>
              <div class="d-flex justify-content-center gap-3 fs-4">
                <a href="https://instagram.com" target="_blank" class="text-navy"><i class="bi bi-instagram"></i></a>
                <a href="https://youtube.com" target="_blank" class="text-navy"><i class="bi bi-youtube"></i></a>
                <a href="https://facebook.com" target="_blank" class="text-navy"><i class="bi bi-facebook"></i></a>
                <a href="https://pinterest.com" target="_blank" class="text-navy"><i class="bi bi-pinterest"></i></a>
              </div>
            </div>

          </div>
        </div>

        <!-- Right: Message Form -->
        <div class="col-lg-6">
          <div class="bg-white border rounded p-4 shadow-sm">
            <h4 class="fw-bold mb-3" style="font-family: var(--hn-font-serif); color: var(--hn-navy);">Send a Message</h4>
            
            <form onsubmit="handleContactSubmit(event)">
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Your Name *</label>
                <input type="text" class="form-control" required placeholder="Gauranga Das">
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Your Email or WhatsApp *</label>
                <input type="text" class="form-control" required placeholder="devotee@harinama.com">
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Message / Bulk Inquiry *</label>
                <textarea class="form-control" rows="4" required placeholder="Write your message or inquiry here..."></textarea>
              </div>

              <button type="submit" class="btn hn-btn-gold w-100 py-3 fw-bold">
                Send Message
              </button>
            </form>
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      showToast('Thank you! Your message has been sent with blessings.');
      e.target.reset();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('contact');
      renderFooter();
    });
  </script>
</body>
</html>
