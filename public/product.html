<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - HariNama Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Header Placeholder -->
  <div id="hn-header-placeholder"></div>

  <main class="container my-4" id="product-container">
    <!-- Breadcrumbs -->
    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="/index.html">Home</a></li>
        <li class="breadcrumb-item"><a href="/shop.html">Shop</a></li>
        <li class="breadcrumb-item active" id="crumb-product-name">Loading...</li>
      </ol>
    </nav>

    <div class="row g-5" id="product-detail-layout">
      <!-- Loading Skeleton -->
      <div class="col-lg-6">
        <div class="hn-gallery-main hn-skeleton" style="height: 440px;"></div>
      </div>
      <div class="col-lg-6">
        <div class="hn-skeleton mb-3" style="height: 36px; width: 80%;"></div>
        <div class="hn-skeleton mb-3" style="height: 24px; width: 40%;"></div>
        <div class="hn-skeleton mb-4" style="height: 80px; width: 100%;"></div>
        <div class="hn-skeleton" style="height: 50px; width: 50%;"></div>
      </div>
    </div>

    <!-- Related Products -->
    <section class="my-5 pt-4">
      <div class="hn-section-header">
        <span class="hn-section-tag">You May Also Like</span>
        <h3 class="hn-section-title">Related Devotional Items</h3>
      </div>
      <div class="row g-4" id="related-products-grid">
        <!-- Injected dynamically -->
      </div>
    </section>
  </main>

  <!-- Review Submission Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Write a Devotional Review</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="reviewForm" onsubmit="submitReview(event)">
            <input type="hidden" id="review-product-id">
            
            <div class="mb-3 text-center">
              <label class="form-label d-block small text-muted">Your Overall Rating</label>
              <div class="d-flex justify-content-center gap-2 fs-3 text-warning cursor-pointer" id="rating-stars-picker">
                <i class="bi bi-star-fill star-pick" data-val="1"></i>
                <i class="bi bi-star-fill star-pick" data-val="2"></i>
                <i class="bi bi-star-fill star-pick" data-val="3"></i>
                <i class="bi bi-star-fill star-pick" data-val="4"></i>
                <i class="bi bi-star-fill star-pick" data-val="5"></i>
              </div>
              <input type="hidden" id="selected-rating" value="5">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Review Title</label>
              <input type="text" id="review-title" required class="form-control" placeholder="e.g. Life changing Bhagavad Gita!">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Your Review</label>
              <textarea id="review-comment" required rows="4" class="form-control" placeholder="Share how this sacred item enhanced your meditation, study, or altar..."></textarea>
            </div>

            <button type="submit" class="btn hn-btn-primary w-100 py-2">Submit Verified Review</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/main.js"></script>

  <script>
    let currentProduct = null;
    let selectedVariant = null;

    const loadProduct = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug') || urlParams.get('id');

      if (!slug) {
        window.location.href = '/shop.html';
        return;
      }

      try {
        const res = await api.get(`/products/${slug}`);
        if (!res.success || !res.data) {
          document.getElementById('product-container').innerHTML = `
            <div class="text-center py-5">
              <h3>Product Not Found</h3>
              <a href="/shop.html" class="btn hn-btn-primary mt-3">Return to Shop</a>
            </div>
          `;
          return;
        }

        currentProduct = res.data;
        document.title = `${currentProduct.name} - HariNama Store`;
        document.getElementById('crumb-product-name').textContent = currentProduct.name;

        renderProductView(currentProduct);
        loadRelated(currentProduct.id);
      } catch (err) {
        document.getElementById('product-container').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      }
    };

    const renderProductView = (p) => {
      const layout = document.getElementById('product-detail-layout');
      const discount = p.discount_percent || 0;
      const images = p.images && p.images.length > 0 ? p.images : [{ image_url: p.primary_image }];

      // Set default selected variant
      if (p.variants && p.variants.length > 0) {
        selectedVariant = p.variants[0];
      }

      const activePrice = selectedVariant ? selectedVariant.price : p.price;
      const activeStock = selectedVariant ? selectedVariant.stock : p.stock;

      layout.innerHTML = `
        <!-- Left: Image Gallery -->
        <div class="col-lg-6">
          <div class="hn-gallery-main">
            <img id="main-product-img" src="${images[0].image_url}" alt="${p.name}">
          </div>
          <div class="hn-thumbnails-strip">
            ${images.map((img, idx) => `
              <div class="hn-thumb-item ${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${img.image_url}', this)">
                <img src="${img.image_url}" alt="${img.alt_text || p.name}">
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Right: Details & Purchase -->
        <div class="col-lg-6">
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="badge bg-primary-subtle text-primary fw-semibold px-2 py-1">${p.category_name}</span>
            <span class="text-muted small">&bull;</span>
            <span class="text-muted small fw-medium">Brand: <strong>${p.brand_name}</strong></span>
          </div>

          <h2 class="fw-bold mb-2">${p.name}</h2>

          <div class="d-flex align-items-center gap-3 mb-3">
            ${renderRatingStars(p.rating, p.reviews_count)}
            <a href="#reviews-section" class="small text-muted text-decoration-none">Read ${p.reviews_count} reviews</a>
          </div>

          <div class="d-flex align-items-baseline gap-3 mb-3">
            <h2 class="text-primary fw-bold mb-0" id="display-price">${formatCurrency(activePrice)}</h2>
            ${p.compare_price && p.compare_price > p.price ? `
              <span class="text-muted text-decoration-line-through fs-5">${formatCurrency(p.compare_price)}</span>
              <span class="hn-discount-pill">${discount}% OFF</span>
            ` : ''}
          </div>

          <div class="mb-4">
            ${activeStock > 0 ? `
              <span class="badge bg-success-subtle text-success fw-semibold"><i class="bi bi-check-circle me-1"></i> In Stock (${activeStock} units left)</span>
            ` : `
              <span class="badge bg-danger-subtle text-danger fw-semibold"><i class="bi bi-x-circle me-1"></i> Out of Stock</span>
            `}
            <span class="text-muted small ms-2">SKU: <span id="display-sku">${selectedVariant ? selectedVariant.sku : p.sku}</span></span>
          </div>

          <p class="text-muted mb-4">${p.short_description || p.description.substring(0, 220) + '...'}</p>

          <!-- Variants Selector -->
          ${p.variants && p.variants.length > 0 ? `
            <div class="mb-4">
              <label class="fw-bold small text-uppercase text-muted d-block mb-2">Select Variant / Size</label>
              <div class="d-flex flex-wrap gap-2">
                ${p.variants.map((v, idx) => `
                  <button class="hn-variant-pill ${idx === 0 ? 'active' : ''}" onclick="onSelectVariant('${v.id}', this)">
                    ${v.size || v.color || v.weight || 'Standard'} - ${formatCurrency(v.price)}
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Quantity & Purchase Actions -->
          <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
            <div class="hn-qty-box">
              <button class="hn-qty-btn" onclick="adjustQty(-1)"><i class="bi bi-dash"></i></button>
              <input type="number" id="detail-qty" class="hn-qty-input" value="1" min="1" max="${activeStock}">
              <button class="hn-qty-btn" onclick="adjustQty(1)"><i class="bi bi-plus"></i></button>
            </div>

            <button class="btn hn-btn-primary flex-grow-1 py-3" onclick="handleAddToCartClick()" ${activeStock <= 0 ? 'disabled' : ''}>
              <i class="bi bi-cart-plus me-1"></i> Add to Cart
            </button>

            <button class="btn hn-btn-gold py-3 px-4" onclick="handleBuyNowClick()" ${activeStock <= 0 ? 'disabled' : ''}>
              <i class="bi bi-lightning-fill me-1"></i> Buy Now
            </button>

            <button class="btn btn-outline-secondary p-3 rounded-3" onclick="handleToggleWishlist('${p.id}', this)" title="Wishlist">
              <i class="bi bi-heart"></i>
            </button>
          </div>

          <!-- Trust Callouts -->
          <div class="card border-0 bg-light p-3 rounded-3 small">
            <div class="d-flex align-items-center gap-2 mb-2">
              <i class="bi bi-shield-check text-success fs-5"></i>
              <span><strong>Guaranteed Authentic</strong> straight from Vrindavan & Mayapur.</span>
            </div>
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-truck text-primary fs-5"></i>
              <span><strong>Fast Dispatch:</strong> Dispatched in 24 hours. Free shipping over ₹999.</span>
            </div>
          </div>
        </div>

        <!-- Full Tabs Section: Description, Specs, Reviews -->
        <div class="col-12 mt-5">
          <ul class="nav nav-pills mb-4 border-bottom pb-2 gap-2" id="productTabs" role="tablist">
            <li class="nav-item">
              <button class="btn hn-nav-link active" data-bs-toggle="pill" data-bs-target="#tab-desc">Sacred Description</button>
            </li>
            <li class="nav-item">
              <button class="btn hn-nav-link" data-bs-toggle="pill" data-bs-target="#tab-specs">Specifications</button>
            </li>
            <li class="nav-item">
              <button class="btn hn-nav-link" id="reviews-section" data-bs-toggle="pill" data-bs-target="#tab-reviews">
                Customer Reviews (${p.reviews_count || 0})
              </button>
            </li>
          </ul>

          <div class="tab-content bg-white p-4 rounded-4 shadow-sm">
            <!-- Description -->
            <div class="tab-pane fade show active" id="tab-desc">
              <h5 class="fw-bold mb-3">About this Sacred Item</h5>
              <div class="text-muted leading-relaxed" style="white-space: pre-line;">${p.description}</div>
            </div>

            <!-- Specifications -->
            <div class="tab-pane fade" id="tab-specs">
              <h5 class="fw-bold mb-3">Product Specifications</h5>
              <div class="table-responsive">
                <table class="table table-bordered">
                  <tbody>
                    ${Object.entries(p.specifications || {}).map(([k, v]) => `
                      <tr>
                        <th class="bg-light w-25 text-muted">${k}</th>
                        <td>${v}</td>
                      </tr>
                    `).join('')}
                    <tr>
                      <th class="bg-light text-muted">Category</th>
                      <td>${p.category_name}</td>
                    </tr>
                    <tr>
                      <th class="bg-light text-muted">SKU</th>
                      <td>${p.sku}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Reviews -->
            <div class="tab-pane fade" id="tab-reviews">
              <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3 border-bottom">
                <div>
                  <h4 class="fw-bold mb-1">${p.rating} out of 5</h4>
                  ${renderRatingStars(p.rating, p.reviews_count)}
                </div>
                <button class="btn hn-btn-primary" onclick="openReviewModal()">
                  <i class="bi bi-pencil-square me-1"></i> Write a Review
                </button>
              </div>

              <!-- Reviews List -->
              <div class="d-flex flex-column gap-3" id="reviews-list-container">
                ${(p.reviews || []).map(r => `
                  <div class="border-bottom pb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                      <div class="d-flex align-items-center gap-2">
                        <strong>${r.user_name || 'Customer'}</strong>
                        ${r.is_verified_purchase ? '<span class="badge bg-success-subtle text-success small"><i class="bi bi-patch-check-fill me-1"></i> Verified Purchaser</span>' : ''}
                      </div>
                      <span class="text-muted small">${new Date(r.created_at).toLocaleDateString()}</span>
                    </div>
                    ${renderRatingStars(r.rating, 0)}
                    <h6 class="fw-bold mt-2">${r.title || ''}</h6>
                    <p class="text-muted small mb-0">${r.comment}</p>
                  </div>
                `).join('') || '<p class="text-muted text-center py-4">No reviews yet. Be the first to share your experience!</p>'}
              </div>
            </div>
          </div>
        </div>
      `;
    };

    const changeMainImage = (url, el) => {
      document.getElementById('main-product-img').src = url;
      document.querySelectorAll('.hn-thumb-item').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    };

    const onSelectVariant = (variantId, el) => {
      document.querySelectorAll('.hn-variant-pill').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      selectedVariant = currentProduct.variants.find(v => v.id === variantId);

      if (selectedVariant) {
        document.getElementById('display-price').textContent = formatCurrency(selectedVariant.price);
        document.getElementById('display-sku').textContent = selectedVariant.sku;
      }
    };

    const adjustQty = (delta) => {
      const input = document.getElementById('detail-qty');
      const max = selectedVariant ? selectedVariant.stock : currentProduct.stock;
      let val = parseInt(input.value, 10) + delta;
      if (val < 1) val = 1;
      if (val > max) val = max;
      input.value = val;
    };

    const handleAddToCartClick = () => {
      const qty = parseInt(document.getElementById('detail-qty').value, 10) || 1;
      const variantId = selectedVariant ? selectedVariant.id : null;
      handleAddToCart(currentProduct.id, variantId, qty);
    };

    const handleBuyNowClick = async () => {
      const qty = parseInt(document.getElementById('detail-qty').value, 10) || 1;
      const variantId = selectedVariant ? selectedVariant.id : null;
      await handleAddToCart(currentProduct.id, variantId, qty);
      window.location.href = '/checkout.html';
    };

    const loadRelated = async (id) => {
      try {
        const res = await api.get(`/products/related/${id}`);
        const grid = document.getElementById('related-products-grid');
        if (res.success && grid) {
          grid.innerHTML = res.data.map(p => `
            <div class="col-6 col-md-3">
              ${renderProductCard(p)}
            </div>
          `).join('');
        }
      } catch (e) {}
    };

    const openReviewModal = () => {
      if (!api.getToken()) {
        showToast('Please login to write a verified review.', 'warning');
        setTimeout(() => window.location.href = '/auth.html', 1200);
        return;
      }
      document.getElementById('review-product-id').value = currentProduct.id;
      const modal = new bootstrap.Modal(document.getElementById('reviewModal'));
      modal.show();
    };

    // Star rating click handler inside modal
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('star-pick')) {
        const val = parseInt(e.target.getAttribute('data-val'), 10);
        document.getElementById('selected-rating').value = val;
        document.querySelectorAll('.star-pick').forEach((s, idx) => {
          s.className = idx < val ? 'bi bi-star-fill star-pick text-warning' : 'bi bi-star star-pick text-warning';
        });
      }
    });

    const submitReview = async (e) => {
      e.preventDefault();
      try {
        const res = await api.post('/reviews', {
          product_id: currentProduct.id,
          rating: document.getElementById('selected-rating').value,
          title: document.getElementById('review-title').value,
          comment: document.getElementById('review-comment').value
        });
        if (res.success) {
          showToast('Review submitted successfully! Thank you.', 'success');
          bootstrap.Modal.getInstance(document.getElementById('reviewModal')).hide();
          loadProduct();
        }
      } catch (err) {
        showToast(err.message, 'danger');
      }
    };

    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
