<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist — Harinama Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      
      <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
        <h1 class="hn-section-title mb-0" style="font-size: 2rem;">My Wishlist</h1>
        <a href="/shop.html" class="text-secondary small fw-semibold">Browse Keychains</a>
      </div>

      <div class="row g-4">
        
        <!-- Left Sidebar Navigation -->
        <div class="col-lg-3">
          <div class="bg-white border rounded p-3 shadow-sm">
            <div class="d-flex flex-column gap-1">
              <a href="/account.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-person"></i> Profile Overview
              </a>
              <a href="/orders.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-box-seam"></i> My Orders
              </a>
              <a href="/wishlist.html" class="p-2 rounded text-navy fw-bold bg-light d-flex align-items-center gap-2">
                <i class="bi bi-heart"></i> Wishlist
              </a>
              <a href="/addresses.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-geo-alt"></i> Addresses
              </a>
            </div>
          </div>
        </div>

        <!-- Right Wishlist Grid -->
        <div class="col-lg-9">
          <div class="row g-3" id="hn-wishlist-grid">
            <!-- Dynamic items -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();

      const grid = document.getElementById('hn-wishlist-grid');
      const wishlistItems = HARINAMA_DATA.products.slice(0, 3);
      grid.innerHTML = wishlistItems.map(p => {
        return `
          <div class="col-6 col-md-4">
            <div class="hn-product-card">
              <a href="/product-details.html?id=${p.id}" class="hn-card-img-box">
                <img src="${p.image}" alt="${p.name}">
              </a>
              <div class="hn-card-title"><a href="/product-details.html?id=${p.id}">${p.name}</a></div>
              <div class="hn-card-price">${formatPrice(p.price)}</div>
              ${renderRatingStars(p.rating, p.reviews_count)}
              <button class="hn-btn-card-add mt-2" onclick="handleAddToCart('${p.id}')">Add to Cart</button>
            </div>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
