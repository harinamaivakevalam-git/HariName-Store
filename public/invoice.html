<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Tax Invoice | Harinama Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0F1E36;
      --gold: #C59B27;
      --gold-dark: #9A771C;
      --border: #E2E8F0;
      --text: #1E293B;
      --text-muted: #64748B;
      --bg-page: #F8FAFC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-page);
      color: var(--text);
      padding: 30px 15px;
      line-height: 1.5;
      min-height: 100vh;
    }
    .invoice-container {
      max-width: 840px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(15, 30, 54, 0.06);
      padding: 40px;
      position: relative;
    }
    .no-print {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      max-width: 840px;
      margin-left: auto;
      margin-right: auto;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-gold {
      background: linear-gradient(135deg, #C59B27, #9A771C);
      color: #FFFFFF;
      border: none;
    }
    .btn-gold:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(197, 155, 39, 0.25); }
    .btn-outline {
      background: #FFFFFF;
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: #F1F5F9; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid #F1F5F9;
      padding-bottom: 24px;
      margin-bottom: 24px;
      gap: 20px;
    }
    .store-brand {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 0.5px;
    }
    .store-tagline {
      font-size: 12px;
      color: var(--gold-dark);
      font-weight: 600;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .store-details {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.45;
    }
    .invoice-title-block {
      text-align: right;
    }
    .invoice-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
    }
    .invoice-meta-item {
      font-size: 13px;
      margin-top: 4px;
      color: var(--text);
    }
    .invoice-meta-item span {
      color: var(--text-muted);
    }
    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      background: #15803D;
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
      background: #F8FAFC;
      border-radius: 8px;
      padding: 16px 20px;
      border: 1px solid #EDF2F7;
    }
    .section-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--gold-dark);
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .section-content {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }
    table.invoice-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }
    table.invoice-table th {
      background: #0F1E36;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 14px;
      text-align: left;
    }
    table.invoice-table th.text-right { text-align: right; }
    table.invoice-table td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }
    table.invoice-table td.text-right { text-align: right; }
    .item-title {
      font-weight: 600;
      color: var(--primary);
    }
    .item-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .summary-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 30px;
    }
    .summary-table {
      width: 330px;
      border-collapse: collapse;
    }
    .summary-table td {
      padding: 6px 0;
      font-size: 13px;
    }
    .summary-table td:last-child {
      text-align: right;
      font-weight: 600;
    }
    .summary-table tr.total-row td {
      border-top: 2px solid var(--primary);
      padding-top: 10px;
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
    }
    .blessing-footer {
      border-top: 1px dashed var(--border);
      padding-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .blessing-quote {
      font-family: 'Cinzel', serif;
      font-style: italic;
      color: var(--primary);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .loading-state, .error-state {
      max-width: 540px;
      margin: 60px auto;
      background: #FFFFFF;
      border-radius: 12px;
      padding: 40px 30px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(15, 30, 54, 0.06);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #F1F5F9;
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media print {
      body { background: #FFFFFF; padding: 0; }
      .no-print { display: none !important; }
      .invoice-container { box-shadow: none; border: none; padding: 15px 0; }
    }
    @media (max-width: 600px) {
      .header { flex-direction: column; }
      .invoice-title-block { text-align: left; margin-top: 12px; }
      .section-grid { grid-template-columns: 1fr; }
      .invoice-container { padding: 20px; }
    }
  </style>

<body>

  <!-- App View Container -->
  <div id="app-root">
    <div class="loading-state">
      <div class="spinner"></div>
      <h3 style="font-family: 'Cinzel', serif; color: var(--primary); margin-bottom: 6px;">Loading Tax Invoice...</h3>
      <p style="color: var(--text-muted); font-size: 13px;">Retrieving sacred order details from Harinama Store database. 🌸</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wnaqfadlxrrvvjvqqbch.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduYXFmYWRseHJydnZqdnFxYmNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzg4NTYsImV4cCI6MjEwNDkxNDg1Nn0.aZcWAzKfjHkozCus4V_xD3BwDSL8KIIEhASdf2NtdtM';

    function getApiUrl(path) {
      if (typeof window !== 'undefined' && typeof window.getApiUrl === 'function' && window.getApiUrl !== getApiUrl) {
        return window.getApiUrl(path);
      }
      return path;
    }

    function sanitizeOrderId(raw) {
      if (!raw) return '';
      return decodeURIComponent(String(raw))
        .trim()
        .replace(/^[#\s]+/, '')
        .replace(/[\u2010\u2011\u2012\u2013\u2014\u2015\u2212\uFE58\uFE63\uFF0D]/g, '-')
        .trim();
    }

    async function fetchOrderDetails(orderId) {
      if (!orderId) return null;
      const cleanId = sanitizeOrderId(orderId);
      if (!cleanId) return null;

      const token = localStorage.getItem('hn_auth_token') || localStorage.getItem('token') || '';
      const authHeaders = {
        'Accept': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
      };

      // 1. Try Backend Express API (/api/orders/:id/invoice?format=json)
      try {
        const apiUrl = getApiUrl(`/api/orders/${encodeURIComponent(cleanId)}/invoice?format=json`);
        const res = await fetch(apiUrl, { cache: 'no-store', headers: authHeaders });
        if (res.ok) {
          const json = await res.json();
          if (json && (json.data || json.order)) return json.data || json.order;
        }
      } catch (err) {
        console.warn('[Invoice] Express backend invoice endpoint notice:', err);
      }

      // 1b. Try Backend Generic Order Endpoint (/api/orders/:id)
      try {
        const genUrl = getApiUrl(`/api/orders/${encodeURIComponent(cleanId)}`);
        const res = await fetch(genUrl, { cache: 'no-store', headers: authHeaders });
        if (res.ok) {
          const json = await res.json();
          if (json && (json.data || json.order)) return json.data || json.order;
        }
      } catch (_) {}

      // 2. Direct Supabase Query (Both JS client and REST with relations fallback)
      try {
        const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(cleanId);
        
        // 2a. Using window.supabase client if initialized
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          try {
            const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            let q = sb.from('orders').select('*, order_items(*)');
            if (isUuid) q = q.eq('id', cleanId);
            else q = q.eq('order_number', cleanId);

            const { data: sbData, error: sbErr } = await q.maybeSingle();
            if (!sbErr && sbData) return sbData;

            // Simple select without relation join if relation failed
            let qSimple = sb.from('orders').select('*');
            if (isUuid) qSimple = qSimple.eq('id', cleanId);
            else qSimple = qSimple.eq('order_number', cleanId);

            const { data: simpleOrd } = await qSimple.maybeSingle();
            if (simpleOrd) {
              const { data: items } = await sb.from('order_items').select('*').eq('order_id', simpleOrd.id);
              return { ...simpleOrd, order_items: items || [] };
            }
          } catch (_) {}
        }

        // 2b. Direct Supabase REST fetch
        const sbHeaders = {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + (token || SUPABASE_ANON_KEY),
          'Content-Type': 'application/json'
        };

        // Try joined query
        let restUrl = `${SUPABASE_URL}/rest/v1/orders?select=*,order_items(*)&order_number=eq.${encodeURIComponent(cleanId)}`;
        if (isUuid) restUrl = `${SUPABASE_URL}/rest/v1/orders?select=*,order_items(*)&id=eq.${encodeURIComponent(cleanId)}`;

        const sbRes = await fetch(restUrl, { headers: sbHeaders });
        if (sbRes.ok) {
          const sbOrders = await sbRes.json();
          if (Array.isArray(sbOrders) && sbOrders.length > 0) {
            return sbOrders[0];
          }
        }

        // Try simple unjoined query
        let simpleUrl = `${SUPABASE_URL}/rest/v1/orders?select=*&order_number=eq.${encodeURIComponent(cleanId)}`;
        if (isUuid) simpleUrl = `${SUPABASE_URL}/rest/v1/orders?select=*&id=eq.${encodeURIComponent(cleanId)}`;

        const simpleRes = await fetch(simpleUrl, { headers: sbHeaders });
        if (simpleRes.ok) {
          const simpleOrders = await simpleRes.json();
          if (Array.isArray(simpleOrders) && simpleOrders.length > 0) {
            const ord = simpleOrders[0];
            try {
              const itemsRes = await fetch(`${SUPABASE_URL}/rest/v1/order_items?select=*&order_id=eq.${encodeURIComponent(ord.id)}`, { headers: sbHeaders });
              if (itemsRes.ok) {
                ord.order_items = await itemsRes.json();
              }
            } catch (_) {}
            return ord;
          }
        }

        // Fuzzy search if prefix varied
        const stripped = cleanId.replace(/^HN-/, '').replace(/\D/g, '');
        if (stripped) {
          const fallbackRes = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order_number=ilike.*${encodeURIComponent(stripped)}*&limit=1`, { headers: sbHeaders });
          if (fallbackRes.ok) {
            const fbOrders = await fallbackRes.json();
            if (Array.isArray(fbOrders) && fbOrders.length > 0) return fbOrders[0];
          }
        }
      } catch (sbErr) {
        console.warn('[Invoice] Supabase query notice:', sbErr);
      }

      // 3. Check LocalStorage / Local Orders Cache (All keys)
      try {
        const storageKeys = ['hn_orders', 'harinama_admin_orders', 'hn_user_orders', 'hn_all_orders'];
        for (const key of storageKeys) {
          const list = JSON.parse(localStorage.getItem(key) || '[]');
          if (Array.isArray(list)) {
            const found = list.find(o => {
              const ordNum = sanitizeOrderId(o.order_number || o.id || o.orderId);
              return ordNum.toUpperCase() === cleanId.toUpperCase() || (o.id && o.id === cleanId) || (ordNum.includes(cleanId.replace(/^HN-/, '')));
            });
            if (found) return found;
          }
        }

        const lastOrder = JSON.parse(localStorage.getItem('hn_last_order') || 'null');
        if (lastOrder) {
          const lastNum = sanitizeOrderId(lastOrder.order_number || lastOrder.id);
          if (lastNum.toUpperCase() === cleanId.toUpperCase() || lastOrder.id === cleanId) {
            return lastOrder;
          }
        }
      } catch (_) {}

      return null;
    }

    function renderInvoice(order) {
      const orderNum = sanitizeOrderId(order.order_number || order.id || 'HN-ORDER');
      document.title = `Tax Invoice - ${orderNum} | Harinama Store`;

      const shipAddr = order.shipping_address || order.customer?.address || {};
      const items = Array.isArray(order.order_items) ? order.order_items : (Array.isArray(order.items) ? order.items : []);
      
      const customerName = typeof shipAddr === 'string' ? shipAddr : (shipAddr.name || order.customer?.name || order.guest_name || 'Valued Devotee');
      const customerPhone = typeof shipAddr === 'object' ? (shipAddr.phone || order.customer?.phone || '—') : '—';
      const customerEmail = typeof shipAddr === 'object' ? (shipAddr.email || order.customer?.email || order.guest_email || '—') : '—';
      
      let addressLine = '';
      if (typeof shipAddr === 'string') {
        addressLine = shipAddr;
      } else if (order.customer?.address && typeof order.customer.address === 'string') {
        addressLine = order.customer.address;
      } else {
        addressLine = `${shipAddr.address_line_1 || shipAddr.street || ''}${shipAddr.village ? ', ' + shipAddr.village : ''}, ${shipAddr.city || ''}, ${shipAddr.state || ''} - ${shipAddr.pin || shipAddr.postalCode || ''}`;
      }

      const orderDate = new Date(order.created_at || order.order_date || Date.now()).toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });

      const isPaid = (order.payment_status || '').toLowerCase() === 'paid';
      const paymentBadgeText = isPaid ? 'PAID (PREPAID)' : 'CASH ON DELIVERY (PENDING)';
      const paymentBadgeColor = isPaid ? '#15803D' : '#D97706';

      const subtotal = Number(order.pricing?.subtotal ?? (order.subtotal || 0));
      const discount = Number(order.pricing?.discount ?? (order.discount || 0));
      const shippingFee = Number(order.pricing?.shipping_fee ?? (order.shipping_fee || 0));
      const tax = Number(order.pricing?.tax ?? (order.tax || 0));
      const total = Number(order.pricing?.total ?? (order.total || (subtotal - discount + shippingFee)));

      const invoiceNo = order.invoice_number || `INV-${orderNum.replace(/^HN-/, '')}`;
      const courierName = order.shipping?.courier || order.courier_name || order.courier || (order.awb_code ? 'Shiprocket Express Partner' : (order.shiprocket_order_id ? 'Shiprocket / Delivery Partner' : 'Assigned Delivery Partner'));
      const awbCode = order.shipping?.awb_code || order.awb_code || 'Assigned on Dispatch';
      const trackingNumber = order.shipping?.tracking_number || order.tracking_number || orderNum;
      const paymentMethod = (order.payment_method || 'Online').toUpperCase();

      const html = `
        <div class="no-print">
          <a href="javascript:if(history.length > 1){history.back();}else{window.location.href='/account.html';}" class="btn btn-outline">
            ← Back to Store
          </a>
          <div style="display: flex; gap: 10px; align-items: center;">
            <button onclick="downloadPDF()" class="btn btn-gold" id="btn-download-pdf">
              <svg width="15" height="15" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 2px;"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
              Download PDF (.pdf)
            </button>
            <button onclick="window.print()" class="btn btn-outline">
              🖨️ Print Invoice
            </button>
          </div>
        </div>

        <div class="invoice-container" id="invoice-doc">
          <!-- Header -->
          <div class="header">
            <div>
              <div class="store-brand">HARINAMA STORE</div>
              <div class="store-tagline">Devotional Keepsakes & Sacred Scriptures</div>
              <div class="store-details">
                Radha Raman Marg, Vrindavan, Mathura, UP - 281121<br>
                GSTIN: 09AAAPH1234F1Z5 | PAN: AAAPH1234F<br>
                WhatsApp: +91 79937 91014 | Email: harinamaivakevalam@gmail.com
              </div>
            </div>
            <div class="invoice-title-block">
              <div class="invoice-title">TAX INVOICE</div>
              <div class="invoice-meta-item"><span>Invoice No:</span> <strong>${invoiceNo}</strong></div>
              <div class="invoice-meta-item"><span>Order No:</span> <strong>${orderNum}</strong></div>
              <div class="invoice-meta-item"><span>Order Date:</span> ${orderDate}</div>
              <div><span class="badge-status" style="background: ${paymentBadgeColor};">${paymentBadgeText}</span></div>
            </div>
          </div>

          <!-- Customer & Dispatch Details -->
          <div class="section-grid">
            <div>
              <div class="section-heading">Billed & Shipped To</div>
              <div class="section-content">
                <strong>${customerName}</strong><br>
                ${addressLine || 'Address on record'}<br>
                Phone: ${customerPhone}<br>
                Email: ${customerEmail}
              </div>
            </div>
            <div>
              <div class="section-heading">Shipping & Courier Details</div>
              <div class="section-content">
                <strong>Courier:</strong> ${courierName}<br>
                <strong>AWB Code:</strong> ${awbCode}<br>
                <strong>Tracking No:</strong> ${trackingNumber}<br>
                <strong>Payment Mode:</strong> ${paymentMethod}
              </div>
            </div>
          </div>

          <!-- Line Items Table -->
          <table class="invoice-table">
            <thead>
              <tr>
                <th style="width: 40px;">#</th>
                <th>Sacred Product Description</th>
                <th style="width: 70px;" class="text-right">Qty</th>
                <th style="width: 110px;" class="text-right">Unit Price</th>
                <th style="width: 120px;" class="text-right">Amount (INR)</th>
              </tr>
            </thead>
            <tbody>
              ${items.map((it, idx) => {
                const qty = it.quantity || it.qty || 1;
                const price = Number(it.price || it.unit_price || 0);
                const itemTotal = price * qty;
                const mat = it.variant_info?.material || it.material || 'Devotional Standard';
                const name = it.product_name || it.name || it.title || 'Sacred Devotional Item';
                const sku = it.sku || `HN-SKU-${idx + 1}`;
                return `
                  <tr>
                    <td>${idx + 1}</td>
                    <td>
                      <div class="item-title">${name}</div>
                      <div class="item-sub">SKU: ${sku} • Material: ${mat}</div>
                    </td>
                    <td class="text-right">${qty}</td>
                    <td class="text-right">₹${price.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                    <td class="text-right"><strong>₹${itemTotal.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</strong></td>
                  </tr>
                `;
              }).join('')}
              ${items.length === 0 ? `
                <tr>
                  <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 24px;">
                    Order items registered under ${orderNum}
                  </td>
                </tr>
              ` : ''}
            </tbody>
          </table>

          <!-- Pricing Summary -->
          <div class="summary-wrapper">
            <table class="summary-table">
              <tr>
                <td>Item Subtotal:</td>
                <td>₹${subtotal.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
              </tr>
              ${discount > 0 ? `
              <tr style="color: #15803D;">
                <td>Holy Coupon Discount:</td>
                <td>-₹${discount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
              </tr>` : ''}
              <tr>
                <td>Sacred Packaging & Dispatch:</td>
                <td>${shippingFee === 0 ? 'FREE' : '₹' + shippingFee.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
              </tr>
              <tr>
                <td>GST (5% Inclusive):</td>
                <td>₹${tax.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
              </tr>
              <tr class="total-row">
                <td>Grand Total:</td>
                <td>₹${total.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
              </tr>
            </table>
          </div>

          <!-- Blessing Footer -->
          <div class="blessing-footer">
            <div class="blessing-quote">"Hare Krishna Hare Krishna Krishna Krishna Hare Hare | Hare Rama Hare Rama Rama Rama Hare Hare"</div>
            <div>Thank you for choosing Harinama Store. May Sri Sri Radha Shyamasundara bring peace, devotion, and auspiciousness to your home. 🌸</div>
            <div style="margin-top: 6px; font-size: 11px; color: #94A3B8;">This is a computer-generated tax invoice and requires no physical signature.</div>
          </div>
        </div>
      `;

      document.getElementById('app-root').innerHTML = html;

      // Check auto print / download triggers
      const params = new URLSearchParams(window.location.search);
      if (params.get('download') === 'pdf' || params.get('download') === 'true') {
        setTimeout(downloadPDF, 400);
      } else if (params.get('print') === 'true') {
        setTimeout(function() { window.print(); }, 400);
      }
    }

    function renderError(message, orderId) {
      document.getElementById('app-root').innerHTML = `
        <div class="error-state">
          <div style="font-size: 44px; margin-bottom: 12px;">📜</div>
          <h2 style="font-family: 'Cinzel', serif; color: var(--primary); margin-bottom: 8px;">Invoice Not Found</h2>
          <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">
            ${message || 'We could not locate an active invoice for the specified order.'}
          </p>

          <form onsubmit="event.preventDefault(); const val = document.getElementById('search-ord-input').value.trim(); if(val) window.location.href = '/invoice.html?order=' + encodeURIComponent(val);" style="display: flex; gap: 8px; margin-bottom: 24px; max-width: 400px; margin-left: auto; margin-right: auto;">
            <input type="text" id="search-ord-input" value="${orderId || ''}" placeholder="Enter Order # (e.g. HN-2026-58507)" style="flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px;">
            <button type="submit" class="btn btn-gold">Find Invoice</button>
          </form>

          <div style="display: flex; justify-content: center; gap: 12px;">
            <a href="/index.html" class="btn btn-outline">Home</a>
            <a href="/account.html" class="btn btn-gold">My Orders</a>
          </div>
        </div>
      `;
    }

    function downloadPDF() {
      const btn = document.getElementById('btn-download-pdf');
      if (!btn) return;
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Generating PDF...';
      btn.disabled = true;

      const element = document.getElementById('invoice-doc');
      const params = new URLSearchParams(window.location.search);
      const orderNum = sanitizeOrderId(params.get('order') || params.get('id') || 'HarinamaStore');

      const opt = {
        margin: [8, 8, 8, 8],
        filename: `Harinama-Store-Invoice-${orderNum}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      if (window.html2pdf) {
        window.html2pdf().set(opt).from(element).save().then(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }).catch(() => {
          window.print();
          btn.innerHTML = originalText;
          btn.disabled = false;
        });
      } else {
        window.print();
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    // Initialize Page
    (async function init() {
      const params = new URLSearchParams(window.location.search);
      const rawOrderId = params.get('order') || params.get('id') || params.get('order_number') || params.get('orderId') || params.get('no');

      if (!rawOrderId) {
        renderError('Please enter or specify an Order Number to view its Tax Invoice.', '');
        return;
      }

      const orderId = sanitizeOrderId(rawOrderId);

      try {
        const order = await fetchOrderDetails(orderId);
        if (order) {
          renderInvoice(order);
        } else {
          renderError(`Order "${orderId}" was not found in active store database.`, orderId);
        }
      } catch (err) {
        console.error('[Invoice Error]', err);
        renderError('An error occurred while loading this invoice. Please try again.', orderId);
      }
    })();
  </script>
</body>
</html>
