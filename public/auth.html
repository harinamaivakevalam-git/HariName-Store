<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HariNama Store</title>
  <script>
    window.location.replace('/login.html');
  </script>
  <!-- Brand Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/krishna-logo.jpg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/krishna-logo.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <!-- Header Placeholder -->
  <div id="hn-header-placeholder"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          
          <div class="text-center mb-4">
            <div class="hn-brand-logo-wrap mx-auto mb-3" style="width: 58px; height: 58px;">
              <img src="/assets/images/krishna-logo.jpg" alt="Harinama Store Logo" class="hn-brand-img">
            </div>
            <h3 class="fw-bold mb-1" style="font-family: var(--hn-font-serif); color: var(--hn-navy);">Harinama Store</h3>
            <p class="text-muted small">Sign in or create your devotional customer account</p>
          </div>

          <!-- Tabs -->
          <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-3" role="tablist">
            <li class="nav-item">
              <button class="nav-link active fw-bold small py-2 rounded-3" id="tab-login-btn" data-bs-toggle="pill" data-bs-target="#login-pane">Sign In</button>
            </li>
            <li class="nav-item">
              <button class="nav-link fw-bold small py-2 rounded-3" id="tab-register-btn" data-bs-toggle="pill" data-bs-target="#register-pane">Register</button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- Sign In Pane -->
            <div class="tab-pane fade show active" id="login-pane">
              <form onsubmit="handleLogin(event)">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Email Address</label>
                  <input type="email" id="login-email" required class="form-control" placeholder="name@domain.com">
                </div>
                <div class="mb-3">
                  <div class="d-flex justify-content-between">
                    <label class="form-label small fw-bold">Password</label>
                    <a href="javascript:void(0)" onclick="openForgotModal()" class="small text-muted text-decoration-none">Forgot?</a>
                  </div>
                  <input type="password" id="login-password" required class="form-control" placeholder="••••••••">
                </div>
                <button type="submit" id="login-submit-btn" class="btn hn-btn-primary w-100 py-3 mb-3 fw-bold">
                  Sign In to Account
                </button>
              </form>
            </div>

            <!-- Register Pane -->
            <div class="tab-pane fade" id="register-pane">
              <form onsubmit="handleRegister(event)">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Full Name *</label>
                  <input type="text" id="reg-name" required class="form-control" placeholder="e.g. Radharani Devi">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Email Address *</label>
                  <input type="email" id="reg-email" required class="form-control" placeholder="name@domain.com">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Phone Number (Optional)</label>
                  <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210">
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">Create Password (min 6 chars) *</label>
                  <input type="password" id="reg-password" required minlength="6" class="form-control" placeholder="••••••••">
                </div>
                <button type="submit" id="reg-submit-btn" class="btn hn-btn-primary w-100 py-3 mb-3 fw-bold">
                  Create My Account
                </button>
              </form>
            </div>
          </div>

        </div>

      </div>
    </div>
  </main>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Reset Your Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form onsubmit="handleForgotPassword(event)">
            <p class="small text-muted mb-3">Enter your registered email address and we will send a password reset verification link.</p>
            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <input type="email" id="forgot-email" required class="form-control">
            </div>
            <button type="submit" class="btn hn-btn-primary w-100 py-2">Send Reset Link</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/main.js"></script>

  <script>
    const handleLogin = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';
      }

      const email = document.getElementById('login-email')?.value?.trim();
      const password = document.getElementById('login-password')?.value;

      try {
        const res = await api.post('/auth/login', { email, password });
        if (res.success && res.token) {
          api.setToken(res.token);
          state.setUser(res.user);
          showToast(`Welcome back, ${res.user.name}! 🌸`, 'success');

          const sessionId = api.getSessionId();
          try {
            await api.post('/cart/merge', { sessionId });
          } catch (e) {}

          setTimeout(() => {
            if (window.isAdminUser ? window.isAdminUser(res.user) : res.user.role === 'admin') {
              window.location.href = window._getAdminRoute ? window._getAdminRoute() : atob('L2FkbWluLmh0bWw=');
            } else {
              window.location.href = '/account.html';
            }
          }, 800);
        }
      } catch (err) {
        showToast(err.message, 'danger');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = 'Sign In to Account';
        }
      }
    };

    const handleRegister = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('reg-submit-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating account...';
      }

      const name = document.getElementById('reg-name')?.value?.trim();
      const email = document.getElementById('reg-email')?.value?.trim();
      const phone = document.getElementById('reg-phone')?.value?.trim();
      const password = document.getElementById('reg-password')?.value;

      try {
        const res = await api.post('/auth/register', { name, email, phone, password });
        if (res.success && res.token) {
          api.setToken(res.token);
          state.setUser(res.user);
          showToast('Account created successfully! Welcome to HariNama Store 🌸', 'success');
          setTimeout(() => window.location.href = '/account.html', 800);
        }
      } catch (err) {
        showToast(err.message, 'danger');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = 'Create My Account';
        }
      }
    };

    const openForgotModal = () => {
      new bootstrap.Modal(document.getElementById('forgotModal')).show();
    };

    const handleForgotPassword = async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email')?.value?.trim();
      try {
        const res = await api.post('/auth/forgot-password', { email });
        showToast(res.message, 'info');
        bootstrap.Modal.getInstance(document.getElementById('forgotModal')).hide();
      } catch (err) {
        showToast(err.message, 'danger');
      }
    };
  </script>
</body>
</html>
