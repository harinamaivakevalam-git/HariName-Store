<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Reviews — Harinama Store Admin</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=6">
  <link rel="stylesheet" href="/assets/css/admin.css?v=6">
</head>
<body class="hn-admin-body-bg">

  <!-- Admin Top Bar Header -->
  <header class="hn-admin-topbar py-2 px-3 px-md-4">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      
      <!-- Brand & Admin Tag -->
      <a href="/admin.html" class="hn-admin-brand-link">
        <div class="hn-brand-logo-wrap" style="width: 36px; height: 36px;">
          <img src="/assets/images/krishna-logo.jpg" alt="Harinama Store Logo" class="hn-brand-img">
        </div>
        <div>
          <span class="hn-admin-brand-title">Harinama Store</span>
          <span class="hn-admin-badge-portal ms-2">Admin Portal</span>
        </div>
      </a>

      <!-- Right Controls -->
      <div class="d-flex align-items-center gap-3">
        <a href="/shop.html" target="_blank" class="btn btn-sm btn-outline-dark d-none d-sm-inline-flex align-items-center gap-1">
          <i class="bi bi-box-arrow-up-right"></i> Live Store
        </a>

        <div class="d-flex align-items-center gap-2 border-start ps-3">
          <div class="rounded-circle bg-navy text-white d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; background-color: var(--hn-navy); font-size: 0.85rem;">
            AD
          </div>
          <div class="d-none d-md-block text-start">
            <div class="small fw-bold text-navy lh-1">Store Admin</div>
            <div class="text-muted" style="font-size: 0.72rem;">admin@harinama.com</div>
          </div>
          <a href="/login.html" class="btn btn-sm btn-outline-danger ms-2" title="Sign Out">
            <i class="bi bi-box-arrow-right"></i>
          </a>
        </div>
      </div>

    </div>
  </header>

  <div class="container-fluid px-3 px-md-4 py-4" style="max-width: 1400px;">
    
    <!-- Admin Navigation Bar Strip -->
    <div class="hn-admin-nav-bar mb-4">
      <a href="/admin.html" class="hn-admin-tab"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/admin-products.html" class="hn-admin-tab"><i class="bi bi-box-seam"></i> Products</a>
      <a href="/admin-orders.html" class="hn-admin-tab"><i class="bi bi-bag-check"></i> Orders</a>
      <a href="/admin-categories.html" class="hn-admin-tab"><i class="bi bi-tags"></i> Categories</a>
      <a href="/admin-coupons.html" class="hn-admin-tab"><i class="bi bi-ticket-perforated"></i> Coupons</a>
      <a href="/admin-reviews.html" class="hn-admin-tab active"><i class="bi bi-star"></i> Reviews</a>
      <a href="/admin-customers.html" class="hn-admin-tab"><i class="bi bi-people"></i> Customers</a>
      <a href="/admin-analytics.html" class="hn-admin-tab"><i class="bi bi-graph-up-arrow"></i> Analytics</a>
      <a href="/admin-settings.html" class="hn-admin-tab"><i class="bi bi-gear"></i> Settings</a>
    </div>

    <!-- Filter Bar -->
    <div class="hn-admin-filter-bar d-flex flex-wrap align-items-center justify-content-between gap-3">
      <p class="mb-0 text-muted">Moderate and showcase heartfelt devotee testimonials across the store.</p>
      
      <div class="d-flex gap-2">
        <select id="review-filter" class="form-select form-select-sm" style="width: 180px;" onchange="filterReviews()">
          <option value="all">All Reviews</option>
          <option value="Approved">Approved</option>
          <option value="Pending">Pending Review</option>
        </select>
      </div>
    </div>

    <!-- Reviews Table Card -->
    <div class="hn-admin-card mb-4">
      <div class="table-responsive">
        <table class="table hn-table align-middle mb-0">
          <thead>
            <tr>
              <th style="min-width: 180px;">Devotee / Customer</th>
              <th style="min-width: 220px;">Product Name</th>
              <th style="min-width: 120px;">Rating</th>
              <th style="min-width: 340px;">Review Text</th>
              <th style="min-width: 120px;">Date</th>
              <th style="min-width: 110px;">Status</th>
              <th style="min-width: 100px;" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="reviews-table-body">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let localReviews = [
      {
        id: 'rev-1',
        name: 'Gauranga Das',
        product: 'Maha-Mantra Keychain',
        rating: 5,
        text: 'The quality of the engraving is outstanding. Seeing the Holy Names every time I pick up my keys keeps my mind in Krishna consciousness throughout the day. Hare Krishna!',
        date: '2026-09-10',
        status: 'Approved'
      },
      {
        id: 'rev-2',
        name: 'Radhika Priya Devi Dasi',
        product: 'Peacock Feather Keychain',
        rating: 5,
        text: 'Beautiful glossy finish and very lightweight on my temple bag. Looks even better in real life than in photos. Shipped very securely from Vrindavan.',
        date: '2026-09-08',
        status: 'Approved'
      },
      {
        id: 'rev-3',
        name: 'Anand Krishna',
        product: 'Bhagavad Gita As It Is Deluxe',
        rating: 5,
        text: 'The gold embossed binding and color illustrations make this the finest edition of the Gita in my collection. Highly recommended for daily reading.',
        date: '2026-09-06',
        status: 'Approved'
      },
      {
        id: 'rev-4',
        name: 'Sumantha Roy',
        product: 'Sacred Neem Japa Mala (108 Beads)',
        rating: 5,
        text: 'Pure neem wood with very smooth round beads. The cotton pouch included is great for keeping the beads clean.',
        date: '2026-09-05',
        status: 'Approved'
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('harinama_admin_reviews');
      if (stored) {
        try { localReviews = JSON.parse(stored); } catch(e) {}
      }

      renderReviewsTable(localReviews);
    });

    function renderReviewsTable(reviews) {
      const tbody = document.getElementById('reviews-table-body');
      if (!tbody) return;

      tbody.innerHTML = reviews.map(r => `
        <tr>
          <td>
            <div class="fw-bold text-navy text-nowrap">${r.name}</div>
          </td>
          <td class="text-nowrap"><span class="badge bg-light text-dark border">${r.product}</span></td>
          <td class="text-nowrap">
            <div class="text-warning small">
              ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}
            </div>
          </td>
          <td class="small text-muted">
            "${r.text}"
          </td>
          <td class="small text-muted text-nowrap">${r.date}</td>
          <td class="text-nowrap">
            <span class="badge ${r.status === 'Approved' ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning-emphasis'}">
              ${r.status}
            </span>
          </td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-outline-success me-1" onclick="toggleReviewStatus('${r.id}')" title="Toggle Approval">
              <i class="bi bi-check-circle"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteReview('${r.id}')" title="Delete Review">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function filterReviews() {
      const status = document.getElementById('review-filter').value;
      let filtered = localReviews.filter(r => status === 'all' || r.status === status);
      renderReviewsTable(filtered);
    }

    function toggleReviewStatus(id) {
      const idx = localReviews.findIndex(r => r.id === id);
      if (idx > -1) {
        localReviews[idx].status = localReviews[idx].status === 'Approved' ? 'Pending' : 'Approved';
        localStorage.setItem('harinama_admin_reviews', JSON.stringify(localReviews));
        showToast('Review status updated!');
        filterReviews();
      }
    }

    function deleteReview(id) {
      if (!confirm('Delete this review?')) return;
      localReviews = localReviews.filter(r => r.id !== id);
      localStorage.setItem('harinama_admin_reviews', JSON.stringify(localReviews));
      showToast('Review deleted.');
      filterReviews();
    }
  </script>
</body>
</html>
