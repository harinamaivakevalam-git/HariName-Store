<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Customers — Harinama Store Admin</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=6">
  <link rel="stylesheet" href="/assets/css/admin.css?v=6">
</head>
<body class="hn-admin-body-bg">

  <!-- Admin Top Bar Header -->
  <header class="hn-admin-topbar py-2 px-3 px-md-4">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      
      <!-- Brand & Admin Tag -->
      <a href="/admin.html" class="hn-admin-brand-link">
        <div class="hn-brand-logo-wrap" style="width: 36px; height: 36px;">
          <img src="/assets/images/krishna-logo.jpg" alt="Harinama Store Logo" class="hn-brand-img">
        </div>
        <div>
          <span class="hn-admin-brand-title">Harinama Store</span>
          <span class="hn-admin-badge-portal ms-2">Admin Portal</span>
        </div>
      </a>

      <!-- Right Controls -->
      <div class="d-flex align-items-center gap-3">
        <a href="/shop.html" target="_blank" class="btn btn-sm btn-outline-dark d-none d-sm-inline-flex align-items-center gap-1">
          <i class="bi bi-box-arrow-up-right"></i> Live Store
        </a>

        <div class="d-flex align-items-center gap-2 border-start ps-3">
          <div class="rounded-circle bg-navy text-white d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; background-color: var(--hn-navy); font-size: 0.85rem;">
            AD
          </div>
          <div class="d-none d-md-block text-start">
            <div class="small fw-bold text-navy lh-1">Store Admin</div>
            <div class="text-muted" style="font-size: 0.72rem;">admin@harinama.com</div>
          </div>
          <a href="/login.html" class="btn btn-sm btn-outline-danger ms-2" title="Sign Out">
            <i class="bi bi-box-arrow-right"></i>
          </a>
        </div>
      </div>

    </div>
  </header>

  <div class="container-fluid px-3 px-md-4 py-4" style="max-width: 1400px;">
    
    <!-- Admin Navigation Bar Strip -->
    <div class="hn-admin-nav-bar mb-4">
      <a href="/admin.html" class="hn-admin-tab"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/admin-products.html" class="hn-admin-tab"><i class="bi bi-box-seam"></i> Products</a>
      <a href="/admin-orders.html" class="hn-admin-tab"><i class="bi bi-bag-check"></i> Orders</a>
      <a href="/admin-categories.html" class="hn-admin-tab"><i class="bi bi-tags"></i> Categories</a>
      <a href="/admin-coupons.html" class="hn-admin-tab"><i class="bi bi-ticket-perforated"></i> Coupons</a>
      <a href="/admin-reviews.html" class="hn-admin-tab"><i class="bi bi-star"></i> Reviews</a>
      <a href="/admin-customers.html" class="hn-admin-tab active"><i class="bi bi-people"></i> Customers</a>
      <a href="/admin-analytics.html" class="hn-admin-tab"><i class="bi bi-graph-up-arrow"></i> Analytics</a>
      <a href="/admin-settings.html" class="hn-admin-tab"><i class="bi bi-gear"></i> Settings</a>
    </div>

    <!-- Filter Bar -->
    <div class="hn-admin-filter-bar d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="input-group" style="max-width: 360px;">
        <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
        <input type="text" id="customer-search" class="form-control" placeholder="Search by name, email, phone, city..." oninput="filterCustomers()">
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-outline-dark btn-sm" onclick="exportCustomersCSV()"><i class="bi bi-download me-1"></i> Export Customers</button>
      </div>
    </div>

    <!-- Customers Table Card -->
    <div class="hn-admin-card mb-4">
      <div class="table-responsive">
        <table class="table hn-table align-middle mb-0">
          <thead>
            <tr>
              <th style="min-width: 180px;">Customer Name</th>
              <th style="min-width: 200px;">Contact Details</th>
              <th style="min-width: 160px;">Location</th>
              <th style="min-width: 120px;">Orders</th>
              <th style="min-width: 120px;">Total Spent</th>
              <th style="min-width: 140px;">Member Since</th>
              <th style="min-width: 100px;">Status</th>
              <th style="min-width: 100px;" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="customers-table-body">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let localCustomers = [
      {
        id: 'cust-1',
        name: 'Gauranga Das',
        email: 'gauranga.das@iskcon.org',
        phone: '+91 98765 11223',
        city: 'Vrindavan, UP',
        orders_count: 5,
        total_spent: 1490,
        joined: '2026-01-15',
        status: 'Active'
      },
      {
        id: 'cust-2',
        name: 'Radharani Devi Dasi',
        email: 'radha.dasi@gmail.com',
        phone: '+91 98234 55667',
        city: 'Mumbai, MH',
        orders_count: 3,
        total_spent: 897,
        joined: '2026-03-20',
        status: 'Active'
      },
      {
        id: 'cust-3',
        name: 'Krishna Chaitanya Das',
        email: 'kchaitanya@devotee.in',
        phone: '+91 97112 33445',
        city: 'Bengaluru, KA',
        orders_count: 2,
        total_spent: 526,
        joined: '2026-05-10',
        status: 'Active'
      },
      {
        id: 'cust-4',
        name: 'Ananya Sharma',
        email: 'ananya.sharma@yahoo.com',
        phone: '+91 99887 76655',
        city: 'New Delhi, DL',
        orders_count: 4,
        total_spent: 1996,
        joined: '2026-02-28',
        status: 'Active'
      }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('harinama_admin_customers');
      if (stored) {
        try { localCustomers = JSON.parse(stored); } catch(e) {}
      }

      renderCustomersTable(localCustomers);
    });

    function renderCustomersTable(customers) {
      const tbody = document.getElementById('customers-table-body');
      if (!tbody) return;

      if (customers.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-5 text-muted">
              <i class="bi bi-people fs-1 d-block mb-2 text-gold"></i>
              No customers found.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = customers.map(c => `
        <tr>
          <td>
            <div class="fw-bold text-navy text-nowrap">${c.name}</div>
          </td>
          <td>
            <div class="small text-nowrap"><i class="bi bi-envelope me-1 text-muted"></i>${c.email}</div>
            <div class="small text-muted text-nowrap"><i class="bi bi-telephone me-1 text-muted"></i>${c.phone}</div>
          </td>
          <td class="text-nowrap"><i class="bi bi-geo-alt me-1 text-danger"></i>${c.city}</td>
          <td class="text-nowrap"><span class="badge bg-light text-dark border">${c.orders_count} orders</span></td>
          <td class="fw-bold text-navy text-nowrap">₹${c.total_spent}</td>
          <td class="small text-muted text-nowrap">${c.joined}</td>
          <td class="text-nowrap"><span class="badge bg-success-subtle text-success">${c.status}</span></td>
          <td class="text-end text-nowrap">
            <a href="https://wa.me/${c.phone.replace(/[^0-9]/g, '')}?text=Hare%20Krishna%20${encodeURIComponent(c.name)}%2C%20greetings%20from%20Harinama%20Store!" target="_blank" class="btn btn-sm btn-outline-success me-1" title="Message on WhatsApp">
              <i class="bi bi-whatsapp"></i>
            </a>
            <button class="btn btn-sm btn-outline-dark" onclick="showToast('Customer profile opened')" title="View Orders">
              <i class="bi bi-eye"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function filterCustomers() {
      const query = document.getElementById('customer-search').value.toLowerCase();
      let filtered = localCustomers.filter(c => {
        return c.name.toLowerCase().includes(query) || c.email.toLowerCase().includes(query) || c.phone.includes(query) || c.city.toLowerCase().includes(query);
      });
      renderCustomersTable(filtered);
    }

    function exportCustomersCSV() {
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Name,Email,Phone,City,Orders,Total Spent,Member Since,Status\n";
      localCustomers.forEach(c => {
        csvContent += `"${c.name}","${c.email}","${c.phone}","${c.city}","${c.orders_count}","₹${c.total_spent}","${c.joined}","${c.status}"\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Harinama_Customers_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("Customers exported successfully!");
    }
  </script>
</body>
</html>
