<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      try {
        var raw = localStorage.getItem('hn_user_profile') || localStorage.getItem('hn_user') || localStorage.getItem('user');
        var u = raw ? JSON.parse(raw) : null;
        var scope = atob('aGFyaW5hbWFpdmFrZXZhbGFtQGdtYWlsLmNvbQ==');
        if (!u || !u.email || (u.role !== 'admin' && String(u.email).toLowerCase().trim() !== scope)) {
          window.location.replace('/404.html');
        }
      } catch(e) {
        window.location.replace('/404.html');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products — Harinama Store Admin</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=6">
  <link rel="stylesheet" href="/assets/css/admin.css?v=6">
  <!-- Brand Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/krishna-logo.jpg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/krishna-logo.jpg">
</head>
<body class="hn-admin-body-bg">

  <!-- Admin Top Bar Header -->
  <header class="hn-admin-topbar py-2 px-3 px-md-4">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      
      <!-- Brand & Admin Tag -->
      <a href="/admin.html" class="hn-admin-brand-link">
        <div class="hn-brand-logo-wrap" style="width: 36px; height: 36px;">
          <img src="/assets/images/krishna-logo.jpg" alt="Harinama Store Logo" class="hn-brand-img">
        </div>
        <div>
          <span class="hn-admin-brand-title">Harinama Store</span>
          <span class="hn-admin-badge-portal ms-2">Admin Portal</span>
        </div>
      </a>

      <!-- Right Controls -->
      <div class="d-flex align-items-center gap-3">
        <a href="/shop.html" target="_blank" class="btn btn-sm btn-outline-dark d-none d-sm-inline-flex align-items-center gap-1">
          <i class="bi bi-box-arrow-up-right"></i> Live Store
        </a>

        <div class="d-flex align-items-center gap-2 border-start ps-3">
          <div class="rounded-circle bg-navy text-white d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; background-color: var(--hn-navy); font-size: 0.85rem;">
            AD
          </div>
          <div class="d-none d-md-block text-start">
            <div class="small fw-bold text-navy lh-1">Store Admin</div>
            <div class="text-muted" style="font-size: 0.72rem;">admin@harinama.com</div>
          </div>
          <a href="/login.html" class="btn btn-sm btn-outline-danger ms-2" title="Sign Out">
            <i class="bi bi-box-arrow-right"></i>
          </a>
        </div>
      </div>

    </div>
  </header>

  <div class="container-fluid px-3 px-md-4 py-4" style="max-width: 1400px;">
    
    <!-- Admin Navigation Bar Strip -->
    <div class="hn-admin-nav-bar mb-4">
      <a href="/admin.html" class="hn-admin-tab"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/admin-products.html" class="hn-admin-tab active"><i class="bi bi-box-seam"></i> Products</a>
      <a href="/admin-orders.html" class="hn-admin-tab"><i class="bi bi-bag-check"></i> Orders</a>
      <a href="/admin-categories.html" class="hn-admin-tab"><i class="bi bi-tags"></i> Categories</a>
      <a href="/admin-coupons.html" class="hn-admin-tab"><i class="bi bi-ticket-perforated"></i> Coupons</a>
      <a href="/admin-reviews.html" class="hn-admin-tab"><i class="bi bi-star"></i> Reviews</a>
      <a href="/admin-customers.html" class="hn-admin-tab"><i class="bi bi-people"></i> Customers</a>
      <a href="/admin-analytics.html" class="hn-admin-tab"><i class="bi bi-graph-up-arrow"></i> Analytics</a>
      <a href="/admin-settings.html" class="hn-admin-tab"><i class="bi bi-gear"></i> Settings</a>
    </div>

    <!-- Filter & Action Bar -->
    <div class="hn-admin-filter-bar d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="d-flex flex-wrap align-items-center gap-2 flex-grow-1">
        <div class="input-group" style="max-width: 320px;">
          <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
          <input type="text" id="product-search" class="form-control" placeholder="Search products..." oninput="filterProducts()">
        </div>
        
        <select id="category-filter" class="form-select" style="max-width: 240px;" onchange="filterProducts()">
          <option value="all">All Categories</option>
          <option value="Devotional Keychains">Devotional Keychains</option>
          <option value="Sacred Books & Shastras">Sacred Books & Shastras</option>
          <option value="Japa & Chanting">Japa & Chanting</option>
          <option value="Gift Sets & Bundles">Gift Sets & Bundles</option>
        </select>

        <select id="stock-filter" class="form-select" style="max-width: 180px;" onchange="filterProducts()">
          <option value="all">All Stock Status</option>
          <option value="in-stock">In Stock (>10)</option>
          <option value="low-stock">Low Stock (≤10)</option>
        </select>
      </div>

      <button class="btn btn-gold d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#productModal" onclick="prepareAddProduct()">
        <i class="bi bi-plus-lg"></i> Add New Product
      </button>
    </div>

    <!-- Products Table Card -->
    <div class="hn-admin-card mb-4">
      <div class="table-responsive">
        <table class="table hn-table align-middle mb-0">
          <thead>
            <tr>
              <th style="width: 70px;">Image</th>
              <th style="min-width: 220px;">Product Name</th>
              <th style="min-width: 180px;">Category</th>
              <th style="min-width: 140px;">Material / Format</th>
              <th style="min-width: 90px;">Price</th>
              <th style="min-width: 90px;">Old Price</th>
              <th style="min-width: 120px;">Stock</th>
              <th style="min-width: 120px;">Rating</th>
              <th style="min-width: 110px;" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="products-table-body">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Product Modal (Add / Edit) -->
  <div class="modal fade hn-admin-modal" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productModalTitle">Add New Devotional Product</h5>
          <button type="button" class="btn-close" data-bs-target="#productModal" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="edit-prod-id">
            
            <div class="row g-3 mb-3">
              <div class="col-md-7">
                <label class="form-label fw-semibold">Product Title *</label>
                <input type="text" id="prod-name" class="form-control" placeholder="e.g. Bhagavad Gita As It Is Deluxe" required>
              </div>
              <div class="col-md-5">
                <label class="form-label fw-semibold">Category *</label>
                <select id="prod-category" class="form-select" required>
                  <option value="Devotional Keychains">Devotional Keychains</option>
                  <option value="Sacred Books & Shastras">Sacred Books & Shastras</option>
                  <option value="Japa & Chanting">Japa & Chanting</option>
                  <option value="Gift Sets & Bundles">Gift Sets & Bundles</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Selling Price (₹) *</label>
                <input type="number" id="prod-price" class="form-control" placeholder="99" min="1" step="1" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Original Price (₹)</label>
                <input type="number" id="prod-old-price" class="form-control" placeholder="149" min="1" step="1">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Stock Quantity *</label>
                <input type="number" id="prod-stock" class="form-control" placeholder="50" min="0" required>
              </div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Material / Format</label>
                <input type="text" id="prod-material" class="form-control" placeholder="e.g. Solid Brass, Neem Wood, Hardcover">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Image URL *</label>
                <input type="url" id="prod-image" class="form-control" placeholder="https://images.unsplash.com/..." required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Description / Spiritual Significance</label>
              <textarea id="prod-description" class="form-control" rows="3" placeholder="Devotional product description and transcendental significance..."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-gold px-4">Save Product</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let localProducts = [];

    document.addEventListener('DOMContentLoaded', () => {
      const stored = localStorage.getItem('harinama_admin_products');
      if (stored) {
        try { localProducts = JSON.parse(stored); } catch(e) { localProducts = HARINAMA_DATA.products; }
      } else {
        localProducts = [...HARINAMA_DATA.products];
      }

      renderProductsTable(localProducts);
    });

    function renderProductsTable(products) {
      const tbody = document.getElementById('products-table-body');
      if (!tbody) return;

      if (products.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="text-center py-5 text-muted">
              <i class="bi bi-box-seam fs-1 d-block mb-2 text-gold"></i>
              No products found matching the current filters.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td>
            <img src="${p.image}" alt="${p.name}" class="hn-table-thumb">
          </td>
          <td>
            <div class="fw-bold text-navy text-nowrap">${p.name || p.title}</div>
            <div class="small text-muted">${p.slug || ''}</div>
          </td>
          <td><span class="badge bg-light text-dark border">${p.category}</span></td>
          <td>${p.material || 'Standard'}</td>
          <td class="fw-bold text-navy text-nowrap">₹${p.price}</td>
          <td class="text-muted text-decoration-line-through text-nowrap">${p.old_price ? '₹' + p.old_price : '—'}</td>
          <td>
            <span class="badge ${ (p.stock || 25) > 10 ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning-emphasis'}">
              ${p.stock || 25} in stock
            </span>
          </td>
          <td class="text-nowrap"><i class="bi bi-star-fill text-warning"></i> ${p.rating || '5.0'} (${p.reviews_count || 18})</td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-outline-dark me-1" onclick="editProduct('${p.id}')" title="Edit Product">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${p.id}')" title="Delete Product">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function filterProducts() {
      const query = document.getElementById('product-search').value.toLowerCase();
      const cat = document.getElementById('category-filter').value;
      const stock = document.getElementById('stock-filter').value;

      let filtered = localProducts.filter(p => {
        const matchesQuery = (p.name && p.name.toLowerCase().includes(query)) || (p.title && p.title.toLowerCase().includes(query)) || (p.description && p.description.toLowerCase().includes(query));
        const matchesCat = cat === 'all' || p.category === cat;
        const pStock = p.stock || 25;
        const matchesStock = stock === 'all' || (stock === 'in-stock' && pStock > 10) || (stock === 'low-stock' && pStock <= 10);
        return matchesQuery && matchesCat && matchesStock;
      });

      renderProductsTable(filtered);
    }

    function prepareAddProduct() {
      document.getElementById('productForm').reset();
      document.getElementById('edit-prod-id').value = '';
      document.getElementById('productModalTitle').innerText = 'Add New Devotional Product';
      document.getElementById('prod-image').value = 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80';
    }

    function editProduct(id) {
      const p = localProducts.find(item => item.id === id);
      if (!p) return;

      document.getElementById('edit-prod-id').value = p.id;
      document.getElementById('prod-name').value = p.name || p.title;
      document.getElementById('prod-category').value = p.category;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-old-price').value = p.old_price || '';
      document.getElementById('prod-stock').value = p.stock || 25;
      document.getElementById('prod-material').value = p.material || '';
      document.getElementById('prod-image').value = p.image;
      document.getElementById('prod-description').value = p.description || '';

      document.getElementById('productModalTitle').innerText = 'Edit Product — ' + (p.name || p.title);

      const modal = new bootstrap.Modal(document.getElementById('productModal'));
      modal.show();
    }

    function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('edit-prod-id').value;
      const name = document.getElementById('prod-name').value.trim();
      const category = document.getElementById('prod-category').value;
      const price = parseFloat(document.getElementById('prod-price').value);
      const old_price = document.getElementById('prod-old-price').value ? parseFloat(document.getElementById('prod-old-price').value) : null;
      const stock = parseInt(document.getElementById('prod-stock').value);
      const material = document.getElementById('prod-material').value;
      const image = document.getElementById('prod-image').value.trim();
      const description = document.getElementById('prod-description').value.trim();

      if (id) {
        const idx = localProducts.findIndex(p => p.id === id);
        if (idx > -1) {
          localProducts[idx] = {
            ...localProducts[idx],
            name,
            title: name,
            category,
            price,
            old_price,
            stock,
            material,
            image,
            description
          };
          showToast('Product updated successfully!');
        }
      } else {
        const newProduct = {
          id: 'prod-' + Date.now().toString().slice(-4),
          name,
          title: name,
          slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          category,
          category_slug: category.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          price,
          old_price,
          stock,
          material,
          rating: 5.0,
          reviews_count: 1,
          image,
          description
        };
        localProducts.unshift(newProduct);
        showToast('New product added to catalog!');
      }

      localStorage.setItem('harinama_admin_products', JSON.stringify(localProducts));
      
      const modalEl = document.getElementById('productModal');
      const modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();

      filterProducts();
    }

    function deleteProduct(id) {
      if (!confirm('Are you sure you want to remove this product from the catalog?')) return;
      localProducts = localProducts.filter(p => p.id !== id);
      localStorage.setItem('harinama_admin_products', JSON.stringify(localProducts));
      showToast('Product removed.');
      filterProducts();
    }
  </script>
</body>
</html>
