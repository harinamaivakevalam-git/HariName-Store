<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products - Sample Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Header Placeholder -->
  <div id="hn-header-placeholder"></div>

  <main class="container my-4">
    <!-- Breadcrumbs -->
    <nav aria-label="breadcrumb" class="mb-3">
      <ol class="breadcrumb small">
        <li class="breadcrumb-item"><a href="/index.html">Home</a></li>
        <li class="breadcrumb-item active">Products</li>
      </ol>
    </nav>

    <h2 class="fw-bold mb-4">All Products</h2>

    <div class="row g-4">
      <!-- Left Filter Sidebar with Mobile Accordion Collapse -->
      <div class="col-lg-3">
        <!-- Mobile Filter Toggle Button -->
        <button class="btn btn-outline-primary w-100 rounded-pill py-2 mb-3 d-lg-none fw-semibold d-flex align-items-center justify-content-between px-4 shadow-sm" type="button" data-bs-toggle="collapse" data-bs-target="#mobileFilterCollapse" aria-expanded="false" aria-controls="mobileFilterCollapse">
          <span><i class="bi bi-funnel me-2"></i>Filter Products</span>
          <i class="bi bi-chevron-down"></i>
        </button>

        <div class="collapse d-lg-block" id="mobileFilterCollapse">
          <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
            
            <!-- Categories Filter -->
            <div class="mb-4">
              <h6 class="fw-bold small text-uppercase text-muted mb-3">Categories</h6>
              <div class="d-flex flex-column gap-2" id="prod-filter-categories">
                <!-- Injected dynamically -->
              </div>
            </div>

            <hr class="my-3 opacity-25">

            <!-- Price Range Filter -->
            <div class="mb-4">
              <h6 class="fw-bold small text-uppercase text-muted mb-2">Price Range</h6>
              <div class="d-flex justify-content-between small text-muted mb-2">
                <span>$0</span>
                <span id="price-slider-val" class="fw-bold text-primary">$500</span>
              </div>
              <input type="range" class="form-range" id="price-range-slider" min="50" max="500" value="500" oninput="applyCatalogFilters()">
            </div>

            <hr class="my-3 opacity-25">

            <!-- Brand Filter -->
            <div class="mb-4">
              <h6 class="fw-bold small text-uppercase text-muted mb-3">Brand</h6>
              <div class="d-flex flex-column gap-2">
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="checkbox" value="Sony" onchange="applyCatalogFilters()"> Sony
                </label>
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="checkbox" value="JBL" onchange="applyCatalogFilters()"> JBL
                </label>
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="checkbox" value="Bose" onchange="applyCatalogFilters()"> Bose
                </label>
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="checkbox" value="Apple" onchange="applyCatalogFilters()"> Apple
                </label>
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="checkbox" value="Samsung" onchange="applyCatalogFilters()"> Samsung
                </label>
              </div>
            </div>

            <hr class="my-3 opacity-25">

            <!-- Rating Filter -->
            <div class="mb-4">
              <h6 class="fw-bold small text-uppercase text-muted mb-3">Rating</h6>
              <div class="d-flex flex-column gap-2">
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="radio" name="catRating" value="5" onchange="applyCatalogFilters()">
                  <span class="text-warning"><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i></span>
                </label>
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="radio" name="catRating" value="4" onchange="applyCatalogFilters()">
                  <span class="text-warning"><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star"></i></span>
                </label>
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="radio" name="catRating" value="all" checked onchange="applyCatalogFilters()">
                  <span class="text-muted">All Ratings</span>
                </label>
              </div>
            </div>

            <hr class="my-3 opacity-25">

            <!-- Availability -->
            <div>
              <h6 class="fw-bold small text-uppercase text-muted mb-3">Availability</h6>
              <div class="d-flex flex-column gap-2">
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="checkbox" id="avail-in-stock" checked onchange="applyCatalogFilters()"> In Stock
                </label>
                <label class="form-check d-flex align-items-center gap-2 cursor-pointer small">
                  <input class="form-check-input" type="checkbox" id="avail-out-stock" onchange="applyCatalogFilters()"> Out of Stock
                </label>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- Right Products Grid -->
      <div class="col-lg-9">
        
        <!-- Top Toolbar -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">
          <div class="small text-muted" id="catalog-count-text">Showing 1-12 of 120 products</div>
          <div class="d-flex align-items-center gap-2">
            <span class="small text-muted text-nowrap">Sort by:</span>
            <select class="form-select form-select-sm rounded-pill border-0 shadow-sm px-3 flex-grow-1" id="catalog-sort" style="min-width: 150px;" onchange="applyCatalogFilters()">
              <option value="popularity">Popularity</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
            </select>
          </div>
        </div>

        <!-- Products Grid (3 columns matching reference) -->
        <div class="row g-4" id="catalog-products-grid">
          <!-- Injected dynamically -->
        </div>

        <!-- Pagination Controls -->
        <div class="d-flex justify-content-center mt-5" id="catalog-pagination-container">
          <!-- Injected dynamically -->
        </div>

      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>

  <script>
    let selectedCategory = '';
    let currentPage = 1;
    const PAGE_SIZE = 6;

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('products');
      renderFooter();

      // Check category in URL params
      const urlParams = new URLSearchParams(window.location.search);
      selectedCategory = urlParams.get('category') || '';

      renderCategoryFilters();
      applyCatalogFilters();
    });

    const renderCategoryFilters = () => {
      const container = document.getElementById('prod-filter-categories');
      container.innerHTML = `
        <label class="form-check d-flex justify-content-between align-items-center cursor-pointer small">
          <span class="d-flex align-items-center gap-2">
            <input class="form-check-input" type="radio" name="prodCat" value="" ${!selectedCategory ? 'checked' : ''} onchange="onSelectCategory('')">
            All Products
          </span>
        </label>
      ` + CRESCENDO_DATA.categories.map(c => `
        <label class="form-check d-flex justify-content-between align-items-center cursor-pointer small">
          <span class="d-flex align-items-center gap-2">
            <input class="form-check-input" type="radio" name="prodCat" value="${c.slug}" ${selectedCategory === c.slug ? 'checked' : ''} onchange="onSelectCategory('${c.slug}')">
            ${c.name}
          </span>
          <span class="text-muted small">${c.count}</span>
        </label>
      `).join('');
    };

    window.onSelectCategory = (slug) => {
      selectedCategory = slug;
      currentPage = 1;
      applyCatalogFilters();
    };

    window.goToPage = (page) => {
      currentPage = page;
      applyCatalogFilters();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    };

    window.applyCatalogFilters = () => {
      const maxPrice = parseFloat(document.getElementById('price-range-slider').value);
      document.getElementById('price-slider-val').textContent = `$${maxPrice}`;

      const selectedBrands = Array.from(document.querySelectorAll('input[type="checkbox"][value]:checked')).map(cb => cb.value);
      const rating = document.querySelector('input[name="catRating"]:checked')?.value;
      const sort = document.getElementById('catalog-sort').value;
      const inStockOnly = document.getElementById('avail-in-stock').checked;
      const outStockOnly = document.getElementById('avail-out-stock').checked;

      let filtered = [...CRESCENDO_DATA.products];

      if (selectedCategory) {
        filtered = filtered.filter(p => p.category_slug === selectedCategory);
      }

      filtered = filtered.filter(p => p.price <= maxPrice);

      if (selectedBrands.length > 0) {
        filtered = filtered.filter(p => selectedBrands.includes(p.brand));
      }

      if (rating && rating !== 'all') {
        filtered = filtered.filter(p => p.rating >= parseFloat(rating));
      }

      if (inStockOnly && !outStockOnly) {
        filtered = filtered.filter(p => p.stock > 0);
      } else if (!inStockOnly && outStockOnly) {
        filtered = filtered.filter(p => p.stock === 0);
      }

      if (sort === 'price-asc') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sort === 'price-desc') {
        filtered.sort((a, b) => b.price - a.price);
      } else if (sort === 'rating') {
        filtered.sort((a, b) => b.rating - a.rating);
      }

      const totalItems = filtered.length;
      const totalPages = Math.ceil(totalItems / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const endIndex = Math.min(startIndex + PAGE_SIZE, totalItems);
      const paginatedItems = filtered.slice(startIndex, endIndex);

      const grid = document.getElementById('catalog-products-grid');
      const countText = document.getElementById('catalog-count-text');
      const pagContainer = document.getElementById('catalog-pagination-container');

      if (totalItems === 0) {
        countText.textContent = `Showing 0 products`;
        grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="bi bi-search display-3"></i><p class="mt-3">No products match your filters.</p></div>';
        pagContainer.innerHTML = '';
        return;
      }

      countText.textContent = `Showing ${startIndex + 1}-${endIndex} of ${totalItems} products`;

      grid.innerHTML = paginatedItems.map(p => `
        <div class="col-6 col-md-4">
          ${renderProductCard(p)}
        </div>
      `).join('');

      // Render Pagination Buttons
      let pagHtml = '<ul class="pagination shadow-sm rounded-pill overflow-hidden mb-0">';
      pagHtml += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><button class="page-link" onclick="goToPage(${currentPage - 1})" aria-label="Previous">&laquo;</button></li>`;
      for (let i = 1; i <= totalPages; i++) {
        pagHtml += `<li class="page-item ${i === currentPage ? 'active' : ''}"><button class="page-link" onclick="goToPage(${i})">${i}</button></li>`;
      }
      pagHtml += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><button class="page-link" onclick="goToPage(${currentPage + 1})" aria-label="Next">&raquo;</button></li>`;
      pagHtml += '</ul>';

      pagContainer.innerHTML = pagHtml;
    };
  </script>
</body>
</html>
