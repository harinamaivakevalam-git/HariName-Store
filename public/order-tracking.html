<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking — Harinama Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          
          <div class="bg-white border rounded shadow-sm p-4 p-md-5 mb-4">
            <div class="text-center mb-4">
              <h2 class="hn-section-title mb-1" style="font-size: 1.8rem;">Track Your Order</h2>
              <div class="text-secondary small">Order ID: <span class="fw-bold text-navy" id="hn-track-order-id">#HN-2026-98124</span></div>
            </div>

            <!-- Status Timeline -->
            <div class="py-4">
              <div class="d-flex justify-content-between position-relative mb-4">
                <div class="text-center" style="z-index: 2;">
                  <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center mx-auto mb-2" style="width: 40px; height: 40px;">
                    <i class="bi bi-check-lg"></i>
                  </div>
                  <div class="small fw-bold">Confirmed</div>
                  <div class="text-muted" style="font-size: 0.75rem;">12 Sep 10:30 AM</div>
                </div>

                <div class="text-center" style="z-index: 2;">
                  <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center mx-auto mb-2" style="width: 40px; height: 40px;">
                    <i class="bi bi-box-seam"></i>
                  </div>
                  <div class="small fw-bold">Packed</div>
                  <div class="text-muted" style="font-size: 0.75rem;">12 Sep 02:15 PM</div>
                </div>

                <div class="text-center" style="z-index: 2;">
                  <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center mx-auto mb-2" style="width: 40px; height: 40px;">
                    <i class="bi bi-truck"></i>
                  </div>
                  <div class="small fw-bold">Dispatched</div>
                  <div class="text-muted" style="font-size: 0.75rem;">13 Sep 09:00 AM</div>
                </div>

                <div class="text-center" style="z-index: 2;">
                  <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center mx-auto mb-2" style="width: 40px; height: 40px;">
                    <i class="bi bi-house-door"></i>
                  </div>
                  <div class="small fw-bold">Delivered</div>
                  <div class="text-muted" style="font-size: 0.75rem;">14 Sep 04:30 PM</div>
                </div>
              </div>
            </div>

            <div class="p-3 bg-light rounded border text-center small text-secondary">
              <span class="fw-bold text-navy">Carrier:</span> BlueDart Express &nbsp;|&nbsp;
              <span class="fw-bold text-navy">Tracking AWB:</span> <code>BD77291039IN</code>
            </div>

            <div class="text-center mt-4">
              <a href="/shop.html" class="btn hn-btn-gold">Continue Shopping</a>
            </div>

          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('orders');
      renderFooter();
      const params = new URLSearchParams(window.location.search);
      const order = params.get('order');
      if (order) {
        document.getElementById('hn-track-order-id').innerText = '#' + order;
      }
    });
  </script>
</body>
</html>
