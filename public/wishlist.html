<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist — Harinama Store</title>
  
  <!-- Google Fonts: Poppins Master Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=12">
  <!-- Brand Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/krishna-logo.jpg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/krishna-logo.jpg">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      
      <!-- Login Invitation Banner when unauthenticated -->
      <div id="hn-wishlist-auth-banner"></div>

      <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
        <h1 class="hn-section-title mb-0" style="font-size: 2rem;">My Wishlist</h1>
        <a href="/shop.html" class="text-secondary small fw-semibold">Browse Products</a>
      </div>

      <div class="row g-4">
        
        <!-- Left Sidebar Navigation -->
        <div class="col-lg-3">
          <div class="bg-white border rounded p-3 shadow-sm">
            <div class="d-flex flex-column gap-1">
              <a href="/account.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-person"></i> Profile Overview
              </a>
              <a href="/orders.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-box-seam"></i> My Orders
              </a>
              <a href="/wishlist.html" class="p-2 rounded text-navy fw-bold bg-light d-flex align-items-center gap-2">
                <i class="bi bi-heart"></i> Wishlist
              </a>
              <a href="/addresses.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-geo-alt"></i> Addresses
              </a>
            </div>
          </div>
        </div>

        <!-- Right Wishlist Grid -->
        <div class="col-lg-9">
          <div class="row g-3" id="hn-wishlist-grid">
            <!-- Dynamic items -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/product-image-service.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js?v=15"></script>
  <script>
    function renderWishlist() {
      const grid = document.getElementById('hn-wishlist-grid');
      if (!grid) return;

      // Render Sign In Prompt Banner if user is logged out
      const banner = document.getElementById('hn-wishlist-auth-banner');
      if (banner) {
        if (!isUserLoggedIn()) {
          banner.innerHTML = `
            <div class="alert border-0 shadow-sm rounded-4 p-3 p-md-4 mb-4 d-flex align-items-center justify-content-between flex-wrap gap-3" style="background: linear-gradient(135deg, #FFF9EC, #FEF0D5); border: 1.5px solid rgba(197, 155, 39, 0.4) !important;">
              <div class="d-flex align-items-center gap-3">
                <span class="d-inline-flex align-items-center justify-content-center rounded-circle" style="width: 44px; height: 44px; background: #FFFFFF; color: var(--hn-gold); font-size: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                  <i class="bi bi-person-lock"></i>
                </span>
                <div>
                  <div class="fw-bold text-navy" style="font-size: 0.95rem;">Sign in to save and sync your Wishlist</div>
                  <div class="small text-secondary">Log in with your account to access your saved sacred items across all your devices.</div>
                </div>
              </div>
              <a href="/login.html" class="btn hn-btn-gold px-4 py-2 fw-bold text-decoration-none shadow-sm">
                <i class="bi bi-person-circle me-1"></i> Sign In / Register
              </a>
            </div>
          `;
        } else {
          banner.innerHTML = '';
        }
      }

      let wishlistIds = isUserLoggedIn() ? JSON.parse(localStorage.getItem('hn_wishlist') || '[]') : [];
      
      if (!isUserLoggedIn() || !wishlistIds || wishlistIds.length === 0) {
        grid.innerHTML = `
          <div class="col-12 py-5 text-center">
            <i class="bi bi-heart fs-1 text-muted d-block mb-3"></i>
            <h5 class="fw-bold">Your Wishlist is Empty</h5>
            <p class="text-muted small mb-4">Save your favorite holy products and books to view them anytime.</p>
            <a href="/shop.html" class="btn hn-btn-gold">Explore Devotional Products</a>
          </div>
        `;
        if (typeof updateHeaderBadges === 'function') updateHeaderBadges();
        return;
      }

      const allCatalog = [...(HARINAMA_DATA.products || []), ...(HARINAMA_DATA._staticProducts || [])];
      const seen = new Set();
      const uniqueCatalog = [];
      for (const p of allCatalog) {
        if (!p) continue;
        const key = p.slug || p.id;
        if (!seen.has(key)) {
          seen.add(key);
          uniqueCatalog.push(p);
        }
      }

      const products = uniqueCatalog.filter(p => 
        wishlistIds.includes(p.id) || 
        (p.legacy_id && wishlistIds.includes(p.legacy_id)) || 
        (p.slug && wishlistIds.includes(p.slug))
      );

      if (products.length === 0) {
        grid.innerHTML = `
          <div class="col-12 py-5 text-center">
            <i class="bi bi-heart fs-1 text-muted d-block mb-3"></i>
            <h5 class="fw-bold">Your Wishlist is Empty</h5>
            <p class="text-muted small mb-4">Save your favorite holy products and books to view them anytime.</p>
            <a href="/shop.html" class="btn hn-btn-gold">Explore Devotional Products</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = products.map(p => {
        const rawImg = p.image || p.primary_image || (p.images && p.images[0]) || '';
        const imgSrc = window.getProductImageUrl ? window.getProductImageUrl(rawImg, { width: 360, quality: 80, format: 'webp' }) : (rawImg || '/assets/images/krishna-logo.jpg');
        const prodLink = `/product-details.html?id=${encodeURIComponent(p.slug || p.id)}`;
        return `
          <div class="col-6 col-md-4">
            <div class="hn-product-card" id="wish-card-${p.id}">
              
              <button type="button" class="hn-card-wishlist active text-danger" onclick="removeFromWishlistPage('${p.id}')" title="Remove from Wishlist" aria-label="Remove item">
                <i class="bi bi-trash"></i>
              </button>

              <a href="${prodLink}" class="hn-card-img-box">
                <img src="${imgSrc}" data-original-src="${rawImg}" alt="${p.name || p.title || 'Sacred Item'}" onerror="if(window.handleProductImageError){handleProductImageError(this, '${rawImg}');}else{this.onerror=null;this.src='/assets/images/krishna-logo.jpg';}" loading="lazy" decoding="async">
              </a>

              <div class="hn-card-title">
                <a href="${prodLink}">${p.name || p.title}</a>
              </div>

              <div class="hn-card-price">${formatPrice(p.price)}</div>
              
              ${renderRatingStars(p.rating, p.reviews_count)}

              <div class="d-flex flex-column gap-2 mt-auto pt-2">
                <button type="button" class="hn-btn-card-add w-100" onclick="handleAddToCart('${p.id}')">
                  Add to Cart
                </button>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    function removeFromWishlistPage(prodId) {
      const prod = findCatalogProduct(prodId);
      const canonId = prod ? prod.id : prodId;
      const legId = prod ? prod.legacy_id : null;
      const slug = prod ? prod.slug : null;

      let wishlist = JSON.parse(localStorage.getItem('hn_wishlist') || '[]');
      wishlist = wishlist.filter(id => id !== prodId && id !== canonId && id !== legId && id !== slug);
      localStorage.setItem('hn_wishlist', JSON.stringify(wishlist));
      showToast('Item removed from wishlist.');
      renderWishlist();
      window.dispatchEvent(new CustomEvent('hn_wishlist_updated', { detail: wishlist }));
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();
      renderWishlist();
      window.addEventListener('hn_wishlist_updated', renderWishlist);
      window.addEventListener('hn:catalog-loaded', renderWishlist);
      window.addEventListener('hn:catalog-changed', renderWishlist);

      // Ask for login if user is not logged in when visiting wishlist.html
      if (!isUserLoggedIn()) {
        setTimeout(() => {
          if (typeof openAuthModal === 'function') {
            openAuthModal(null, 'Sign in to access your sacred wishlist and saved items 🌸');
          }
        }, 300);
      }
    });
  </script>
</body>
</html>
