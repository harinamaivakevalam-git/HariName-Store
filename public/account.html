<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Harinama Store</title>
  <meta name="description" content="Manage your Harinama Store profile, shipping addresses, past orders, and wishlist.">
  
  <!-- Google Fonts: Poppins Master Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      
      <!-- Account Header -->
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3 border-bottom">
        <div>
          <h1 class="hn-section-title text-start mb-1" style="font-size: 2rem;">My Account</h1>
          <div class="text-secondary small">Welcome back, <span class="fw-bold text-navy" id="hn-user-name">Gauranga Das</span></div>
        </div>
        <div>
          <button class="btn btn-outline-danger btn-sm px-3" onclick="handleLogout()">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>
      </div>

      <div class="row g-4">
        
        <!-- Left Account Nav Tabs -->
        <div class="col-lg-3">
          <div class="bg-white border rounded p-3 shadow-sm">
            <div class="d-flex flex-column gap-1">
              <a href="/account.html" class="p-2 rounded text-navy fw-bold bg-light d-flex align-items-center gap-2">
                <i class="bi bi-person"></i> Profile Overview
              </a>
              <a href="/orders.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-box-seam"></i> My Orders
              </a>
              <a href="/wishlist.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-heart"></i> Wishlist
              </a>
              <a href="/addresses.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-geo-alt"></i> Addresses
              </a>
            </div>
          </div>
        </div>

        <!-- Right Content -->
        <div class="col-lg-9">
          
          <div class="row g-4 mb-4">
            <div class="col-md-4">
              <div class="p-4 bg-white border rounded shadow-sm text-center">
                <div class="fs-2 fw-bold text-navy mb-1" id="stat-orders-count">3</div>
                <div class="small text-secondary fw-semibold">Orders Placed</div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="p-4 bg-white border rounded shadow-sm text-center">
                <div class="fs-2 fw-bold text-navy mb-1" id="stat-wishlist-count">2</div>
                <div class="small text-secondary fw-semibold">Saved Products</div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="p-4 bg-white border rounded shadow-sm text-center">
                <div class="fs-2 fw-bold text-navy mb-1">1</div>
                <div class="small text-secondary fw-semibold">Saved Address</div>
              </div>
            </div>
          </div>

          <!-- Profile Details Form -->
          <div class="bg-white border rounded p-4 shadow-sm">
            <h4 class="fw-bold mb-4" style="font-family: var(--hn-font-serif); color: var(--hn-navy);">Personal Details</h4>
            
            <form onsubmit="handleProfileUpdate(event)">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Full Name</label>
                  <input type="text" class="form-control" id="profile-name" value="Gauranga Das" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Email Address</label>
                  <input type="email" class="form-control" id="profile-email" value="user@harinama.com" readonly>
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Phone Number</label>
                  <input type="tel" class="form-control" id="profile-phone" value="+91 91234 56789">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">City</label>
                  <input type="text" class="form-control" id="profile-city" value="Vrindavan">
                </div>
              </div>

              <button type="submit" class="btn hn-btn-gold px-4">Save Changes</button>
            </form>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    function handleLogout() {
      localStorage.removeItem('hn_auth_token');
      localStorage.removeItem('hn_user');
      showToast('Logged out successfully.');
      setTimeout(() => { window.location.href = '/login.html'; }, 700);
    }

    function handleProfileUpdate(e) {
      e.preventDefault();
      showToast('Profile information updated successfully.');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();
    });
  </script>
</body>
</html>
