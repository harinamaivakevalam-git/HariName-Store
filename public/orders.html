<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MSKX0904SY"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — Harinama Store</title>
  
  <!-- Google Fonts: Poppins Master Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
  <!-- Brand Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/krishna-logo.jpg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/krishna-logo.jpg">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      
      <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
        <h1 class="hn-section-title mb-0" style="font-size: 2rem;">My Orders</h1>
        <a href="/shop.html" class="btn hn-btn-gold btn-sm"><i class="bi bi-plus me-1"></i> New Order</a>
      </div>

      <div class="row g-4">
        
        <!-- Left Sidebar Navigation -->
        <div class="col-lg-3">
          <div class="bg-white border rounded p-3 shadow-sm">
            <div class="d-flex flex-column gap-1">
              <a href="/account.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-person"></i> Profile Overview
              </a>
              <a href="/orders.html" class="p-2 rounded text-navy fw-bold bg-light d-flex align-items-center gap-2">
                <i class="bi bi-box-seam"></i> My Orders
              </a>
              <a href="/wishlist.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-heart"></i> Wishlist
              </a>
              <a href="/addresses.html" class="p-2 rounded text-secondary d-flex align-items-center gap-2">
                <i class="bi bi-geo-alt"></i> Addresses
              </a>
            </div>
          </div>
        </div>

        <!-- Right Orders List -->
        <div class="col-lg-9" id="hn-orders-list-container">
          <!-- Dynamically populated from localStorage & sample history -->
        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/product-image-service.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    function getApiUrl(path) {
      if (window.location.protocol === 'file:') return 'http://localhost:5000' + path;
      if (window.location.port && window.location.port !== '5000' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        return `http://${window.location.hostname}:5000${path}`;
      }
      return path;
    }

    async function renderOrdersList() {
      const container = document.getElementById('hn-orders-list-container');
      if (!container) return;

      const orderMap = new Map();

      // 1. Initial cached orders from localStorage
      try {
        const storedOrders = JSON.parse(localStorage.getItem('hn_orders') || '[]');
        if (Array.isArray(storedOrders)) {
          storedOrders.forEach(o => {
            const id = o.orderId || o.order_number || o.id;
            if (id) orderMap.set(id, o);
          });
        }
      } catch (_) {}

      // 2. Try fetching from Backend API
      const token = localStorage.getItem('hn_auth_token') || localStorage.getItem('token');
      if (token) {
        try {
          const res = await fetch(getApiUrl('/api/orders/my-orders'), {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const json = await res.json();
            if (json.success && Array.isArray(json.data)) {
              json.data.forEach(o => {
                const id = o.order_number || o.id;
                if (id) {
                  orderMap.set(id, {
                    orderId: id,
                    id: id,
                    date: o.created_at ? new Date(o.created_at).toLocaleDateString('en-GB') : 'Recent',
                    status: o.order_status || o.status || 'Confirmed',
                    total: o.total || 0,
                    items: (o.items || o.order_items || []).map(it => ({
                      name: it.product_name || it.name || 'Sacred Item',
                      image: it.product_image || it.image || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=200&q=80',
                      material: it.variant_info?.material || it.material || 'Devotional Grade',
                      qty: it.quantity || it.qty || 1,
                      price: it.price || 0
                    }))
                  });
                }
              });
            }
          }
        } catch (_) {}
      }

      // 3. Try direct Supabase fetch
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          const SUPABASE_URL = 'https://wnaqfadlxrrvvjvqqbch.supabase.co';
          const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduYXFmYWRseHJydnZqdnFxYmNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzg4NTYsImV4cCI6MjEwNDkxNDg1Nn0.aZcWAzKfjHkozCus4V_xD3BwDSL8KIIEhASdf2NtdtM';
          const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          let u = null;
          try { u = JSON.parse(localStorage.getItem('hn_user') || localStorage.getItem('hn_user_profile') || '{}'); } catch (_) {}
          
          const adminEmails = ['harinamaivakevalam@gmail.com', 'katturojuanilkumar@gmail.com', 'admin@harinama.com'];
          const userEmail = u && u.email ? String(u.email).toLowerCase().trim() : '';
          const isAdmin = u && (u.role === 'admin' || u.is_admin || adminEmails.includes(userEmail));

          let q = sb.from('orders').select('*, order_items(*)').order('created_at', { ascending: false });

          if (!isAdmin) {
            const cachedOrderIds = Array.from(orderMap.keys()).filter(Boolean);
            if (userEmail && u.id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(u.id)) {
              q = q.or(`guest_email.eq.${userEmail},user_id.eq.${u.id}`);
            } else if (userEmail) {
              q = q.eq('guest_email', userEmail);
            } else if (u && u.id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(u.id)) {
              q = q.eq('user_id', u.id);
            } else if (cachedOrderIds.length > 0) {
              q = q.in('order_number', cachedOrderIds);
            }
          }

          const { data: sbOrders } = await q;
          if (Array.isArray(sbOrders) && sbOrders.length > 0) {
            sbOrders.forEach(o => {
              const id = o.order_number || o.id;
              if (id) {
                orderMap.set(id, {
                  orderId: id,
                  id: id,
                  date: o.created_at ? new Date(o.created_at).toLocaleDateString('en-GB') : 'Recent',
                  status: o.order_status || o.status || 'Confirmed',
                  total: o.total || 0,
                  items: (o.order_items || []).map(it => ({
                    name: it.product_name || 'Sacred Item',
                    image: it.product_image || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=200&q=80',
                    material: 'Devotional Grade',
                    qty: it.quantity || 1,
                    price: it.price || 0
                  }))
                });
              }
            });
          }
        }
      } catch (_) {}

      const allOrders = Array.from(orderMap.values());

      if (allOrders.length === 0) {
        container.innerHTML = `
          <div class="col-12 py-5 text-center bg-white border rounded shadow-sm">
            <i class="bi bi-box-seam fs-1 text-gold d-block mb-3"></i>
            <h4 class="fw-bold text-navy mb-2">No Orders Placed Yet</h4>
            <p class="text-secondary small mb-4">You haven't placed any devotional orders yet. Explore our sacred store to find blessed items!</p>
            <a href="/shop.html" class="btn hn-btn-gold px-4 py-2">
              <i class="bi bi-bag-plus me-1"></i> Browse Devotional Store
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = allOrders.map(order => {
        const statusHtml = (typeof getHarinamaOrderStatusBadge === 'function')
          ? getHarinamaOrderStatusBadge(order.status || order.order_status || 'Confirmed')
          : `<span class="hn-status-badge hn-status-confirmed">${order.status || 'Confirmed'}</span>`;
        const firstItem = (order.items && order.items.length > 0) ? order.items[0] : {
          name: 'Harinama Devotional Keychain',
          image: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=200&q=80',
          material: 'Standard',
          qty: 1
        };
        const totalItemsCount = order.items ? order.items.reduce((acc, i) => acc + (i.qty || 1), 0) : 1;
        const rawImg = firstItem.image || '';
        const itemImg = window.getProductImageUrl ? window.getProductImageUrl(rawImg) : (rawImg || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=200&q=80');

        return `
          <div class="card border rounded shadow-sm bg-white mb-4 overflow-hidden">
            <div class="card-header bg-light p-3 d-flex flex-wrap align-items-center justify-content-between gap-2 border-bottom">
              <div>
                <span class="small text-muted">Order Placed:</span> <span class="small fw-semibold">${order.date || 'Recent'}</span> &nbsp;|&nbsp;
                <span class="small text-muted">Order ID:</span> <span class="small fw-bold text-navy">#${order.orderId || order.id}</span>
              </div>
              <div>
                ${statusHtml}
              </div>
            </div>

            <div class="card-body p-3 p-md-4">
              <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div class="d-flex align-items-center gap-3">
                  <img src="${itemImg}" data-original-src="${rawImg}" alt="${firstItem.name}" class="rounded border" style="width: 60px; height: 60px; object-fit: cover;" onerror="if(window.handleProductImageError){handleProductImageError(this, '${rawImg}');}else{this.onerror=null;this.src='/assets/images/krishna-logo.jpg';}">
                  <div>
                    <h6 class="fw-bold mb-1 text-navy">${firstItem.name} ${order.items && order.items.length > 1 ? `(+${order.items.length - 1} more items)` : ''}</h6>
                    <div class="text-muted small">Total Qty: ${totalItemsCount} &nbsp;|&nbsp; Material: ${firstItem.material || 'Devotional Grade'}</div>
                    <div class="fw-bold text-navy mt-1">₹${order.total}</div>
                  </div>
                </div>

                <div class="d-flex gap-2">
                  <a href="/order-tracking.html?order=${order.orderId || order.id || order.order_number}" class="btn btn-outline-dark btn-sm">Track Order</a>
                  <button class="btn hn-btn-gold btn-sm" onclick="downloadOrderInvoice('${order.orderId || order.id || order.order_number}')">
                    <i class="bi bi-file-earmark-arrow-down me-1"></i> Download Invoice
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();
      renderOrdersList();
    });
  </script>
</body>
</html>
