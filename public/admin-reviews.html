<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Reviews - Sample Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .admin-layout { min-height: 100vh; background: var(--cres-body-bg); }
    .admin-sidebar { width: 260px; background: #FFFFFF; border-right: 1px solid var(--cres-border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 24px 16px; }
    .admin-main { flex: 1; padding: 30px 40px; }
    @media (max-width: 991.98px) {
      .admin-sidebar { position: fixed; left: -280px; z-index: 1050; transition: left 0.3s ease; }
      .admin-sidebar.show { left: 0; }
      .admin-main { padding: 20px 15px; }
    }
  </style>
</head>
<body>

  <!-- Reusable CRESCENDO Header -->
  <div id="cres-header-placeholder"></div>

  <div class="d-flex admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
      <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <span class="cres-brand-dot"></span>
        <h5 class="fw-bold mb-0 text-dark">Admin Portal</h5>
      </div>

      <nav class="nav flex-column gap-1 flex-grow-1">
        <a href="/admin.html" class="cres-dash-nav-item">
          <i class="bi bi-grid-fill"></i> Dashboard
        </a>
        <a href="/admin-products.html" class="cres-dash-nav-item">
          <i class="bi bi-box-seam"></i> Products
        </a>
        <a href="/admin-categories.html" class="cres-dash-nav-item">
          <i class="bi bi-tags"></i> Categories
        </a>
        <a href="/admin-orders.html" class="cres-dash-nav-item">
          <i class="bi bi-receipt"></i> Orders
        </a>
        <a href="/admin-customers.html" class="cres-dash-nav-item">
          <i class="bi bi-people"></i> Customers
        </a>
        <a href="/admin-coupons.html" class="cres-dash-nav-item">
          <i class="bi bi-ticket-perforated"></i> Coupons
        </a>
        <a href="/admin-reviews.html" class="cres-dash-nav-item active">
          <i class="bi bi-star"></i> Reviews
        </a>
        <a href="/admin-analytics.html" class="cres-dash-nav-item">
          <i class="bi bi-graph-up-arrow"></i> Analytics
        </a>
        <a href="/admin-settings.html" class="cres-dash-nav-item">
          <i class="bi bi-gear"></i> Settings
        </a>
      </nav>

      <div class="pt-3 border-top">
        <a href="/login.html" class="cres-dash-nav-item text-danger">
          <i class="bi bi-box-arrow-right"></i> Logout
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
          <h2 class="cres-page-title mb-1">Customer Reviews & Ratings</h2>
          <p class="text-muted small mb-0">Moderate, approve, and respond to verified product feedback</p>
        </div>
      </div>

      <!-- Reviews Table Card -->
      <div class="cres-card p-4">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="text-muted small text-uppercase">
              <tr>
                <th>Product & Customer</th>
                <th>Rating</th>
                <th>Feedback & Headline</th>
                <th>Date</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="reviews-tbody">
              <!-- Injected dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Reusable CRESCENDO Footer -->
  <div id="cres-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let reviewsList = [];

    const defaultReviews = [
      { id: 'rev-1', product: 'Pro X168A Headphones', customer: 'Alex Turner', rating: 5, title: 'Mindblowing sound stage', comment: 'The sound stage and deep sub-bass on this device are mindblowing. Best audio purchase I have made!', date: '2 days ago', status: 'Published' },
      { id: 'rev-2', product: 'Pro X168A Headphones', customer: 'Sophia Bennett', rating: 5, title: 'Super comfortable ANC', comment: 'Crystal clear vocals and exceptional active noise cancellation. Ultra comfortable for all-day listening.', date: '1 week ago', status: 'Published' },
      { id: 'rev-3', product: 'Earbud Y168A', customer: 'David Miller', rating: 4, title: 'Great battery life', comment: 'Battery lasts the entire workday with ANC turned on without any issues.', date: '3 days ago', status: 'Published' },
      { id: 'rev-4', product: 'Speaker P168A', customer: 'Emma Watson', rating: 5, title: 'Crisp bass!', comment: 'Room-filling audio quality in a very compact form factor.', date: 'Just now', status: 'Pending' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('');
      renderFooter();
      loadReviews();
    });

    function loadReviews() {
      const stored = localStorage.getItem('cres_admin_reviews');
      reviewsList = stored ? JSON.parse(stored) : defaultReviews;
      renderReviewsTable();
    }

    function renderReviewsTable() {
      const tbody = document.getElementById('reviews-tbody');
      tbody.innerHTML = reviewsList.map((r, idx) => `
        <tr>
          <td>
            <div class="fw-bold text-dark">${r.product}</div>
            <div class="text-muted small">by ${r.customer}</div>
          </td>
          <td>
            <div class="text-warning small">${'<i class="bi bi-star-fill"></i>'.repeat(r.rating)}</div>
          </td>
          <td style="max-width: 320px;">
            <div class="fw-semibold text-dark small">${r.title}</div>
            <div class="text-muted small text-truncate">${r.comment}</div>
          </td>
          <td class="text-muted small">${r.date}</td>
          <td>
            <span class="badge ${r.status === 'Published' ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'} rounded-pill px-3 py-2">${r.status}</span>
          </td>
          <td class="text-end">
            ${r.status === 'Pending' ? `
              <button class="btn btn-sm btn-outline-success rounded-pill me-1" onclick="toggleReviewStatus(${idx}, 'Published')"><i class="bi bi-check-lg me-1"></i> Approve</button>
            ` : `
              <button class="btn btn-sm btn-outline-secondary rounded-pill me-1" onclick="toggleReviewStatus(${idx}, 'Pending')"><i class="bi bi-pause me-1"></i> Hold</button>
            `}
            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteReview(${idx})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function toggleReviewStatus(idx, status) {
      reviewsList[idx].status = status;
      localStorage.setItem('cres_admin_reviews', JSON.stringify(reviewsList));
      renderReviewsTable();
      showToast(`Review status changed to ${status}.`, 'info');
    }

    function deleteReview(idx) {
      if (!confirm('Are you sure you want to delete this review?')) return;
      reviewsList.splice(idx, 1);
      localStorage.setItem('cres_admin_reviews', JSON.stringify(reviewsList));
      renderReviewsTable();
      showToast('Review deleted.', 'info');
    }
  </script>
</body>
</html>
