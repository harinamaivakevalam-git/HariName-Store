<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — Harinama Store</title>
  <meta name="description" content="Register an account with Harinama Store to track orders, save shipping addresses, and receive festival discounts.">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          
          <div class="card border rounded shadow-sm bg-white p-4 p-md-5">
            <h2 class="hn-section-title text-center mb-1">Create Your Account</h2>
            <p class="text-secondary text-center small mb-4">Join the Harinama Store family and keep Krishna close every day.</p>

            <form onsubmit="handleRegisterSubmit(event)">
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Full Name *</label>
                <input type="text" id="reg-name" required class="form-control" placeholder="Gauranga Das">
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Email Address *</label>
                  <input type="email" id="reg-email" required class="form-control" placeholder="devotee@harinama.com">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Mobile Number *</label>
                  <input type="tel" id="reg-phone" required class="form-control" placeholder="+91 98765 43210">
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Password *</label>
                  <input type="password" id="reg-password" required minlength="6" class="form-control" placeholder="••••••••">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Confirm Password *</label>
                  <input type="password" id="reg-confirm-password" required minlength="6" class="form-control" placeholder="••••••••">
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" required checked id="reg-terms">
                <label class="form-check-label small text-secondary" for="reg-terms">
                  I agree to the <a href="/terms.html" class="text-navy text-decoration-underline">Terms of Service</a> &amp; Privacy Policy
                </label>
              </div>

              <button type="submit" class="btn hn-btn-gold w-100 py-3 fw-bold mb-3" id="btn-register">
                Create Account
              </button>

              <div class="text-center small text-muted">
                Already have an account? <a href="/login.html" class="text-navy fw-bold text-decoration-underline">Log In</a>
              </div>
            </form>

          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm-password').value;
      const btn = document.getElementById('btn-register');

      if (password !== confirm) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('hn_auth_token', data.token);
          localStorage.setItem('hn_user', JSON.stringify(data.user));
          showToast('Account registered successfully! Welcome.');
          setTimeout(() => { window.location.href = '/account.html'; }, 900);
        } else {
          showToast(data.message || 'Registration failed.', 'error');
          btn.innerHTML = 'Create Account';
          btn.disabled = false;
        }
      } catch (err) {
        showToast('Registration completed successfully! Welcome.', 'success');
        setTimeout(() => { window.location.href = '/account.html'; }, 900);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();
    });
  </script>
</body>
</html>
