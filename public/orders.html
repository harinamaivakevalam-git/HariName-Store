<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Sample Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Reusable CRESCENDO Header -->
  <div id="cres-header-placeholder"></div>

  <!-- Main Container -->
  <main class="container py-4">
    <div class="mb-4">
      <h2 class="cres-page-title mb-1">My Orders</h2>
      <p class="text-muted">Track and manage your orders</p>
    </div>

    <!-- Filter Tabs -->
    <div class="cres-filter-tabs mb-4">
      <ul class="nav nav-pills gap-2" id="ordersTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active rounded-pill px-4 py-2 fw-semibold" id="tab-all" onclick="filterOrders('all', this)">All Orders</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill px-4 py-2 fw-semibold" id="tab-processing" onclick="filterOrders('processing', this)">Processing</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill px-4 py-2 fw-semibold" id="tab-shipped" onclick="filterOrders('shipped', this)">Shipped</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill px-4 py-2 fw-semibold" id="tab-delivered" onclick="filterOrders('delivered', this)">Delivered</button>
        </li>
        <li class="nav-item">
          <button class="nav-link rounded-pill px-4 py-2 fw-semibold" id="tab-cancelled" onclick="filterOrders('cancelled', this)">Cancelled</button>
        </li>
      </ul>
    </div>

    <!-- Orders Table Card -->
    <div class="cres-card p-4">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="text-muted small text-uppercase fw-bold border-bottom">
            <tr>
              <th scope="col" class="py-3">Order ID</th>
              <th scope="col" class="py-3">Date</th>
              <th scope="col" class="py-3">Total</th>
              <th scope="col" class="py-3">Status</th>
              <th scope="col" class="py-3 text-end">Action</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <!-- Rendered by JavaScript -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Order Details Modal -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom p-4">
          <h5 class="modal-title fw-bold" id="orderDetailsModalLabel">Order Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="order-modal-content">
          <!-- Populated by JS -->
        </div>
        <div class="modal-footer border-0 p-4 pt-0">
          <button type="button" class="btn btn-light rounded-pill px-4 fw-semibold" data-bs-dismiss="modal">Close</button>
          <a href="/products.html" class="btn btn-cres-primary rounded-pill px-4 fw-semibold">Shop Again</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable CRESCENDO Footer -->
  <div id="cres-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let activeFilter = 'all';

    function getOrdersList() {
      const stored = localStorage.getItem('cres_orders');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        } catch (e) {}
      }
      return window.CRESCENDO_DATA.orders;
    }

    function renderOrders(filter = 'all') {
      activeFilter = filter;
      const tbody = document.getElementById('orders-table-body');
      if (!tbody) return;

      const allOrders = getOrdersList();
      const orders = allOrders.filter(o => filter === 'all' || o.status === filter);

      if (orders.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="text-center py-5 text-muted">
              <i class="bi bi-box-seam display-4 d-block mb-2 text-secondary opacity-50"></i>
              No orders found in this category.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = orders.map(ord => {
        let badgeClass = 'bg-success-subtle text-success border border-success-subtle';
        let statusName = 'Delivered';
        if (ord.status === 'processing') {
          badgeClass = 'bg-warning-subtle text-warning-emphasis border border-warning-subtle';
          statusName = 'Processing';
        } else if (ord.status === 'shipped') {
          badgeClass = 'bg-info-subtle text-info-emphasis border border-info-subtle';
          statusName = 'Shipped';
        } else if (ord.status === 'cancelled') {
          badgeClass = 'bg-danger-subtle text-danger border border-danger-subtle';
          statusName = 'Cancelled';
        }

        return `
          <tr>
            <td class="fw-bold text-dark font-monospace">${ord.order_number}</td>
            <td class="text-muted">${ord.date}</td>
            <td class="fw-bold text-dark">$${Number(ord.total).toFixed(2)}</td>
            <td>
              <span class="badge ${badgeClass} rounded-pill px-3 py-1 fw-semibold small">${statusName}</span>
            </td>
            <td class="text-end">
              <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1 fw-semibold" onclick="showOrderDetails('${ord.id}')">
                  View
                </button>
                <button class="btn btn-sm btn-light rounded-pill px-3 py-1 fw-semibold" onclick="trackOrderPopup('${ord.order_number}')">
                  <i class="bi bi-truck me-1"></i> Track
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterOrders(status, btn) {
      document.querySelectorAll('#ordersTab .nav-link').forEach(l => l.classList.remove('active'));
      btn.classList.add('active');
      renderOrders(status);
    }

    function showOrderDetails(orderId) {
      const allOrders = getOrdersList();
      const ord = allOrders.find(o => o.id === orderId);
      if (!ord) return;

      const content = document.getElementById('order-modal-content');
      const canCancel = ord.status === 'processing';

      content.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <div class="fw-bold fs-5">${ord.order_number}</div>
            <div class="text-muted small">Placed on ${ord.date}</div>
          </div>
          <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-1 fw-semibold text-capitalize">${ord.status}</span>
        </div>
        <hr class="text-muted opacity-25">
        <div class="d-flex align-items-center gap-3 mb-3 p-3 bg-light rounded-3">
          <img src="${ord.product_image}" style="width: 50px; height: 50px; object-fit: contain;">
          <div class="flex-grow-1">
            <div class="fw-bold">${ord.product_name}</div>
            <div class="text-muted small">Color: ${ord.color} | Qty: ${ord.quantity}</div>
          </div>
          <div class="fw-bold">$${Number(ord.total).toFixed(2)}</div>
        </div>
        <div class="small mb-3">
          <div class="d-flex justify-content-between py-1 text-muted"><span>Customer:</span> <strong class="text-dark">${ord.customer_name}</strong></div>
          <div class="d-flex justify-content-between py-1 text-muted"><span>Email:</span> <strong class="text-dark">${ord.customer_email}</strong></div>
          <div class="d-flex justify-content-between py-1 text-muted"><span>Payment Method:</span> <strong class="text-dark">Encrypted Secure Checkout</strong></div>
          <div class="d-flex justify-content-between py-1 text-muted"><span>Shipping:</span> <strong class="text-success">Free Express Logistics</strong></div>
        </div>

        ${canCancel ? `
          <div class="pt-2 border-top text-end">
            <button class="btn btn-sm btn-outline-danger rounded-pill px-3" onclick="cancelCustomerOrder('${ord.id}')">
              <i class="bi bi-x-circle me-1"></i> Cancel Order
            </button>
          </div>
        ` : ''}
      `;

      const modal = new bootstrap.Modal(document.getElementById('orderDetailsModal'));
      modal.show();
    }

    function cancelCustomerOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      let allOrders = getOrdersList();
      const target = allOrders.find(o => o.id === orderId);
      if (target) {
        target.status = 'cancelled';
        localStorage.setItem('cres_orders', JSON.stringify(allOrders));
        window.CRESCENDO_DATA.orders = allOrders;
        bootstrap.Modal.getInstance(document.getElementById('orderDetailsModal'))?.hide();
        showToast('Order ' + target.order_number + ' has been cancelled.', 'info');
        renderOrders(activeFilter);
      }
    }

    function trackOrderPopup(orderNumber) {
      showToast(`Tracking status for ${orderNumber}: Package In-Transit with Express Logistics 🚚`, 'info');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderOrders('all');
    });
  </script>
</body>
</html>
