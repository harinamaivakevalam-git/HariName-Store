<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Devotional Products — Harinama Store</title>
  <meta name="description" content="Shop authentic handcrafted devotional products from Harinama Store: Sacred Books, Japa Malas, Devotional Keychains, and Gift Sets.">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=5">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-4">
    <div class="container">
      
      <!-- Page Header -->
      <div class="text-center my-4">
        <h1 class="hn-section-title">Shop Devotional Products</h1>
        <div class="hn-section-subtitle">Sacred books, chanting malas, spiritual keychains, and holy reminders.</div>
      </div>

      <div class="row g-4 mt-2">
        
        <!-- Left Sidebar Filters -->
        <div class="col-lg-3">
          <div class="hn-shop-sidebar">
            
            <!-- Collections Filter -->
            <div class="mb-4">
              <div class="hn-filter-title">Collections & Categories</div>
              <a href="#" class="hn-filter-link active" onclick="filterByCollection('all', this); return false;">All Products</a>
              <a href="#" class="hn-filter-link" onclick="filterByCollection('devotional-keychains', this); return false;">Devotional Keychains</a>
              <a href="#" class="hn-filter-link" onclick="filterByCollection('sacred-books', this); return false;">Sacred Books & Shastras</a>
              <a href="#" class="hn-filter-link" onclick="filterByCollection('japa-chanting', this); return false;">Japa & Chanting</a>
              <a href="#" class="hn-filter-link" onclick="filterByCollection('gift-sets', this); return false;">Gift Sets & Bundles</a>
            </div>

            <!-- Price Filter -->
            <div class="mb-4">
              <div class="hn-filter-title">Price Range</div>
              <label class="hn-checkbox-label">
                <input type="checkbox" onchange="applyFilters()" value="under-150" class="filter-price">
                <span>Under ₹150</span>
              </label>
              <label class="hn-checkbox-label">
                <input type="checkbox" onchange="applyFilters()" value="150-300" class="filter-price">
                <span>₹150 – ₹300</span>
              </label>
              <label class="hn-checkbox-label">
                <input type="checkbox" onchange="applyFilters()" value="300-600" class="filter-price">
                <span>₹300 – ₹600</span>
              </label>
            </div>

            <!-- Material Filter -->
            <div class="mb-4">
              <div class="hn-filter-title">Material / Type</div>
              <label class="hn-checkbox-label">
                <input type="checkbox" onchange="applyFilters()" value="Acrylic" class="filter-material">
                <span>Acrylic / Resin</span>
              </label>
              <label class="hn-checkbox-label">
                <input type="checkbox" onchange="applyFilters()" value="Metal" class="filter-material">
                <span>Solid Brass / Metal</span>
              </label>
              <label class="hn-checkbox-label">
                <input type="checkbox" onchange="applyFilters()" value="Wood" class="filter-material">
                <span>Neem & Tulasi Wood</span>
              </label>
              <label class="hn-checkbox-label">
                <input type="checkbox" onchange="applyFilters()" value="Hardbound Book" class="filter-material">
                <span>Books & Shastras</span>
              </label>
            </div>

            <!-- Sort By -->
            <div>
              <div class="hn-filter-title">Sort by</div>
              <select class="form-select form-select-sm" id="hn-sort-select" onchange="applyFilters()">
                <option value="featured">Featured First</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating">Best Rating</option>
              </select>
            </div>

          </div>
        </div>

        <!-- Right Product Grid -->
        <div class="col-lg-9">
          <div class="row g-3" id="hn-shop-grid">
            <!-- Dynamically populated from HARINAMA_DATA -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let activeCollection = 'all';

    function renderShopProducts(items) {
      const grid = document.getElementById('hn-shop-grid');
      if (!grid) return;
      if (!items || items.length === 0) {
        grid.innerHTML = '<div class="col-12 py-5 text-center text-muted"><i class="bi bi-box-seam fs-1 d-block mb-2 text-gold"></i>No products found matching your selected filters.</div>';
        return;
      }
      grid.innerHTML = items.map(p => {
        return `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="hn-product-card" data-product-id="${p.id}">
              
              <button class="hn-card-wishlist" onclick="toggleWishlist('${p.id}', this)" title="Wishlist">
                <i class="bi bi-heart"></i>
              </button>

              <a href="/product-details.html?id=${p.id}" class="hn-card-img-box">
                <img src="${p.image}" alt="${p.name}" loading="lazy">
              </a>

              <div class="hn-card-title">
                <a href="/product-details.html?id=${p.id}">${p.name}</a>
              </div>

              <div class="hn-card-price">
                ${formatPrice(p.price)}
              </div>

              ${renderRatingStars(p.rating, p.reviews_count)}

              <button class="hn-btn-card-add" onclick="handleAddToCart('${p.id}')">
                Add to Cart
              </button>

            </div>
          </div>
        `;
      }).join('');
    }

    function filterByCollection(col, el) {
      activeCollection = col;
      document.querySelectorAll('.hn-filter-link').forEach(a => a.classList.remove('active'));
      if (el) el.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      let filtered = [...HARINAMA_DATA.products];

      // Collection filter
      if (activeCollection !== 'all') {
        filtered = filtered.filter(p => p.category_slug === activeCollection);
      }

      // Price filters
      const checkedPrices = Array.from(document.querySelectorAll('.filter-price:checked')).map(cb => cb.value);
      if (checkedPrices.length > 0) {
        filtered = filtered.filter(p => {
          return checkedPrices.some(range => {
            if (range === 'under-150') return p.price < 150;
            if (range === '150-300') return p.price >= 150 && p.price <= 300;
            if (range === '300-600') return p.price > 300 && p.price <= 600;
            return false;
          });
        });
      }

      // Material filters
      const checkedMaterials = Array.from(document.querySelectorAll('.filter-material:checked')).map(cb => cb.value);
      if (checkedMaterials.length > 0) {
        filtered = filtered.filter(p => {
          if (!p.material) return false;
          return checkedMaterials.some(m => p.material.toLowerCase().includes(m.toLowerCase()));
        });
      }

      // Sort
      const sortVal = document.getElementById('hn-sort-select').value;
      if (sortVal === 'price-low') filtered.sort((a, b) => a.price - b.price);
      else if (sortVal === 'price-high') filtered.sort((a, b) => b.price - a.price);
      else if (sortVal === 'rating') filtered.sort((a, b) => b.rating - a.rating);

      renderShopProducts(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('shop');
      renderFooter();

      // Check URL parameters for category
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('category');
      if (catParam) {
        activeCollection = catParam;
        document.querySelectorAll('.hn-filter-link').forEach(a => {
          if (a.getAttribute('onclick') && a.getAttribute('onclick').includes(catParam)) {
            a.classList.add('active');
          } else {
            a.classList.remove('active');
          }
        });
      }

      applyFilters();
    });
  </script>
</body>
</html>
