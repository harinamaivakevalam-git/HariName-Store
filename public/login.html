<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Harinama Store</title>
  <meta name="description" content="Login to your Harinama Store account to view orders, track shipments, and manage your wishlist.">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          
          <div class="card border rounded shadow-sm overflow-hidden bg-white">
            <div class="row g-0">
              
              <!-- Left Visual Panel -->
              <div class="col-md-5 p-4 p-md-5 text-center d-flex flex-column justify-content-between" style="background-color: var(--hn-cream); border-right: 1px solid var(--hn-border);">
                <div>
                  <h3 class="hn-section-title text-center mb-2" style="font-size: 1.6rem;">Welcome Back</h3>
                  <p class="text-secondary small">Login to access your orders and spiritual reminders.</p>
                </div>

                <div class="my-4">
                  <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=400&q=80" alt="Harinama Store Keychains" class="img-fluid rounded border shadow-sm" style="max-height: 200px; object-fit: cover;">
                </div>

                <div>
                  <div class="hn-hero-quote text-center" style="font-size: 1rem; margin-top: 0;">
                    “In every step, remember Krishna.”
                  </div>
                </div>
              </div>

              <!-- Right Form Panel -->
              <div class="col-md-7 p-4 p-md-5">
                <h4 class="fw-bold mb-4" style="font-family: var(--hn-font-serif); color: var(--hn-navy);">Account Login</h4>

                <form onsubmit="handleLoginSubmit(event)">
                  <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Email Address</label>
                    <input type="email" id="login-email" required class="form-control" placeholder="user@harinama.com" value="user@harinama.com">
                  </div>

                  <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Password</label>
                    <input type="password" id="login-password" required class="form-control" placeholder="••••••••" value="user123">
                  </div>

                  <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                      <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
                    </div>
                    <a href="/forgot-password.html" class="text-navy fw-semibold">Forgot Password?</a>
                  </div>

                  <button type="submit" class="btn hn-btn-gold w-100 py-3 fw-bold mb-3" id="btn-login">
                    Login
                  </button>

                  <div class="text-center small text-muted">
                    Don't have an account? <a href="/register.html" class="text-navy fw-bold text-decoration-underline">Create Account</a>
                  </div>
                </form>
              </div>

            </div>
          </div>

          <!-- Fast Demo Quick-Login Helper -->
          <div class="mt-4 p-3 bg-white border rounded text-center small text-secondary">
            <span class="fw-bold text-navy">Demo Credentials:</span>
            Customer: <code class="bg-light px-2 py-1 text-dark">user@harinama.com / user123</code> &nbsp;|&nbsp;
            Admin: <code class="bg-light px-2 py-1 text-dark">admin@harinama.com / admin123</code>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('hn_auth_token', data.token);
          localStorage.setItem('hn_user', JSON.stringify(data.user));
          showToast('Login successful! Redirecting...');
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/account.html';
            }
          }, 800);
        } else {
          showToast(data.message || 'Login failed. Please check credentials.', 'error');
          btn.innerHTML = 'Login';
          btn.disabled = false;
        }
      } catch (err) {
        showToast('Login simulated for demo user.', 'success');
        setTimeout(() => { window.location.href = '/account.html'; }, 800);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('account');
      renderFooter();
    });
  </script>
</body>
</html>
