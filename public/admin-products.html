<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Products - Hari Nama Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .admin-layout {
      min-height: 100vh;
      background: var(--cres-body-bg);
    }
    .admin-sidebar {
      width: 260px;
      background: #FFFFFF;
      border-right: 1px solid var(--cres-border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
    }
    .admin-main {
      flex: 1;
      padding: 30px 40px;
    }
    @media (max-width: 991.98px) {
      .admin-sidebar {
        position: fixed;
        left: -280px;
        z-index: 1050;
        transition: left 0.3s ease;
      }
      .admin-sidebar.show {
        left: 0;
      }
      .admin-main {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Reusable CRESCENDO Header -->
  <div id="cres-header-placeholder"></div>

  <div class="d-flex admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
      <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <span class="cres-brand-dot"></span>
        <h5 class="fw-bold mb-0 text-dark">Admin Portal</h5>
      </div>

      <nav class="nav flex-column gap-1 flex-grow-1">
        <a href="/admin.html" class="cres-dash-nav-item">
          <i class="bi bi-grid-fill"></i> Dashboard
        </a>
        <a href="/admin-products.html" class="cres-dash-nav-item active">
          <i class="bi bi-box-seam"></i> Products
        </a>
        <a href="#" class="cres-dash-nav-item">
          <i class="bi bi-tags"></i> Categories
        </a>
        <a href="/admin-orders.html" class="cres-dash-nav-item">
          <i class="bi bi-receipt"></i> Orders
        </a>
        <a href="#" class="cres-dash-nav-item">
          <i class="bi bi-people"></i> Customers
        </a>
        <a href="#" class="cres-dash-nav-item">
          <i class="bi bi-ticket-perforated"></i> Coupons
        </a>
        <a href="#" class="cres-dash-nav-item">
          <i class="bi bi-star"></i> Reviews
        </a>
        <a href="#" class="cres-dash-nav-item">
          <i class="bi bi-graph-up-arrow"></i> Analytics
        </a>
        <a href="#" class="cres-dash-nav-item">
          <i class="bi bi-gear"></i> Settings
        </a>
      </nav>

      <div class="pt-3 border-top">
        <a href="/login.html" class="cres-dash-nav-item text-danger">
          <i class="bi bi-box-arrow-right"></i> Logout
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
        <div>
          <h2 class="cres-page-title mb-1">Products</h2>
          <p class="text-muted small mb-0">Manage your catalog, prices, and stock inventory</p>
        </div>
        <button class="btn btn-cres-primary rounded-pill px-4 fw-semibold" onclick="openAddProductModal()">
          <i class="bi bi-plus-lg me-1"></i> Add Product
        </button>
      </div>

      <!-- Filters & Search Card -->
      <div class="cres-card p-4 mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-md-5">
            <div class="input-group">
              <span class="input-group-text bg-light border-0 ps-3 text-muted"><i class="bi bi-search"></i></span>
              <input type="text" id="adminProductSearch" class="form-control bg-light border-0 py-2" placeholder="Search products..." oninput="filterAdminProducts()">
            </div>
          </div>
          <div class="col-md-3">
            <select class="form-select bg-light border-0 py-2" id="adminCategoryFilter" onchange="filterAdminProducts()">
              <option value="">All Categories</option>
              <option value="Headphones">Headphones</option>
              <option value="Earbuds">Earbuds</option>
              <option value="Speakers">Speakers</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-select bg-light border-0 py-2" id="adminStatusFilter" onchange="filterAdminProducts()">
              <option value="">All Status</option>
              <option value="instock">In Stock</option>
              <option value="outofstock">Out of Stock</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Products Table Card -->
      <div class="cres-card p-4">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="text-muted small text-uppercase fw-bold border-bottom">
              <tr>
                <th scope="col" class="py-3">Product</th>
                <th scope="col" class="py-3">Category</th>
                <th scope="col" class="py-3">Price</th>
                <th scope="col" class="py-3">Stock</th>
                <th scope="col" class="py-3 text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="adminProductsTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add / Edit Product Modal -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom p-4">
          <h5 class="modal-title fw-bold" id="productModalLabel">Add New Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="productForm" onsubmit="handleSaveProduct(event)">
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label small fw-semibold">Product Name</label>
                <input type="text" class="form-control rounded-pill px-3 py-2" id="pName" placeholder="e.g. Master ANC Headphone 2.0" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Category</label>
                <select class="form-select rounded-pill px-3 py-2" id="pCategory" required>
                  <option value="Headphones">Headphones</option>
                  <option value="Earbuds">Earbuds</option>
                  <option value="Speakers">Speakers</option>
                  <option value="Accessories">Accessories</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Price ($ USD)</label>
                <input type="number" step="0.01" class="form-control rounded-pill px-3 py-2" id="pPrice" placeholder="249.99" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Stock Quantity</label>
                <input type="number" class="form-control rounded-pill px-3 py-2" id="pStock" placeholder="50" required>
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Image URL</label>
                <input type="url" class="form-control rounded-pill px-3 py-2" id="pImage" placeholder="https://images.unsplash.com/..." required>
              </div>
              <div class="col-12">
                <label class="form-label small fw-semibold">Description</label>
                <textarea class="form-control rounded-4 p-3" id="pDesc" rows="3" placeholder="Detailed product description..."></textarea>
              </div>
            </div>
            <div class="modal-footer border-0 p-0 pt-4 mt-4">
              <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-cres-primary rounded-pill px-4">Save Product</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable CRESCENDO Footer -->
  <div id="cres-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let pModal = null;

    function renderAdminProductsTable(productsToRender) {
      const tbody = document.getElementById('adminProductsTableBody');
      if (!tbody) return;

      const prods = productsToRender || window.CRESCENDO_DATA.products;

      tbody.innerHTML = prods.map(p => {
        const inStock = p.stock > 0;
        const stockBadge = inStock 
          ? `<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-2 py-1 small">In Stock (${p.stock})</span>`
          : `<span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill px-2 py-1 small">Out of Stock</span>`;

        return `
          <tr>
            <td>
              <div class="d-flex align-items-center gap-3">
                <div class="cres-cart-img-box" style="width: 48px; height: 48px; border-radius: 10px; background: #f4f5f8; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                  <img src="${p.image}" alt="${p.name}" style="width: 80%; height: 80%; object-fit: contain;">
                </div>
                <div>
                  <div class="fw-bold text-dark">${p.name}</div>
                  <div class="text-muted small">${p.brand}</div>
                </div>
              </div>
            </td>
            <td><span class="text-secondary fw-semibold">${p.category}</span></td>
            <td class="fw-bold text-dark">$${p.price.toFixed(2)}</td>
            <td>${stockBadge}</td>
            <td class="text-end">
              <div class="btn-group">
                <a href="/product-details.html?id=${p.id}" target="_blank" class="btn btn-sm btn-light rounded-circle me-1" title="View"><i class="bi bi-eye"></i></a>
                <button class="btn btn-sm btn-light rounded-circle me-1" title="Edit" onclick="editProduct('${p.id}')"><i class="bi bi-pencil text-primary"></i></button>
                <button class="btn btn-sm btn-light rounded-circle" title="Delete" onclick="deleteProduct('${p.id}')"><i class="bi bi-trash text-danger"></i></button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterAdminProducts() {
      const q = document.getElementById('adminProductSearch').value.toLowerCase();
      const cat = document.getElementById('adminCategoryFilter').value;
      const status = document.getElementById('adminStatusFilter').value;

      const filtered = window.CRESCENDO_DATA.products.filter(p => {
        const matchesQuery = p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q);
        const matchesCat = !cat || p.category === cat;
        const matchesStatus = !status || (status === 'instock' ? p.stock > 0 : p.stock === 0);
        return matchesQuery && matchesCat && matchesStatus;
      });

      renderAdminProductsTable(filtered);
    }

    function openAddProductModal() {
      if (!pModal) pModal = new bootstrap.Modal(document.getElementById('productModal'));
      document.getElementById('productForm').reset();
      document.getElementById('productModalLabel').innerText = 'Add New Product';
      pModal.show();
    }

    function editProduct(id) {
      if (!pModal) pModal = new bootstrap.Modal(document.getElementById('productModal'));
      const p = window.CRESCENDO_DATA.products.find(item => item.id === id);
      if (!p) return;

      document.getElementById('productModalLabel').innerText = 'Edit Product';
      document.getElementById('pName').value = p.name;
      document.getElementById('pCategory').value = p.category;
      document.getElementById('pPrice').value = p.price;
      document.getElementById('pStock').value = p.stock;
      document.getElementById('pImage').value = p.image;
      document.getElementById('pDesc').value = p.description || '';
      pModal.show();
    }

    function deleteProduct(id) {
      if (confirm('Are you sure you want to delete this product?')) {
        window.cresShowToast('Product deleted.');
      }
    }

    function handleSaveProduct(e) {
      e.preventDefault();
      if (pModal) pModal.hide();
      window.cresShowToast('Product saved successfully!');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAdminProductsTable();
    });
  </script>
</body>
</html>
