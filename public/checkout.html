<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Harinama Store</title>
  <meta name="description" content="Secure multi-step checkout for Harinama Store.">
  
  <!-- Google Fonts: Poppins Master Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-5">
    <div class="container">
      
      <form id="hn-checkout-form" onsubmit="handlePlaceOrder(event)">
        <div class="row g-4 g-lg-5">
          
          <!-- Left Column: Shipping Information -->
          <div class="col-lg-7">
            <div class="bg-white border rounded p-4 shadow-sm">
              <h4 class="fw-bold mb-4" style="font-family: var(--hn-font-serif); color: var(--hn-navy);">Shipping Information</h4>
              
              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Full Name *</label>
                <input type="text" class="form-control" id="hn-ship-name" required placeholder="Gauranga Das">
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Mobile Number *</label>
                  <input type="tel" class="form-control" id="hn-ship-phone" required placeholder="+91 98765 43210">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-secondary">Email (optional)</label>
                  <input type="email" class="form-control" id="hn-ship-email" placeholder="devotee@harinama.com">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Address *</label>
                <input type="text" class="form-control" id="hn-ship-address" required placeholder="Flat 402, Radharani Kripa, Raman Reti">
              </div>

              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label small fw-bold text-secondary">City *</label>
                  <input type="text" class="form-control" id="hn-ship-city" required placeholder="Vrindavan">
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold text-secondary">State *</label>
                  <select class="form-select" id="hn-ship-state" required>
                    <option value="">(Select State)</option>
                    <option value="Uttar Pradesh" selected>Uttar Pradesh</option>
                    <option value="West Bengal">West Bengal</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Rajasthan">Rajasthan</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold text-secondary">PIN Code *</label>
                  <input type="text" class="form-control" id="hn-ship-pin" required placeholder="281121">
                </div>
              </div>

            </div>
          </div>

          <!-- Right Column: Payment Method (Exact Match to Reference) -->
          <div class="col-lg-5">
            <div class="bg-white border rounded p-4 shadow-sm">
              <h4 class="fw-bold mb-4" style="font-family: var(--hn-font-serif); color: var(--hn-navy);">Payment Method</h4>

              <!-- Payment Method Radios -->
              <div class="d-flex flex-column gap-3 mb-4">
                
                <label class="border rounded p-3 d-flex align-items-center justify-content-between cursor-pointer" style="cursor: pointer;">
                  <div class="d-flex align-items-center gap-2">
                    <input type="radio" name="payment_method" value="upi" checked class="form-check-input">
                    <span class="fw-semibold small">UPI (Google Pay, PhonePe, Paytm)</span>
                  </div>
                </label>

                <label class="border rounded p-3 d-flex align-items-center justify-content-between cursor-pointer" style="cursor: pointer;">
                  <div class="d-flex align-items-center gap-2">
                    <input type="radio" name="payment_method" value="card" class="form-check-input">
                    <span class="fw-semibold small">Credit / Debit Card</span>
                  </div>
                  <div class="d-flex gap-1">
                    <span class="badge bg-light text-dark border">VISA</span>
                    <span class="badge bg-light text-dark border">Mastercard</span>
                    <span class="badge bg-light text-dark border">RuPay</span>
                  </div>
                </label>

                <label class="border rounded p-3 d-flex align-items-center justify-content-between cursor-pointer" style="cursor: pointer;">
                  <div class="d-flex align-items-center gap-2">
                    <input type="radio" name="payment_method" value="netbanking" class="form-check-input">
                    <span class="fw-semibold small">Net Banking</span>
                  </div>
                </label>

                <label class="border rounded p-3 d-flex align-items-center justify-content-between cursor-pointer" style="cursor: pointer;">
                  <div class="d-flex align-items-center gap-2">
                    <input type="radio" name="payment_method" value="wallets" class="form-check-input">
                    <span class="fw-semibold small">Wallets</span>
                  </div>
                </label>

              </div>

              <!-- Terms Checkbox -->
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="hn-terms-check" required checked>
                <label class="form-check-label small text-secondary" for="hn-terms-check">
                  I agree to the <a href="/terms.html" class="text-decoration-underline text-navy">Terms &amp; Conditions</a>
                </label>
              </div>

              <!-- Place Order Button -->
              <button type="submit" class="btn hn-btn-gold w-100 py-3 mb-3 fw-bold" id="hn-btn-place-order">
                Place Order
              </button>

              <!-- Secure Note -->
              <div class="text-center small text-muted">
                <i class="bi bi-lock-fill text-warning me-1"></i> Your payment information is secure and encrypted.
              </div>

            </div>
          </div>

        </div>
      </form>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    function handlePlaceOrder(e) {
      e.preventDefault();
      const btn = document.getElementById('hn-btn-place-order');
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Processing Sacred Order...';
      btn.disabled = true;

      const orderNumber = 'HN-2026-' + Math.floor(10000 + Math.random() * 90000);
      const name = document.getElementById('hn-ship-name').value;
      const phone = document.getElementById('hn-ship-phone').value;

      setTimeout(() => {
        // Clear cart
        localStorage.removeItem('hn_cart');
        localStorage.removeItem('cres_cart');
        window.location.href = `/order-success.html?order=${orderNumber}&name=${encodeURIComponent(name)}`;
      }, 1200);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('checkout');
      renderFooter();
    });
  </script>
</body>
</html>
