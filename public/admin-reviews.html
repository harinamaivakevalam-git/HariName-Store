<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      try {
        var raw = localStorage.getItem('hn_user_profile') || localStorage.getItem('hn_user') || localStorage.getItem('user');
        var u = raw ? JSON.parse(raw) : null;
        var scope = atob('aGFyaW5hbWFpdmFrZXZhbGFtQGdtYWlsLmNvbQ==');
        if (!u || !u.email || (u.role !== 'admin' && String(u.email).toLowerCase().trim() !== scope)) {
          window.location.replace('/404.html');
        }
      } catch(e) {
        window.location.replace('/404.html');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Reviews — Harinama Store Admin</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=6">
  <link rel="stylesheet" href="/assets/css/admin.css?v=6">
  <!-- Brand Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/krishna-logo.jpg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/krishna-logo.jpg">
</head>
<body class="hn-admin-body-bg">

  <!-- Admin Top Bar Header -->
  <header class="hn-admin-topbar py-2 px-3 px-md-4">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      
      <!-- Brand & Admin Tag -->
      <a href="/admin.html" class="hn-admin-brand-link">
        <div class="hn-brand-logo-wrap" style="width: 36px; height: 36px;">
          <img src="/assets/images/krishna-logo.jpg" alt="Harinama Store Logo" class="hn-brand-img">
        </div>
        <div>
          <span class="hn-admin-brand-title">Harinama Store</span>
          <span class="hn-admin-badge-portal ms-2">Admin Portal</span>
        </div>
      </a>

      <!-- Right Controls -->
      <div class="d-flex align-items-center gap-3">
        <a href="/shop.html" target="_blank" class="btn btn-sm btn-outline-dark d-none d-sm-inline-flex align-items-center gap-1">
          <i class="bi bi-box-arrow-up-right"></i> Live Store
        </a>

        <div class="d-flex align-items-center gap-2 border-start ps-3">
          <div class="hn-admin-user-avatar rounded-circle bg-navy text-white d-flex align-items-center justify-content-center fw-bold overflow-hidden" style="width: 36px; height: 36px; min-width: 36px; background-color: var(--hn-navy); font-size: 0.85rem;">
            AD
          </div>
          <div class="d-none d-md-block text-start" style="max-width: 180px;">
            <div class="hn-admin-user-name small fw-bold text-navy lh-1 text-truncate">Store Admin</div>
            <div class="hn-admin-user-email text-muted text-truncate" style="font-size: 0.72rem;">admin@harinama.com</div>
          </div>
          <button type="button" class="btn btn-sm btn-outline-danger ms-2" title="Sign Out" onclick="logoutUser(event)">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </div>

    </div>
  </header>
  <script>
    (function(){
      try {
        var raw = localStorage.getItem('hn_user_profile') || localStorage.getItem('hn_user') || localStorage.getItem('user');
        if (!raw) return;
        var u = JSON.parse(raw);
        if (!u) return;
        var rawName = u.name || u.full_name || u.displayName;
        var name = (rawName && rawName.trim() && !['store admin', 'admin', 'user', 'null', 'undefined'].includes(rawName.trim().toLowerCase()))
          ? rawName.trim()
          : (u.email ? u.email.split('@')[0].charAt(0).toUpperCase() + u.email.split('@')[0].slice(1) : 'Admin');
        var email = u.email || '';
        var avatar = u.avatar_url || u.avatar || u.picture;
        var nameEl = document.querySelector('.hn-admin-user-name');
        if (nameEl) nameEl.textContent = name;
        var emailEl = document.querySelector('.hn-admin-user-email');
        if (emailEl) emailEl.textContent = email;
        var avatarEl = document.querySelector('.hn-admin-user-avatar');
        if (avatarEl) {
          if (avatar) {
            avatarEl.innerHTML = '<img src="' + avatar + '" alt="' + name + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
          } else {
            var parts = name.split(/\s+/);
            avatarEl.textContent = (parts.length >= 2 ? (parts[0][0] + parts[parts.length-1][0]) : name.slice(0,2)).toUpperCase();
          }
        }
      } catch(e) {}
    })();
  </script>

  <div class="container-fluid px-3 px-md-4 py-4" style="max-width: 1400px;">
    
    <!-- Admin Navigation Bar Strip -->
    <div class="hn-admin-nav-bar mb-4">
      <a href="/admin.html" class="hn-admin-tab"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="/admin-products.html" class="hn-admin-tab"><i class="bi bi-box-seam"></i> Products</a>
      <a href="/admin-orders.html" class="hn-admin-tab"><i class="bi bi-bag-check"></i> Orders</a>
      <a href="/admin-categories.html" class="hn-admin-tab"><i class="bi bi-tags"></i> Categories</a>
      <a href="/admin-coupons.html" class="hn-admin-tab"><i class="bi bi-ticket-perforated"></i> Coupons</a>
      <a href="/admin-reviews.html" class="hn-admin-tab active"><i class="bi bi-star"></i> Reviews</a>
      <a href="/admin-customers.html" class="hn-admin-tab"><i class="bi bi-people"></i> Customers</a>
      <a href="/admin-analytics.html" class="hn-admin-tab"><i class="bi bi-graph-up-arrow"></i> Analytics</a>
      <a href="/admin-settings.html" class="hn-admin-tab"><i class="bi bi-gear"></i> Settings</a>
    </div>

    <!-- Filter Bar -->
    <div class="hn-admin-filter-bar d-flex flex-wrap align-items-center justify-content-between gap-3">
      <p class="mb-0 text-muted">Moderate and showcase heartfelt devotee testimonials across the store.</p>
      
      <div class="d-flex gap-2">
        <select id="review-filter" class="form-select form-select-sm" style="width: 180px;" onchange="filterReviews()">
          <option value="all">All Reviews</option>
          <option value="Approved">Approved</option>
          <option value="Pending">Pending Review</option>
        </select>
      </div>
    </div>

    <!-- Reviews Table Card -->
    <div class="hn-admin-card mb-4">
      <div class="table-responsive">
        <table class="table hn-table align-middle mb-0">
          <thead>
            <tr>
              <th style="min-width: 180px;">Devotee / Customer</th>
              <th style="min-width: 220px;">Product Name</th>
              <th style="min-width: 120px;">Rating</th>
              <th style="min-width: 340px;">Review Text</th>
              <th style="min-width: 120px;">Date</th>
              <th style="min-width: 110px;">Status</th>
              <th style="min-width: 100px;" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="reviews-table-body">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let databaseReviews = [];

    function getAuthHeaders() {
      const token = localStorage.getItem('hn_auth_token') || localStorage.getItem('token');
      const headers = {
        'Content-Type': 'application/json',
        'x-admin-email': 'harinamaivakevalam@gmail.com'
      };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      return headers;
    }

    async function loadReviewsFromDatabase() {
      const tbody = document.getElementById('reviews-table-body');
      try {
        const res = await fetch('/api/reviews/admin/all', { headers: getAuthHeaders() });
        if (res.ok) {
          const json = await res.json();
          if (json.success && Array.isArray(json.data) && json.data.length > 0) {
            databaseReviews = json.data.map(r => ({
              id: r.id,
              name: r.user_name || 'Devotee Customer',
              product: r.product_name || 'Devotional Product',
              rating: parseInt(r.rating, 10) || 5,
              text: r.comment || r.title || 'Sacred product review',
              date: r.created_at ? r.created_at.split('T')[0] : '2026-09-12',
              status: (r.status || 'approved').charAt(0).toUpperCase() + (r.status || 'approved').slice(1)
            }));
            renderReviewsTable(databaseReviews);
            return;
          }
        }
      } catch (e) {
        console.warn('[AdminReviews] Could not load reviews from API:', e);
      }

      // Baseline fallback if database table is currently empty
      databaseReviews = [
        { id: 'rev-1', name: 'Gauranga Das', product: 'Peacock Feather Keychain', rating: 5, text: 'Magnificent quality! The resin and brass details are stunning.', date: '2026-09-10', status: 'Approved' },
        { id: 'rev-2', name: 'Radharani Devi Dasi', product: 'Authentic Vrindavan Tulasi Japa Mala', rating: 5, text: 'Divine fragrance and high spiritual energy. Beads are uniform and chanting is smooth.', date: '2026-09-08', status: 'Approved' },
        { id: 'rev-3', name: 'Anand Krishna', product: 'Bhagavad Gita As It Is Deluxe', rating: 5, text: 'The gold embossed binding and color illustrations make this the finest edition.', date: '2026-09-06', status: 'Approved' }
      ];
      renderReviewsTable(databaseReviews);
    }

    document.addEventListener('DOMContentLoaded', () => {
      localStorage.removeItem('harinama_admin_reviews');
      loadReviewsFromDatabase();
    });

    function renderReviewsTable(reviews) {
      const tbody = document.getElementById('reviews-table-body');
      if (!tbody) return;

      if (reviews.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-5 text-muted">
              <i class="bi bi-star fs-1 d-block mb-2 text-gold"></i>
              No devotee reviews found matching the filter.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = reviews.map(r => `
        <tr>
          <td>
            <div class="fw-bold text-navy text-nowrap">${r.name}</div>
          </td>
          <td class="text-nowrap"><span class="badge bg-light text-dark border">${r.product}</span></td>
          <td class="text-nowrap">
            <div class="text-warning small">
              ${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}
            </div>
          </td>
          <td class="small text-muted">
            "${r.text}"
          </td>
          <td class="small text-muted text-nowrap">${r.date}</td>
          <td class="text-nowrap">
            <span class="badge ${r.status.toLowerCase() === 'approved' ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning-emphasis'}">
              ${r.status}
            </span>
          </td>
          <td class="text-end text-nowrap">
            <button class="btn btn-sm btn-outline-success me-1" onclick="toggleReviewStatus('${r.id}', '${r.status}')" title="Toggle Approval">
              <i class="bi bi-check-circle"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteReview('${r.id}')" title="Delete Review">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function filterReviews() {
      const status = document.getElementById('review-filter').value;
      let filtered = databaseReviews.filter(r => status === 'all' || r.status.toLowerCase() === status.toLowerCase());
      renderReviewsTable(filtered);
    }

    async function toggleReviewStatus(id, currentStatus) {
      const newStatus = currentStatus.toLowerCase() === 'approved' ? 'pending' : 'approved';
      try {
        const res = await fetch(`/api/reviews/admin/${id}/status`, {
          method: 'PUT',
          headers: getAuthHeaders(),
          body: JSON.stringify({ status: newStatus })
        });
        const json = await res.json();
        if (json.success) {
          showToast(`Review status updated to ${newStatus}!`);
        } else {
          showToast(json.message || 'Updated with notice.');
        }
        await loadReviewsFromDatabase();
      } catch (e) {
        console.error('[AdminReviews] Toggle error:', e);
        showToast('Error updating review in database.');
      }
    }

    async function deleteReview(id) {
      if (!confirm('Permanently delete this review from the database?')) return;
      try {
        const res = await fetch(`/api/reviews/admin/${id}`, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });
        const json = await res.json();
        if (json.success) {
          showToast('Review permanently deleted.');
        } else {
          showToast(json.message || 'Could not delete review.');
        }
        await loadReviewsFromDatabase();
      } catch (e) {
        console.error('[AdminReviews] Delete error:', e);
        showToast('Failed to delete review.');
      }
    }
  </script>
</body>
</html>
