<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order - HariNama Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Header Placeholder -->
  <div id="hn-header-placeholder"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Search Card -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white text-center">
          <h3 class="fw-bold mb-2">Track Your Sacred Shipment 📦</h3>
          <p class="text-muted small mb-4">Enter your order reference number to view real-time transit milestones.</p>
          
          <form onsubmit="searchOrder(event)" class="d-flex gap-2 mx-auto" style="max-width: 480px;">
            <input type="text" id="tracking-input" required class="form-control" placeholder="e.g. HN-2026-98124">
            <button type="submit" class="btn hn-btn-primary px-4">Track</button>
          </form>
        </div>

        <!-- Tracking Result Card -->
        <div id="tracking-result" class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white" style="display: none;">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 pb-3 border-bottom mb-4">
            <div>
              <div class="small text-muted text-uppercase fw-bold">Order Number</div>
              <h4 class="fw-bold text-primary mb-0" id="tr-ord-number">HN-XXXX-XXXX</h4>
            </div>
            <div>
              <span class="badge px-3 py-2 rounded-pill fs-6" id="tr-status-badge">Processing</span>
            </div>
          </div>

          <!-- Visual Timeline -->
          <div class="mb-5">
            <h6 class="fw-bold text-muted small text-uppercase mb-4">Shipment Progress</h6>
            <div class="hn-timeline" id="tr-timeline-container">
              <!-- Timeline nodes injected dynamically -->
            </div>
          </div>

          <!-- Courier Details -->
          <div class="row g-3 p-3 bg-light rounded-3 mb-4">
            <div class="col-sm-6">
              <span class="small text-muted d-block">Courier Partner</span>
              <strong class="text-dark">HariNama Express Logistics</strong>
            </div>
            <div class="col-sm-6">
              <span class="small text-muted d-block">Tracking Reference</span>
              <strong class="text-dark" id="tr-tracking-number">HN-EXP-XXXXXX</strong>
            </div>
          </div>

          <!-- Items in Shipment -->
          <h6 class="fw-bold text-muted small text-uppercase mb-3">Items in Shipment</h6>
          <div class="d-flex flex-column gap-3 mb-4" id="tr-items-list">
            <!-- Items injected dynamically -->
          </div>

          <!-- Cancel Order Option -->
          <div id="cancel-order-box" class="pt-3 border-top text-end" style="display: none;">
            <button class="btn btn-outline-danger btn-sm" onclick="cancelCurrentOrder()">
              <i class="bi bi-x-circle me-1"></i> Cancel Order
            </button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/state.js"></script>
  <script src="/assets/js/components.js"></script>
  <script src="/assets/js/main.js"></script>

  <script>
    let activeOrder = null;

    const fetchOrderTracking = async (orderNum) => {
      try {
        const res = await api.get(`/orders/${orderNum}`);
        if (!res.success || !res.data) {
          showToast('Order not found. Please verify the order number.', 'danger');
          return;
        }

        activeOrder = res.data;
        renderTrackingView(activeOrder);
      } catch (err) {
        showToast(err.message, 'danger');
      }
    };

    const renderTrackingView = (ord) => {
      document.getElementById('tracking-result').style.display = 'block';
      document.getElementById('tr-ord-number').textContent = ord.order_number;

      const badge = document.getElementById('tr-status-badge');
      badge.textContent = ord.order_status.replace(/_/g, ' ').toUpperCase();
      badge.className = `badge px-3 py-2 rounded-pill fs-6 status-${ord.order_status}`;

      document.getElementById('tr-tracking-number').textContent = ord.tracking_number || 'Generated on dispatch';

      // Render Timeline
      const timelineEl = document.getElementById('tr-timeline-container');
      timelineEl.innerHTML = ord.timeline.map(t => `
        <div class="hn-timeline-step ${t.completed ? 'completed' : ''} ${t.active ? 'active' : ''}">
          <div class="fw-bold ${t.completed || t.active ? 'text-dark' : 'text-muted'}">${t.label}</div>
          ${t.date ? `<div class="small text-muted">${new Date(t.date).toLocaleString()}</div>` : '<div class="small text-muted">Pending update</div>'}
        </div>
      `).join('');

      // Render Items
      const itemsEl = document.getElementById('tr-items-list');
      itemsEl.innerHTML = ord.items.map(item => `
        <div class="d-flex align-items-center justify-content-between p-2 border rounded bg-white">
          <div class="d-flex align-items-center gap-3">
            <img src="${item.product_image || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=80&q=80'}" class="rounded" style="width: 48px; height: 48px; object-fit: cover;">
            <div>
              <div class="fw-bold small text-dark">${item.product_name}</div>
              <div class="text-muted" style="font-size: 0.75rem;">Qty: ${item.quantity} &bull; ${formatCurrency(item.price)}</div>
            </div>
          </div>
          <div class="fw-bold small">${formatCurrency(item.total)}</div>
        </div>
      `).join('');

      // Show cancel button if status is pending or confirmed
      const cancelBox = document.getElementById('cancel-order-box');
      if (['pending', 'confirmed'].includes(ord.order_status)) {
        cancelBox.style.display = 'block';
      } else {
        cancelBox.style.display = 'none';
      }
    };

    window.searchOrder = (e) => {
      e.preventDefault();
      const num = document.getElementById('tracking-input').value.trim();
      if (num) {
        window.history.pushState({}, '', `/order-tracking.html?order=${num}`);
        fetchOrderTracking(num);
      }
    };

    window.cancelCurrentOrder = async () => {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      try {
        const res = await api.post(`/orders/${activeOrder.id}/cancel`);
        if (res.success) {
          showToast('Order cancelled successfully.', 'success');
          fetchOrderTracking(activeOrder.order_number);
        }
      } catch (err) {
        showToast(err.message, 'danger');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderNum = urlParams.get('order');
      if (orderNum) {
        document.getElementById('tracking-input').value = orderNum;
        fetchOrderTracking(orderNum);
      }
    });
  </script>
</body>
</html>
