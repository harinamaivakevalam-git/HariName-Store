<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Devotional Products — Harinama Store</title>
  <meta name="description" content="Shop authentic handcrafted devotional products from Harinama Store: Sacred Books, Japa Malas, Devotional Keychains, and Gift Sets.">
  
  <!-- Google Fonts: Poppins Master Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Harinama Store Master Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css?v=12">
  <!-- Brand Favicon -->
  <link rel="icon" type="image/jpeg" href="/assets/images/krishna-logo.jpg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/images/krishna-logo.jpg">
</head>
<body>

  <!-- Top Announcement Bar & Header -->
  <div id="hn-header-placeholder"></div>

  <main class="py-4">
    <div class="container">
      
      <!-- Page Header -->
      <div class="text-center my-4">
        <h1 class="hn-section-title">Shop Devotional Products</h1>
        <div class="hn-section-subtitle">Sacred books, chanting malas, spiritual products, and holy reminders.</div>
      </div>

      <div class="row g-4 mt-2">
        
        <!-- Left Sidebar Filters -->
        <div class="col-lg-3">
          <!-- Mobile Filter Toggle Button -->
          <button class="btn btn-outline-dark w-100 d-lg-none mb-3 d-flex align-items-center justify-content-between py-2 fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#hnShopSidebarCollapse" aria-expanded="false" aria-controls="hnShopSidebarCollapse">
            <span><i class="bi bi-funnel me-2 text-warning"></i>Filter & Sort Products</span>
            <i class="bi bi-chevron-down"></i>
          </button>

          <div class="collapse d-lg-block" id="hnShopSidebarCollapse">
            <div class="hn-shop-sidebar mb-4 mb-lg-0">
              
              <!-- Search Bar -->
              <div class="mb-4">
                <div class="hn-filter-title">Search Products</div>
                <div class="position-relative">
                  <input type="text" id="hn-shop-search" class="form-control" placeholder="Search devotional items..." oninput="applyFilters()" style="padding-left: 36px; padding-right: 32px; font-size: 0.88rem; border-radius: 6px; border-color: var(--hn-border, #E2E8F0);">
                  <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-2 text-muted" style="font-size: 0.85rem; pointer-events: none;"></i>
                  <button type="button" id="hn-shop-search-clear" class="btn btn-sm btn-link position-absolute top-50 end-0 translate-middle-y me-1 text-muted text-decoration-none p-0 d-none" onclick="clearShopSearch()" title="Clear search" style="width: 24px; height: 24px; line-height: 1;">
                    <i class="bi bi-x-circle-fill" style="font-size: 0.85rem;"></i>
                  </button>
                </div>
              </div>

              <!-- Collections Filter -->
              <div class="mb-4">
                <div class="hn-filter-title">Collections & Categories</div>
                <a href="#" class="hn-filter-link active" onclick="filterByCollection('all', this); return false;">All Products</a>
                <a href="#" class="hn-filter-link" onclick="filterByCollection('devotional-keychains', this); return false;">Devotional Keychains</a>
                <a href="#" class="hn-filter-link" onclick="filterByCollection('sacred-books', this); return false;">Sacred Books & Shastras</a>
                <a href="#" class="hn-filter-link" onclick="filterByCollection('japa-chanting', this); return false;">Japa & Chanting</a>
                <a href="#" class="hn-filter-link" onclick="filterByCollection('gift-sets', this); return false;">Gift Sets & Bundles</a>
              </div>

              <!-- Price Filter -->
              <div class="mb-4">
                <div class="hn-filter-title">Price Range</div>
                <label class="hn-checkbox-label">
                  <input type="checkbox" onchange="applyFilters()" value="under-150" class="filter-price">
                  <span>Under ₹150</span>
                </label>
                <label class="hn-checkbox-label">
                  <input type="checkbox" onchange="applyFilters()" value="150-300" class="filter-price">
                  <span>₹150 – ₹300</span>
                </label>
                <label class="hn-checkbox-label">
                  <input type="checkbox" onchange="applyFilters()" value="300-600" class="filter-price">
                  <span>₹300 – ₹600</span>
                </label>
              </div>

              <!-- Material Filter -->
              <div class="mb-4">
                <div class="hn-filter-title">Material / Type</div>
                <label class="hn-checkbox-label">
                  <input type="checkbox" onchange="applyFilters()" value="Acrylic" class="filter-material">
                  <span>Acrylic / Resin</span>
                </label>
                <label class="hn-checkbox-label">
                  <input type="checkbox" onchange="applyFilters()" value="Metal" class="filter-material">
                  <span>Solid Brass / Metal</span>
                </label>
                <label class="hn-checkbox-label">
                  <input type="checkbox" onchange="applyFilters()" value="Wood" class="filter-material">
                  <span>Neem & Tulasi Wood</span>
                </label>
                <label class="hn-checkbox-label">
                  <input type="checkbox" onchange="applyFilters()" value="Hardbound Book" class="filter-material">
                  <span>Books & Shastras</span>
                </label>
              </div>

              <!-- Sort By -->
              <div>
                <div class="hn-filter-title">Sort by</div>
                <select class="form-select form-select-sm" id="hn-sort-select" onchange="applyFilters()">
                  <option value="featured">Featured First</option>
                  <option value="price-low">Price: Low to High</option>
                  <option value="price-high">Price: High to Low</option>
                  <option value="rating">Best Rating</option>
                </select>
              </div>

            </div>
          </div>
        </div>

        <!-- Right Product Grid -->
        <div class="col-lg-9">
          <div class="row g-3" id="hn-shop-grid">
            <!-- Dynamically populated from HARINAMA_DATA -->
          </div>
        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js?v=15"></script>
  <script>
    let activeCollection = 'all';

    function renderShopProducts(items) {
      const grid = document.getElementById('hn-shop-grid');
      if (!grid) return;
      if (!items || items.length === 0) {
        grid.innerHTML = '<div class="col-12 py-5 text-center text-muted"><i class="bi bi-box-seam fs-1 d-block mb-2 text-gold"></i>No products found matching your selected filters.</div>';
        return;
      }

      const wishlist = JSON.parse(localStorage.getItem('hn_wishlist') || '[]');

      grid.innerHTML = items.map(p => {
        const isWish = wishlist.includes(p.id) || (p.legacy_id && wishlist.includes(p.legacy_id)) || (p.slug && wishlist.includes(p.slug));
        return `
          <div class="col-6 col-md-4 col-lg-3">
            <div class="hn-product-card" data-product-id="${p.id}" data-legacy-id="${p.legacy_id || ''}">
              
              <button type="button" class="hn-card-wishlist ${isWish ? 'active text-danger' : ''}" onclick="toggleWishlist('${p.id}', this)" title="Wishlist" aria-label="Toggle wishlist">
                <i class="bi ${isWish ? 'bi-heart-fill text-danger' : 'bi-heart'}"></i>
              </button>

              <a href="/product-details.html?id=${p.id}" class="hn-card-img-box">
                <img src="${p.image || p.primary_image}" alt="${p.name || p.title}" loading="lazy">
              </a>

              <div class="hn-card-title">
                <a href="/product-details.html?id=${p.id}">${p.name || p.title}</a>
              </div>

              <div class="hn-card-price">
                ${formatPrice(p.price)}
              </div>

              ${renderRatingStars(p.rating, p.reviews_count)}

              <div class="d-flex flex-column gap-1 mt-auto pt-2">
                <button type="button" class="hn-btn-card-add w-100" onclick="handleAddToCart('${p.id}')">
                  Add to Cart
                </button>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    function filterByCollection(col, el) {
      activeCollection = col;
      document.querySelectorAll('.hn-filter-link').forEach(a => a.classList.remove('active'));
      if (el) el.classList.add('active');
      applyFilters();
    }

    function clearShopSearch() {
      const input = document.getElementById('hn-shop-search');
      if (input) {
        input.value = '';
        input.focus();
      }
      applyFilters();
    }

    function applyFilters() {
      let filtered = [...HARINAMA_DATA.products];

      // Search query filter
      const searchInput = document.getElementById('hn-shop-search');
      const searchQuery = (searchInput ? searchInput.value : '').toLowerCase().trim();
      const clearBtn = document.getElementById('hn-shop-search-clear');
      if (clearBtn) {
        if (searchQuery) clearBtn.classList.remove('d-none');
        else clearBtn.classList.add('d-none');
      }

      if (searchQuery) {
        filtered = filtered.filter(p => {
          const name = (p.name || '').toLowerCase();
          const title = (p.title || '').toLowerCase();
          const desc = (p.description || '').toLowerCase();
          const cat = (p.category || '').toLowerCase();
          const mat = (p.material || '').toLowerCase();
          return name.includes(searchQuery) || title.includes(searchQuery) || desc.includes(searchQuery) || cat.includes(searchQuery) || mat.includes(searchQuery);
        });
      }

      // Collection filter
      if (activeCollection !== 'all') {
        filtered = filtered.filter(p => p.category_slug === activeCollection);
      }

      // Price filters
      const checkedPrices = Array.from(document.querySelectorAll('.filter-price:checked')).map(cb => cb.value);
      if (checkedPrices.length > 0) {
        filtered = filtered.filter(p => {
          return checkedPrices.some(range => {
            if (range === 'under-150') return p.price < 150;
            if (range === '150-300') return p.price >= 150 && p.price <= 300;
            if (range === '300-600') return p.price > 300 && p.price <= 600;
            return false;
          });
        });
      }

      // Material filters
      const checkedMaterials = Array.from(document.querySelectorAll('.filter-material:checked')).map(cb => cb.value);
      if (checkedMaterials.length > 0) {
        filtered = filtered.filter(p => {
          if (!p.material) return false;
          return checkedMaterials.some(m => p.material.toLowerCase().includes(m.toLowerCase()));
        });
      }

      // Sort
      const sortVal = document.getElementById('hn-sort-select').value;
      if (sortVal === 'price-low') filtered.sort((a, b) => a.price - b.price);
      else if (sortVal === 'price-high') filtered.sort((a, b) => b.price - a.price);
      else if (sortVal === 'rating') filtered.sort((a, b) => b.rating - a.rating);

      renderShopProducts(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('shop');
      renderFooter();

      // Check URL parameters for search or category
      const urlParams = new URLSearchParams(window.location.search);
      const searchParam = urlParams.get('search') || urlParams.get('q');
      const searchInput = document.getElementById('hn-shop-search');
      if (searchParam && searchInput) {
        searchInput.value = searchParam;
      }

      const catParam = urlParams.get('category');
      if (catParam) {
        activeCollection = catParam;
        document.querySelectorAll('.hn-filter-link').forEach(a => {
          if (a.getAttribute('onclick') && a.getAttribute('onclick').includes(catParam)) {
            a.classList.add('active');
          } else {
            a.classList.remove('active');
          }
        });
      }

      applyFilters();
      window.addEventListener('hn:catalog-loaded', () => applyFilters());
      window.addEventListener('hn_wishlist_updated', () => applyFilters());
    });
  </script>
</body>
</html>
