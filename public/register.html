<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - Sample Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <!-- Header Placeholder -->
  <div id="hn-header-placeholder"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
          <div class="row g-0">
            
            <!-- Left Lavender Visual Panel -->
            <div class="col-md-5 p-5 text-center d-flex flex-column justify-content-between" style="background: var(--cres-hero-bg);">
              <div>
                <h3 class="fw-bold mb-2">Join the Sound Revolution</h3>
                <p class="text-muted small">Unlock exclusive member perks &amp; premium audio deals.</p>
              </div>

              <div class="my-4">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80" alt="Headphones" class="img-fluid rounded-4 shadow-sm" style="max-height: 200px; object-fit: contain;">
              </div>

              <div class="text-start d-flex flex-column gap-2 small text-muted">
                <div><i class="bi bi-check-circle-fill text-primary me-2"></i> Exclusive member-only deals</div>
                <div><i class="bi bi-check-circle-fill text-primary me-2"></i> Fast order tracking &amp; history</div>
                <div><i class="bi bi-check-circle-fill text-primary me-2"></i> Saved wishlist &amp; addresses</div>
              </div>
            </div>

            <!-- Right Register Form Panel -->
            <div class="col-md-7 p-5">
              <h4 class="fw-bold mb-1">Create Your Account</h4>
              <p class="text-muted small mb-4">Join Crescendo and explore a world of sound.</p>

              <form onsubmit="handleRegisterSubmit(event)">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Full Name</label>
                  <input type="text" required class="form-control rounded-pill px-3" placeholder="John Doe">
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">Email Address</label>
                  <input type="email" required class="form-control rounded-pill px-3" placeholder="john@example.com">
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">Phone Number</label>
                  <input type="tel" class="form-control rounded-pill px-3" placeholder="+1 234 567 890">
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" required minlength="6" class="form-control rounded-pill px-3" placeholder="••••••••">
                  </div>
                  <div class="col-6">
                    <label class="form-label small fw-bold">Confirm Password</label>
                    <input type="password" required minlength="6" class="form-control rounded-pill px-3" placeholder="••••••••">
                  </div>
                </div>

                <div class="form-check mb-4 small">
                  <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                  <label class="form-check-label text-muted" for="termsCheck">
                    I agree to the <a href="/terms.html" class="text-primary">Terms &amp; Conditions</a>
                  </label>
                </div>

                <button type="submit" class="btn cres-btn-primary w-100 py-3 fw-bold mb-3">
                  Create Account
                </button>

                <div class="d-flex flex-column gap-2 mb-4">
                  <button type="button" class="btn btn-outline-secondary rounded-pill py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2" onclick="showToast('Sign up with Google simulated', 'info')">
                    <i class="bi bi-google text-danger"></i> Sign up with Google
                  </button>
                  <button type="button" class="btn btn-outline-secondary rounded-pill py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2" onclick="showToast('Sign up with Apple simulated', 'info')">
                    <i class="bi bi-apple text-dark"></i> Sign up with Apple
                  </button>
                </div>

                <div class="text-center small text-muted">
                  Already have an account? <a href="/login.html" class="text-primary fw-bold">Login</a>
                </div>
              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('');
      renderFooter();
    });

    window.handleRegisterSubmit = (e) => {
      e.preventDefault();
      showToast('Account created successfully! Welcome to CRESCENDO 🎧', 'success');
      setTimeout(() => {
        window.location.href = '/account.html';
      }, 900);
    };
  </script>
</body>
</html>
