<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders - Sample Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .admin-layout {
      min-height: 100vh;
      background: var(--cres-body-bg);
    }
    .admin-sidebar {
      width: 260px;
      background: #FFFFFF;
      border-right: 1px solid var(--cres-border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 16px;
    }
    .admin-main {
      flex: 1;
      padding: 30px 40px;
    }
    @media (max-width: 991.98px) {
      .admin-sidebar {
        position: fixed;
        left: -280px;
        z-index: 1050;
        transition: left 0.3s ease;
      }
      .admin-sidebar.show {
        left: 0;
      }
      .admin-main {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Reusable CRESCENDO Header -->
  <div id="cres-header-placeholder"></div>

  <div class="d-flex admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
      <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <span class="cres-brand-dot"></span>
        <h5 class="fw-bold mb-0 text-dark">Admin Portal</h5>
      </div>

      <nav class="nav flex-column gap-1 flex-grow-1">
        <a href="/admin.html" class="cres-dash-nav-item">
          <i class="bi bi-grid-fill"></i> Dashboard
        </a>
        <a href="/admin-products.html" class="cres-dash-nav-item">
          <i class="bi bi-box-seam"></i> Products
        </a>
        <a href="/admin-categories.html" class="cres-dash-nav-item">
          <i class="bi bi-tags"></i> Categories
        </a>
        <a href="/admin-orders.html" class="cres-dash-nav-item active">
          <i class="bi bi-receipt"></i> Orders
        </a>
        <a href="/admin-customers.html" class="cres-dash-nav-item">
          <i class="bi bi-people"></i> Customers
        </a>
        <a href="/admin-coupons.html" class="cres-dash-nav-item">
          <i class="bi bi-ticket-perforated"></i> Coupons
        </a>
        <a href="/admin-reviews.html" class="cres-dash-nav-item">
          <i class="bi bi-star"></i> Reviews
        </a>
        <a href="/admin-analytics.html" class="cres-dash-nav-item">
          <i class="bi bi-graph-up-arrow"></i> Analytics
        </a>
        <a href="/admin-settings.html" class="cres-dash-nav-item">
          <i class="bi bi-gear"></i> Settings
        </a>
      </nav>

      <div class="pt-3 border-top">
        <a href="/login.html" class="cres-dash-nav-item text-danger">
          <i class="bi bi-box-arrow-right"></i> Logout
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
          <h2 class="cres-page-title mb-1">Orders</h2>
          <p class="text-muted small mb-0">Track and manage customer fulfillment</p>
        </div>
      </div>

      <!-- Filters & Search Card -->
      <div class="cres-card p-4 mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-md-7">
            <div class="input-group">
              <span class="input-group-text bg-light border-0 ps-3 text-muted"><i class="bi bi-search"></i></span>
              <input type="text" id="adminOrderSearch" class="form-control bg-light border-0 py-2" placeholder="Search orders..." oninput="filterAdminOrders()">
            </div>
          </div>
          <div class="col-md-5">
            <select class="form-select bg-light border-0 py-2" id="adminOrderStatusFilter" onchange="filterAdminOrders()">
              <option value="">All Status</option>
              <option value="delivered">Delivered</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Orders Table Card -->
      <div class="cres-card p-4">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="text-muted small text-uppercase fw-bold border-bottom">
              <tr>
                <th scope="col" class="py-3">Order ID</th>
                <th scope="col" class="py-3">Customer</th>
                <th scope="col" class="py-3">Date</th>
                <th scope="col" class="py-3">Total</th>
                <th scope="col" class="py-3">Status</th>
                <th scope="col" class="py-3 text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="adminOrdersTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Admin View Order Modal -->
  <div class="modal fade" id="adminOrderViewModal" tabindex="-1" aria-labelledby="adminOrderViewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom p-4">
          <h5 class="modal-title fw-bold" id="adminOrderViewModalLabel">Order Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="admin-order-modal-body">
          <!-- Injected dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Admin Change Status Modal -->
  <div class="modal fade" id="adminOrderStatusModal" tabindex="-1" aria-labelledby="adminOrderStatusModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom p-3">
          <h6 class="modal-title fw-bold" id="adminOrderStatusModalLabel">Update Order Status</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <input type="hidden" id="statusTargetOrderId">
          <label class="form-label small fw-semibold">Fulfillment Status</label>
          <select class="form-select rounded-pill px-3 mb-4" id="statusSelectorInput">
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <button type="button" class="btn btn-cres-primary rounded-pill w-100 py-2 fw-semibold" onclick="saveAdminOrderStatus()">Update Status</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable CRESCENDO Footer -->
  <div id="cres-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let viewModalInstance = null;
    let statusModalInstance = null;

    function getAdminOrders() {
      const stored = localStorage.getItem('cres_orders');
      if (stored) {
        try { return JSON.parse(stored); } catch (e) {}
      }
      return window.CRESCENDO_DATA.orders;
    }

    function renderAdminOrdersTable(ordersToRender) {
      const tbody = document.getElementById('adminOrdersTableBody');
      if (!tbody) return;

      const ords = ordersToRender || getAdminOrders();

      tbody.innerHTML = ords.map(ord => {
        let badgeClass = 'bg-success-subtle text-success border border-success-subtle';
        let statusName = 'Delivered';
        if (ord.status === 'processing') {
          badgeClass = 'bg-warning-subtle text-warning-emphasis border border-warning-subtle';
          statusName = 'Processing';
        } else if (ord.status === 'shipped') {
          badgeClass = 'bg-info-subtle text-info-emphasis border border-info-subtle';
          statusName = 'Shipped';
        } else if (ord.status === 'cancelled') {
          badgeClass = 'bg-danger-subtle text-danger border border-danger-subtle';
          statusName = 'Cancelled';
        }

        return `
          <tr>
            <td class="fw-bold font-monospace text-dark">${ord.order_number}</td>
            <td>
              <div class="fw-bold text-dark">${ord.customer_name}</div>
              <div class="text-muted small">${ord.customer_email}</div>
            </td>
            <td class="text-muted">${ord.date}</td>
            <td class="fw-bold text-dark">$${Number(ord.total).toFixed(2)}</td>
            <td>
              <span class="badge ${badgeClass} rounded-pill px-3 py-1 fw-semibold small">${statusName}</span>
            </td>
            <td class="text-end">
              <div class="d-flex align-items-center justify-content-end gap-2">
                <button class="btn btn-sm btn-light rounded-circle shadow-sm" title="View details" onclick="openAdminOrderView('${ord.id || ord.order_number}')" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;">
                  <i class="bi bi-eye text-dark fs-6"></i>
                </button>
                <button class="btn btn-sm btn-light rounded-circle shadow-sm" title="Change Status" onclick="openAdminOrderStatusModal('${ord.id || ord.order_number}', '${ord.status || ord.order_status || 'processing'}')" style="width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center;">
                  <i class="bi bi-pencil text-primary fs-6"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterAdminOrders() {
      const q = (document.getElementById('adminOrderSearch').value || '').toLowerCase();
      const status = document.getElementById('adminOrderStatusFilter').value;
      const allOrders = getAdminOrders();

      const filtered = allOrders.filter(o => {
        const orderNum = (o.order_number || o.id || '').toLowerCase();
        const custName = (o.customer_name || (o.shipping_address && o.shipping_address.name) || '').toLowerCase();
        const custEmail = (o.customer_email || '').toLowerCase();
        const matchesQuery = orderNum.includes(q) || custName.includes(q) || custEmail.includes(q);
        const ordStatus = (o.status || o.order_status || 'processing').toLowerCase();
        const matchesStatus = !status || ordStatus === status;
        return matchesQuery && matchesStatus;
      });

      renderAdminOrdersTable(filtered);
    }

    function openAdminOrderView(id) {
      if (!viewModalInstance) viewModalInstance = new bootstrap.Modal(document.getElementById('adminOrderViewModal'));
      const allOrders = getAdminOrders();
      const ord = allOrders.find(o => (o.id === id || o.order_number === id || String(o.id) === String(id)));
      if (!ord) return;

      const body = document.getElementById('admin-order-modal-body');
      const status = ord.status || ord.order_status || 'processing';
      const items = ord.items && ord.items.length > 0 ? ord.items : [{
        name: ord.product_name || 'Pro X168A Headphones',
        color: ord.color || 'Standard',
        quantity: ord.quantity || ord.qty || 1,
        price: ord.total || 250.00,
        image: ord.product_image || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=80&q=80'
      }];

      body.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h5 class="fw-bold mb-0">${ord.order_number || ord.id}</h5>
            <span class="text-muted small">Placed on ${ord.date || (ord.created_at ? new Date(ord.created_at).toLocaleDateString() : 'Today')}</span>
          </div>
          <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1 text-capitalize">${status}</span>
        </div>
        <div class="d-flex flex-column gap-2 mb-3">
          ${items.map(item => `
            <div class="p-3 bg-light rounded-3 d-flex align-items-center gap-3">
              <img src="${item.image || item.product_image || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=80&q=80'}" style="width: 48px; height: 48px; object-fit: contain;">
              <div class="flex-grow-1">
                <div class="fw-bold text-dark">${item.name || item.product_name || 'Audio Item'}</div>
                <div class="text-muted small">Color: ${item.color || 'Standard'} | Qty: ${item.quantity || item.qty || 1}</div>
              </div>
              <div class="fw-bold fs-6 text-primary">$${Number(item.total || item.price || 0).toFixed(2)}</div>
            </div>
          `).join('')}
        </div>
        <div class="small bg-white p-3 border rounded-3">
          <div class="d-flex justify-content-between py-1 text-muted"><span>Customer:</span> <strong class="text-dark">${ord.customer_name || (ord.shipping_address && ord.shipping_address.name) || 'Customer'}</strong></div>
          <div class="d-flex justify-content-between py-1 text-muted"><span>Email:</span> <strong class="text-dark">${ord.customer_email || 'customer@example.com'}</strong></div>
          <div class="d-flex justify-content-between py-1 text-muted"><span>Payment:</span> <strong class="text-dark">${ord.payment_method || 'Verified Online Payment'}</strong></div>
          <div class="d-flex justify-content-between py-1 text-muted"><span>Delivery:</span> <strong class="text-success">Express Tracked Carrier</strong></div>
        </div>
      `;
      viewModalInstance.show();
    }

    function openAdminOrderStatusModal(id, currentStatus) {
      if (!statusModalInstance) statusModalInstance = new bootstrap.Modal(document.getElementById('adminOrderStatusModal'));
      document.getElementById('statusTargetOrderId').value = id;
      document.getElementById('statusSelectorInput').value = (currentStatus || 'processing').toLowerCase();
      statusModalInstance.show();
    }

    function saveAdminOrderStatus() {
      const id = document.getElementById('statusTargetOrderId').value;
      const newStatus = document.getElementById('statusSelectorInput').value;

      let allOrders = getAdminOrders();
      const target = allOrders.find(o => (o.id === id || o.order_number === id || String(o.id) === String(id)));
      if (target) {
        target.status = newStatus;
        target.order_status = newStatus;
        localStorage.setItem('cres_orders', JSON.stringify(allOrders));
        if (window.CRESCENDO_DATA) window.CRESCENDO_DATA.orders = allOrders;
        if (statusModalInstance) statusModalInstance.hide();
        filterAdminOrders();
        showToast(`Order status updated to "${newStatus}".`, 'success');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderAdminOrdersTable();
    });
  </script>
</body>
</html>
