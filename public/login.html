<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hari Nama Store</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-light">

  <!-- Header Placeholder -->
  <div id="hn-header-placeholder"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
          <div class="row g-0">
            
            <!-- Left Lavender Visual Panel -->
            <div class="col-md-5 p-5 text-center d-flex flex-column justify-content-between" style="background: var(--cres-hero-bg);">
              <div>
                <h3 class="fw-bold mb-2">Welcome Back</h3>
                <p class="text-muted small">Login to your account and continue your musical journey.</p>
              </div>

              <div class="my-4">
                <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=400&q=80" alt="Earbuds" class="img-fluid rounded-4 shadow-sm" style="max-height: 220px; object-fit: contain;">
              </div>

              <div>
                <p class="fw-semibold text-primary small mb-0">Experience music like never before.</p>
              </div>
            </div>

            <!-- Right Login Form Panel -->
            <div class="col-md-7 p-5">
              <h4 class="fw-bold mb-4">Login</h4>

              <form onsubmit="handleLoginSubmit(event)">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Email Address</label>
                  <input type="email" required class="form-control rounded-pill px-3" placeholder="user@example.com" value="john@example.com">
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">Password</label>
                  <input type="password" required class="form-control rounded-pill px-3" placeholder="••••••••" value="password123">
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 small">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                  </div>
                  <a href="/forgot-password.html" class="text-primary fw-semibold">Forgot Password?</a>
                </div>

                <button type="submit" class="btn cres-btn-primary w-100 py-3 fw-bold mb-3">
                  Login
                </button>

                <div class="text-center text-muted small my-3">or</div>

                <div class="d-flex flex-column gap-2 mb-4">
                  <button type="button" class="btn btn-outline-secondary rounded-pill py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2" onclick="showToast('Google login simulated', 'info')">
                    <i class="bi bi-google text-danger"></i> Continue with Google
                  </button>
                  <button type="button" class="btn btn-outline-secondary rounded-pill py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2" onclick="showToast('Apple login simulated', 'info')">
                    <i class="bi bi-apple text-dark"></i> Continue with Apple
                  </button>
                </div>

                <div class="text-center small text-muted">
                  Don't have an account? <a href="/register.html" class="text-primary fw-bold">Sign Up</a>
                </div>
              </form>
            </div>

          </div>
        </div>

        <!-- Bottom Trust Strip (Matching Reference) -->
        <div class="row g-4 mt-4 text-center">
          <div class="col-md-4">
            <div class="p-3 bg-white rounded-4 border d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-shield-lock text-primary fs-5"></i>
              <span class="small fw-semibold">Secure Login</span>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 bg-white rounded-4 border d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-person-check text-primary fs-5"></i>
              <span class="small fw-semibold">Your Data is Safe</span>
            </div>
          </div>
          <div class="col-md-4">
            <div class="p-3 bg-white rounded-4 border d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-lightning text-primary fs-5"></i>
              <span class="small fw-semibold">Easy Access</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer Placeholder -->
  <div id="hn-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('');
      renderFooter();
    });

    window.handleLoginSubmit = (e) => {
      e.preventDefault();
      showToast('Welcome back, John! 🎧', 'success');
      setTimeout(() => {
        window.location.href = '/account.html';
      }, 900);
    };
  </script>
</body>
</html>
