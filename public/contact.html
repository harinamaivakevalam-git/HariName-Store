<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get In Touch - Sample Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <!-- Reusable CRESCENDO Header -->
  <div id="cres-header-placeholder"></div>

  <!-- Main Container -->
  <main class="container py-5">
    <div class="mb-4">
      <h1 class="display-6 fw-bold mb-1">Get In Touch</h1>
      <p class="text-muted">We'd love to hear from you.</p>
    </div>

    <div class="row g-4 align-items-stretch">
      <!-- Left Column: Contact Details Cards Matching Reference -->
      <div class="col-lg-5">
        <div class="d-flex flex-column gap-3 h-100 justify-content-between">
          <!-- Email -->
          <div class="cres-card p-4 d-flex align-items-center gap-3">
            <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; flex-shrink: 0;">
              <i class="bi bi-envelope fs-5"></i>
            </div>
            <div>
              <div class="text-muted small fw-semibold">Email</div>
              <div class="fw-bold text-dark">support@crescendo.com</div>
            </div>
          </div>

          <!-- Phone -->
          <div class="cres-card p-4 d-flex align-items-center gap-3">
            <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; flex-shrink: 0;">
              <i class="bi bi-telephone fs-5"></i>
            </div>
            <div>
              <div class="text-muted small fw-semibold">Phone</div>
              <div class="fw-bold text-dark">+1 234 567 890</div>
            </div>
          </div>

          <!-- Location -->
          <div class="cres-card p-4 d-flex align-items-center gap-3">
            <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; flex-shrink: 0;">
              <i class="bi bi-geo-alt fs-5"></i>
            </div>
            <div>
              <div class="text-muted small fw-semibold">Location</div>
              <div class="fw-bold text-dark">123 Music Street, New York, NY</div>
            </div>
          </div>

          <!-- Hours -->
          <div class="cres-card p-4 d-flex align-items-center gap-3">
            <div class="rounded-circle bg-primary-subtle text-primary d-flex align-items-center justify-content-center" style="width: 50px; height: 50px; flex-shrink: 0;">
              <i class="bi bi-clock fs-5"></i>
            </div>
            <div>
              <div class="text-muted small fw-semibold">Hours</div>
              <div class="fw-bold text-dark">Mon - Sun: 9AM - 6PM</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Contact Form Matching Reference -->
      <div class="col-lg-7">
        <div class="cres-card p-4 p-md-5 h-100">
          <h4 class="fw-bold mb-4">Send us a Message</h4>

          <form onsubmit="handleContactSubmit(event)">
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Your Name</label>
              <input type="text" class="form-control form-control-lg rounded-pill px-4" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Your Email</label>
              <input type="email" class="form-control form-control-lg rounded-pill px-4" placeholder="Enter your email address" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Subject</label>
              <input type="text" class="form-control form-control-lg rounded-pill px-4" placeholder="How can we help?" required>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-semibold text-muted">Message</label>
              <textarea class="form-control rounded-4 p-3" rows="4" placeholder="Type your message here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-cres-primary rounded-pill w-100 py-3 fw-semibold fs-6">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- Reusable CRESCENDO Footer -->
  <div id="cres-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    function handleContactSubmit(e) {
      e.preventDefault();
      e.target.reset();
      window.cresShowToast('Thank you! Your message has been sent to our team.');
    }
  </script>
</body>
</html>
