<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Coupons - Sample Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .admin-layout { min-height: 100vh; background: var(--cres-body-bg); }
    .admin-sidebar { width: 260px; background: #FFFFFF; border-right: 1px solid var(--cres-border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; padding: 24px 16px; }
    .admin-main { flex: 1; padding: 30px 40px; }
    @media (max-width: 991.98px) {
      .admin-sidebar { position: fixed; left: -280px; z-index: 1050; transition: left 0.3s ease; }
      .admin-sidebar.show { left: 0; }
      .admin-main { padding: 20px 15px; }
    }
  </style>
</head>
<body>

  <!-- Reusable CRESCENDO Header -->
  <div id="cres-header-placeholder"></div>

  <div class="d-flex admin-layout">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
      <div class="d-flex align-items-center gap-2 mb-4 px-2">
        <span class="cres-brand-dot"></span>
        <h5 class="fw-bold mb-0 text-dark">Admin Portal</h5>
      </div>

      <nav class="nav flex-column gap-1 flex-grow-1">
        <a href="/admin.html" class="cres-dash-nav-item">
          <i class="bi bi-grid-fill"></i> Dashboard
        </a>
        <a href="/admin-products.html" class="cres-dash-nav-item">
          <i class="bi bi-box-seam"></i> Products
        </a>
        <a href="/admin-categories.html" class="cres-dash-nav-item">
          <i class="bi bi-tags"></i> Categories
        </a>
        <a href="/admin-orders.html" class="cres-dash-nav-item">
          <i class="bi bi-receipt"></i> Orders
        </a>
        <a href="/admin-customers.html" class="cres-dash-nav-item">
          <i class="bi bi-people"></i> Customers
        </a>
        <a href="/admin-coupons.html" class="cres-dash-nav-item active">
          <i class="bi bi-ticket-perforated"></i> Coupons
        </a>
        <a href="/admin-reviews.html" class="cres-dash-nav-item">
          <i class="bi bi-star"></i> Reviews
        </a>
        <a href="/admin-analytics.html" class="cres-dash-nav-item">
          <i class="bi bi-graph-up-arrow"></i> Analytics
        </a>
        <a href="/admin-settings.html" class="cres-dash-nav-item">
          <i class="bi bi-gear"></i> Settings
        </a>
      </nav>

      <div class="pt-3 border-top">
        <a href="/login.html" class="cres-dash-nav-item text-danger">
          <i class="bi bi-box-arrow-right"></i> Logout
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
          <h2 class="cres-page-title mb-1">Promo Coupons & Discounts</h2>
          <p class="text-muted small mb-0">Create promotional codes, discount percentages & limits</p>
        </div>
        <div>
          <button class="btn btn-cres-primary rounded-pill px-4 fw-semibold" onclick="openAddCouponModal()">
            <i class="bi bi-plus-lg me-1"></i> Create Coupon
          </button>
        </div>
      </div>

      <!-- Coupons Table Card -->
      <div class="cres-card p-4">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="text-muted small text-uppercase">
              <tr>
                <th>Coupon Code</th>
                <th>Discount</th>
                <th>Min Spend</th>
                <th>Usage Count</th>
                <th>Status</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="coupons-tbody">
              <!-- Injected dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Coupon Modal -->
  <div class="modal fade" id="couponModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom p-4">
          <h5 class="modal-title fw-bold" id="coupModalTitle">Create Coupon</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="couponForm" onsubmit="handleCouponSave(event)">
            <input type="hidden" id="coupEditId">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Coupon Code</label>
              <input type="text" class="form-control rounded-pill px-3 text-uppercase" id="coupCode" required placeholder="e.g. SUMMER50">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Discount Amount ($)</label>
                <input type="number" step="0.01" class="form-control rounded-pill px-3" id="coupDiscount" required placeholder="100.00">
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Min Spend ($)</label>
                <input type="number" step="0.01" class="form-control rounded-pill px-3" id="coupMinSpend" placeholder="200.00" value="0.00">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-semibold">Status</label>
              <select class="form-select rounded-pill px-3" id="coupStatus">
                <option value="Active">Active</option>
                <option value="Expired">Expired</option>
                <option value="Disabled">Disabled</option>
              </select>
            </div>
            <button type="submit" class="btn btn-cres-primary rounded-pill w-100 py-2 fw-semibold">Save Coupon</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable CRESCENDO Footer -->
  <div id="cres-footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    let couponsList = [];
    let coupModal = null;

    const defaultCoupons = [
      { id: 'cp-1', code: 'SAVE100', discount: 100.00, minSpend: 250.00, used: 142, status: 'Active' },
      { id: 'cp-2', code: 'WELCOME10', discount: 100.00, minSpend: 100.00, used: 310, status: 'Active' },
      { id: 'cp-3', code: 'SAMPLE10', discount: 100.00, minSpend: 150.00, used: 88, status: 'Active' },
      { id: 'cp-4', code: 'VIPAUDIO', discount: 150.00, minSpend: 400.00, used: 45, status: 'Active' },
      { id: 'cp-5', code: 'FLASH2025', discount: 50.00, minSpend: 100.00, used: 520, status: 'Expired' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      renderHeader('');
      renderFooter();
      coupModal = new bootstrap.Modal(document.getElementById('couponModal'));
      loadCoupons();
    });

    function loadCoupons() {
      const stored = localStorage.getItem('cres_admin_coupons');
      couponsList = stored ? JSON.parse(stored) : defaultCoupons;
      renderCouponsTable();
    }

    function renderCouponsTable() {
      const tbody = document.getElementById('coupons-tbody');
      tbody.innerHTML = couponsList.map((c, idx) => `
        <tr>
          <td>
            <div class="d-flex align-items-center gap-2">
              <span class="badge bg-primary-subtle text-primary fs-6 px-3 py-2 rounded-pill font-monospace">${c.code}</span>
              <button class="btn btn-sm btn-link text-muted p-0" onclick="copyCouponCode('${c.code}')" title="Copy Code"><i class="bi bi-clipboard"></i></button>
            </div>
          </td>
          <td class="fw-bold text-success">-$${Number(c.discount).toFixed(2)}</td>
          <td class="text-muted">$${Number(c.minSpend || 0).toFixed(2)}</td>
          <td><span class="badge bg-light text-dark border px-3 py-2 rounded-pill">${c.used || 0} times</span></td>
          <td><span class="badge ${c.status === 'Active' ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'} rounded-pill px-3 py-2">${c.status}</span></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary rounded-pill me-1" onclick="editCoupon(${idx})"><i class="bi bi-pencil me-1"></i> Edit</button>
            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteCoupon(${idx})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function copyCouponCode(code) {
      navigator.clipboard.writeText(code);
      showToast(`Copied coupon "${code}" to clipboard!`, 'info');
    }

    function openAddCouponModal() {
      document.getElementById('couponForm').reset();
      document.getElementById('coupEditId').value = '';
      document.getElementById('coupModalTitle').textContent = 'Create Coupon';
      coupModal.show();
    }

    function editCoupon(idx) {
      const c = couponsList[idx];
      document.getElementById('coupEditId').value = idx;
      document.getElementById('coupCode').value = c.code;
      document.getElementById('coupDiscount').value = c.discount;
      document.getElementById('coupMinSpend').value = c.minSpend || 0;
      document.getElementById('coupStatus').value = c.status || 'Active';
      document.getElementById('coupModalTitle').textContent = 'Edit Coupon';
      coupModal.show();
    }

    function handleCouponSave(e) {
      e.preventDefault();
      const editIdx = document.getElementById('coupEditId').value;
      const coupData = {
        id: editIdx !== '' ? couponsList[editIdx].id : 'cp-' + Date.now(),
        code: document.getElementById('coupCode').value.trim().toUpperCase(),
        discount: parseFloat(document.getElementById('coupDiscount').value) || 0,
        minSpend: parseFloat(document.getElementById('coupMinSpend').value) || 0,
        status: document.getElementById('coupStatus').value,
        used: editIdx !== '' ? couponsList[editIdx].used : 0
      };

      if (editIdx !== '') {
        couponsList[editIdx] = coupData;
        showToast('Coupon updated successfully!', 'success');
      } else {
        couponsList.unshift(coupData);
        showToast('Coupon created successfully!', 'success');
      }

      localStorage.setItem('cres_admin_coupons', JSON.stringify(couponsList));
      renderCouponsTable();
      coupModal.hide();
    }

    function deleteCoupon(idx) {
      if (!confirm(`Delete coupon "${couponsList[idx].code}"?`)) return;
      couponsList.splice(idx, 1);
      localStorage.setItem('cres_admin_coupons', JSON.stringify(couponsList));
      renderCouponsTable();
      showToast('Coupon removed.', 'info');
    }
  </script>
</body>
</html>
